apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: longhorn-system

resources:
  - namespace.yaml
  - http-route.yaml
  - recurring-jobs.yaml
  - s3-external-secret.yaml
  - storage-class-critical.yaml
  - storage-class-observability.yaml

helmCharts:
  - name: longhorn
    repo: https://charts.longhorn.io
    version: 1.10.1
    releaseName: longhorn
    namespace: longhorn-system
    valuesFile: values.yaml
    includeCRDs: true
    kubeVersion: v1.31.1

patches:
  - path: deployment-hardening-patch.yaml
