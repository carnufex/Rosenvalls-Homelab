apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: default-hourly-snapshot
  namespace: longhorn-system
spec:
  name: default-hourly-snapshot
  task: snapshot
  cron: "0 * * * *"
  retain: 24
  concurrency: 2
  groups:
    - default
  labels:
    backup-tier: default
    cadence: hourly
