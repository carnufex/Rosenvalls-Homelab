apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: default-hourly-snapshot
  namespace: longhorn-system
spec:
  name: default-hourly-snapshot
  task: snapshot
  cron: "0 * * * *"
  retain: 24
  concurrency: 2
  groups:
    - default
  labels:
    backup-tier: default
    cadence: hourly
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: default-daily-backup
  namespace: longhorn-system
spec:
  name: default-daily-backup
  task: backup
  cron: "30 3 * * *"
  retain: 14
  concurrency: 2
  groups:
    - default
  labels:
    backup-tier: default
    cadence: daily
