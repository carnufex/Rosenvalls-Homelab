apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: default-hourly-snapshot
  namespace: longhorn-system
spec:
  name: default-hourly-snapshot
  task: snapshot
  cron: "30 2 * * *"
  retain: 7
  concurrency: 1
  groups:
    - default
  labels:
    backup-tier: default
    cadence: daily
