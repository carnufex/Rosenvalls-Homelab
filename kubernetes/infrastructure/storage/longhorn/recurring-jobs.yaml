# Recurring-job groups (a volume joins one through a PVC/volume label
# recurring-job-group.longhorn.io/<group>: enabled; unlabelled volumes are "default"):
#   default     app config and data: 2 local snapshots, 7 daily backups to host1, weekly trim
#   cnpg        CloudNativePG data+WAL: weekly trim only, backed up by nightly pg_dump CronJobs
#   disposable  Prometheus TSDB, Loki: weekly trim only, never snapshotted or backed up
# Seven local snapshots of churny volumes pinned overwritten blocks until a 10 GiB
# volume used 22 GiB of node disk; off-node backups replace the long local history.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  # Legacy name kept so Longhorn does not run a second snapshot job.
  name: default-hourly-snapshot
  namespace: longhorn-system
spec:
  name: default-hourly-snapshot
  task: snapshot
  cron: "30 2 * * *"
  retain: 2
  concurrency: 1
  groups:
    - default
  labels:
    backup-tier: default
    cadence: daily
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: default-daily-backup
  namespace: longhorn-system
spec:
  name: default-daily-backup
  task: backup
  cron: "0 3 * * *"
  retain: 7
  concurrency: 2
  groups:
    - default
  labels:
    backup-tier: default
    cadence: daily
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-filesystem-trim
  namespace: longhorn-system
spec:
  name: weekly-filesystem-trim
  task: filesystem-trim
  cron: "0 4 * * 0"
  retain: 0
  concurrency: 1
  groups:
    - default
    - cnpg
    - disposable
