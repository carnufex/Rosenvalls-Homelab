crdConversion:
  enabled: false

metrics:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
    annotations: {}
    interval: '30s'
    scrapeTimeout: '10s'
    relabelings: []
  metricRelabelings: []

csi:
  attacherReplicaCount: 2
  provisionerReplicaCount: 2
  resizerReplicaCount: 2
  snapshotterReplicaCount: 2
  kubeletRootDir: /var/lib/kubelet
  plugin:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 128Mi
  provisioner:
    resources:
      requests:
        cpu: 55m
        memory: 68Mi
      limits:
        cpu: 55m
        memory: 68Mi
  attacher:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 50m
        memory: 64Mi
  resizer:
    resources:
      requests:
        cpu: 45m
        memory: 60Mi
      limits:
        cpu: 45m
        memory: 60Mi
  snapshotter:
    resources:
      requests:
        cpu: 60m
        memory: 70Mi
      limits:
        cpu: 60m
        memory: 70Mi

defaultSettings:
  allowRecurringJobWhileVolumeDetached: true
  createDefaultDiskLabeledNodes: true
  defaultReplicaCount: 2
  guaranteedEngineManagerCPU: 0.2
  guaranteedReplicaManagerCPU: 0.2
  # Keep enough thin-provisioning flexibility for small homelab volumes without
  # allowing a 100 GiB disk to accept 300 GiB of nominal replica allocations.
  storageOverProvisioningPercentage: 200
  storageReservedPercentageForDefaultDisk: 10
  storageMinimalAvailablePercentage: 10
  # Tolerate short virtualization/network latency spikes before a responsive
  # replica is evicted. Longhorn permits 8-30 seconds for the V1 engine.
  engineReplicaTimeout: 15
  taintToleration: 'true'
  defaultDataPath: /var/lib/longhorn/
  autoDeletePodWhenVolumeDetachedUnexpectedly: true
  autoSalvage: true
  nodeDownPodDeletionPolicy: delete-deployment-pod
  # Single-zone homelab: nodes without topology.kubernetes.io/zone are treated as the same zone.
  # Keep zone anti-affinity soft so 2-replica volumes can still place one replica per worker.
  replicaZoneSoftAntiAffinity: true
  concurrentReplicaRebuildPerNodeLimit: 1
  # Rebalance replicas off full nodes onto emptier ones. Without this, a node
  # reboot (e.g. growing worker-01's disk) rebuilds its replicas elsewhere and
  # they never move back, leaving one node empty while others hit 95% full.
  replicaAutoBalance: best-effort
  replicaReplenishmentWaitInterval: 600
  backupstorePollInterval: 86400
  orphanResourceAutoDeletion: instance
  orphanResourceAutoDeletionGracePeriod: 300
  replicaSoftAntiAffinity: false
  concurrentAutomaticEngineUpgradePerNodeLimit: 3
  allowVolumeCreationWithDegradedAvailability: false

persistence:
  defaultClass: true
  defaultClassReplicaCount: 2
  reclaimPolicy: Retain
  defaultFsType: ext4
  snapshotMaxCount: 60
  defaultDataLocality: best-effort

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

ingress:
  enabled: false
  ingressClassName: cilium
  host: longhorn.rosenvall.local
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls: true
  tlsSecret: longhorn-tls

longhornManager:
  priorityClass: system-cluster-critical
  tolerations:
    - key: "gpu"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 256Mi

longhornDriver:
  priorityClass: system-cluster-critical

preUpgradeChecker:
  jobEnabled: false
