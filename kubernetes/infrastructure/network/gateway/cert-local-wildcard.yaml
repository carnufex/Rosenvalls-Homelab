apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-local-wildcard
  namespace: gateway
spec:
  secretName: cert-local-wildcard
  commonName: "*.rosenvall.local"
  dnsNames:
    - "*.rosenvall.local"
    - rosenvall.local
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: gateway-local-ca-issuer
    kind: Issuer
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - server auth
    - digital signature
    - key encipherment
