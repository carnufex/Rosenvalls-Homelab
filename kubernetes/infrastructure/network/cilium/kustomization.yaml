apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - announce.yaml
  - ip-pool.yaml

helmCharts:
  - name: cilium
    repo: https://helm.cilium.io/
    version: 1.20.1
    releaseName: cilium
    namespace: kube-system
    valuesFile: values.yaml
    kubeVersion: v1.37.0

patches:
  - path: deployment-hardening-patch.yaml
