ipam:
  mode: kubernetes

kubeProxyReplacement: true

upgradeCompatibility: "1.16"

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Talos KubePrism: varje nod kör en lokal lastbalanserare mot samtliga
# control-plane-endpoints på 127.0.0.1:7445. Pekade tidigare rakt på
# control-01, vilket gjorde varje omstart av den noden till en enskild
# felpunkt för hela dataplanet. VIP:en 192.168.1.200 finns (kubeconfig
# använder den), men KubePrism är det Talos rekommenderar för Cilium.
k8sServiceHost: localhost
k8sServicePort: 7445

l2announcements:
  enabled: true

externalIPs:
  enabled: false

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true

ingressController:
  enabled: false
  default: true
  loadbalancerMode: dedicated
  service:
    allocateLoadBalancerNodePorts: false

gatewayAPI:
  enabled: true
