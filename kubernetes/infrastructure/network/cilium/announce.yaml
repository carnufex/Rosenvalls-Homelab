apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default-l2-announcement-policy
  namespace: kube-system
spec:
  # Announce (ARP) LoadBalancer IPs for the gateway services AND the gatebound
  # namespace (TFS game server pins .223). Without this the IP is allocated but
  # never advertised on the LAN, so it's unreachable. Matches the first-pool
  # serviceSelector — by namespace, not gateway service name.
  serviceSelector:
    matchExpressions:
      - key: io.kubernetes.service.namespace
        operator: In
        values:
          - gateway
          - gatebound
  externalIPs: false
  loadBalancerIPs: true
