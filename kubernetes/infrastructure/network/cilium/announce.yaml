apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default-l2-announcement-policy
  namespace: kube-system
spec:
  # Announce (ARP) LoadBalancer IPs for the gateway services, the gatebound
  # namespace (TFS game server pins .223), and the registry namespace
  # (self-hosted container registry pins .225). Without this the IP is allocated
  # but never advertised on the LAN, so it's unreachable.
  # Must stay in sync with the first-pool serviceSelector in ip-pool.yaml; both
  # select by namespace, not by service name.
  serviceSelector:
    matchExpressions:
      - key: io.kubernetes.service.namespace
        operator: In
        values:
          - gateway
          - gatebound
          - registry
  externalIPs: false
  loadBalancerIPs: true
