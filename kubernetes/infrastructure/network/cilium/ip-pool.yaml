apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: first-pool
spec:
  # Serves LoadBalancer services in the gateway namespace (the two Cilium
  # gateways: .220 internal, .222 external) and the gatebound namespace (the TFS
  # game server, which pins .223 via io.cilium/lb-ipam-ips). Selecting by
  # namespace rather than name so gatebound-tfs is eligible too.
  serviceSelector:
    matchExpressions:
      - key: io.kubernetes.service.namespace
        operator: In
        values:
          - gateway
          - gatebound
  blocks:
    - start: 192.168.1.220
      stop: 192.168.1.229
