apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: r2-critical-dr
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: alertmanager-slack
    creationPolicy: Owner
  data:
    # Same Slack Incoming Webhook used by Alertmanager (homelab project).
    - secretKey: webhook-url
      remoteRef:
        key: abeef982-e4eb-4968-9d95-b472015a50c1
