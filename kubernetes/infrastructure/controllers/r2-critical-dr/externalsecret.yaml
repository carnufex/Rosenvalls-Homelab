apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: r2-critical-dr-secrets
  namespace: r2-critical-dr
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: r2-critical-dr-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RCLONE_CONFIG_R2_TYPE: s3
        RCLONE_CONFIG_R2_PROVIDER: Cloudflare
        RCLONE_CONFIG_R2_ACCESS_KEY_ID: "{{ .S3_ACCESS_KEY_ID }}"
        RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: "{{ .S3_SECRET_ACCESS_KEY }}"
        RCLONE_CONFIG_R2_ENDPOINT: "{{ .S3_ENDPOINT }}"
        RCLONE_CONFIG_R2_REGION: auto
        RCLONE_CONFIG_R2_ACL: private
        RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        RCLONE_CONFIG_CRITICAL_TYPE: crypt
        RCLONE_CONFIG_CRITICAL_REMOTE: r2:rosenvall-homelab-backup/critical-dr
        RCLONE_CONFIG_CRITICAL_FILENAME_ENCRYPTION: standard
        RCLONE_CONFIG_CRITICAL_DIRECTORY_NAME_ENCRYPTION: "true"
        RCLONE_CONFIG_CRITICAL_PASSWORD: "{{ .AUTHENTIK_SECRET_KEY }}"
        RCLONE_CONFIG_CRITICAL_PASSWORD2: "{{ .AUTHENTIK_BOOTSTRAP_TOKEN }}"
  data:
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: S3_ACCESS_KEY_ID
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: S3_SECRET_ACCESS_KEY
    - secretKey: S3_ENDPOINT
      remoteRef:
        key: S3_ENDPOINT
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: 9af9ea6b-f1ba-4e03-8a5a-b3a00079a73d
        property: password
    - secretKey: AUTHENTIK_BOOTSTRAP_TOKEN
      remoteRef:
        key: 958d52f8-706f-46fd-8bce-b45100a628c1
