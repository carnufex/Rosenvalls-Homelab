apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: r2-critical-dr
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: r2-critical-dr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: r2-critical-dr
subjects:
  - kind: ServiceAccount
    name: r2-critical-dr
    namespace: r2-critical-dr
