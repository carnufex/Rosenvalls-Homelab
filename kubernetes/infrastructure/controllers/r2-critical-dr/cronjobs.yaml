apiVersion: batch/v1
kind: CronJob
metadata:
  name: authentik-critical-r2
  namespace: r2-critical-dr
spec:
  # Weekly (Sun 03:10). Each run overwrites the current month dir, so this is
  # storage-neutral vs monthly but keeps the newest backup <= 7 days old.
  schedule: "10 3 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: r2-critical-dr
          restartPolicy: Never
          containers:
            - name: backup
              image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/authentik-critical-backup.sh"]
              envFrom:
                - secretRef:
                    name: r2-critical-dr-secrets
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: work
                  mountPath: /work
              securityContext:
                allowPrivilegeEscalation: false
                runAsUser: 0
                runAsGroup: 0
          volumes:
            - name: scripts
              configMap:
                name: r2-critical-dr-scripts
                defaultMode: 0555
            - name: work
              emptyDir: {}
---
