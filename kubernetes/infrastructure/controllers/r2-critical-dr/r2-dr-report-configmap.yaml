apiVersion: v1
kind: ConfigMap
metadata:
  name: r2-dr-report
  namespace: r2-critical-dr
data:
  r2-dr-report.sh: |
    #!/bin/sh
    # Runs daily but stays SILENT when healthy. Alerts Slack only when a DR
    # backup is missing (none in STALE_DAYS days -> a weekly run was missed) or
    # when R2 storage approaches the 10 GB free-tier limit. FORCE_REPORT=true
    # posts a full status for manual verification.
    set -u

    apk add --no-cache rclone curl jq coreutils >/dev/null 2>&1

    webhook="$(cat /etc/slack/webhook-url)"
    bucket="r2:rosenvall-homelab-backup"

    # Cloudflare R2 free tier: 10 GB-month of storage (decimal GB).
    LIMIT=10000000000
    WARN=7000000000
    CRIT=9000000000
    STALE_DAYS="${STALE_DAYS:-8}"   # weekly backups; older than this -> a run was missed

    sizejson="$(rclone size "${bucket}" --json 2>/dev/null)"
    bytes="$(printf '%s' "${sizejson}" | jq -r '.bytes // 0')"
    count="$(printf '%s' "${sizejson}" | jq -r '.count // 0')"
    [ -z "${bytes}" ] && bytes=0

    pct=$(( bytes * 100 / LIMIT ))
    mib=$(( bytes / 1048576 ))

    # Freshness: newest object modtime across the bucket.
    newest_date="$(rclone lsl "${bucket}" 2>/dev/null | awk '{print $2}' | sort | tail -1)"
    age_days="-1"
    if [ -n "${newest_date}" ]; then
      ne="$(date -u -d "${newest_date}" +%s 2>/dev/null || echo '')"
      [ -n "${ne}" ] && age_days=$(( ( $(date -u +%s) - ne ) / 86400 ))
    fi

    problems=""
    note() { problems="${problems}
    ${1}"; }

    if [ "${bytes}" -ge "${CRIT}" ]; then
      note ":rotating_light: R2 usage is *critically* near the 10 GB free-tier limit: ${mib} MiB (${pct}%)."
    elif [ "${bytes}" -ge "${WARN}" ]; then
      note ":warning: R2 usage is approaching the 10 GB free-tier limit: ${mib} MiB (${pct}%)."
    fi

    if [ "${age_days}" -lt 0 ]; then
      note ":rotating_light: Could not determine backup age (bucket empty or unreachable)."
    elif [ "${age_days}" -gt "${STALE_DAYS}" ]; then
      note ":rotating_light: No DR backup in *${age_days} days* — a weekly backup has been missed. (R2 ${mib} MiB / 10 GB, ${count} objects.)"
    fi

    # Silent when healthy. Only post on a real problem (or when forced).
    if [ -z "${problems}" ] && [ "${FORCE_REPORT:-false}" != "true" ]; then
      echo "OK (silent): R2 ${mib} MiB (${pct}%), newest backup ${age_days}d old — no alert."
      exit 0
    fi

    if [ -z "${problems}" ]; then
      msg="$(printf ':white_check_mark: *R2 / DR backup report* — all good\n_%s_\n\n• R2 usage: *%s MiB / 10 GB* (%s%%), %s objects\n• Newest backup: %s days ago' \
        "$(date -u '+%Y-%m-%d %H:%M UTC')" "${mib}" "${pct}" "${count}" "${age_days}")"
    else
      msg="$(printf ':rotating_light: *R2 / DR backup needs attention*\n_%s_%s' \
        "$(date -u '+%Y-%m-%d %H:%M UTC')" "${problems}")"
    fi

    printf '%s\n\n' "${msg}"
    payload="$(jq -n --arg t "${msg}" '{text:$t}')"
    curl -s -o /dev/null -w 'slack_status=%{http_code}\n' \
      -X POST -H 'content-type: application/json' --data "${payload}" "${webhook}"
