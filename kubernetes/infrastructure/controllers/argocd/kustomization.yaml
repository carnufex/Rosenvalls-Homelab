apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  - namespace.yaml
  - httproute.yaml
  - external-secret.yaml

helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: 10.7.0 # Argo CD v3.5.x
    releaseName: argocd
    namespace: argocd
    valuesFile: values.yaml
    kubeVersion: v1.37.0
