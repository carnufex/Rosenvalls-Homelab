repoServer:
  # The repo-server shipped with no requests at all, which made it BestEffort
  # and therefore first in line to be evicted whenever worker-01 came under
  # memory or disk pressure - 15 restarts in two days. While it is down ArgoCD
  # cannot render manifests and every app reports a ComparisonError. It idles
  # around 115Mi but spikes rendering the helm charts for all 30 apps.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
server:
  extraArgs:
    - --insecure
  ingress:
    enabled: false

dex:
  livenessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3

configs:
  cm:
    create: true
    admin.enabled: "false"
    url: https://argo.rosenvall.se
    kustomize.buildOptions: --enable-helm
    dex.config: |
      connectors:
      - config:
          issuer: https://authentik.rosenvall.se/application/o/argocd/
          clientID: $dex.authentik.clientId
          clientSecret: $dex.authentik.clientSecret
          insecureEnableGroups: true
          scopes:
            - openid
            - profile
            - email
        name: authentik
        type: oidc
        id: authentik
  params:
    server.insecure: true
  rbac:
    create: true
    policy.csv: |
      g, ArgoCD Admins, role:admin
      g, ArgoCD Viewers, role:readonly
