# Runner scale set "kingsguard-cluster" for carnufex/kingsguard (ARC). Jobs reach it with `runs-on: kingsguard-cluster`.
# Only the publish job of kingsguard's main branch uses it (.github/workflows/ci.yml): it pushes the image built on a
# GitHub-hosted runner to the LAN-only registry and bumps the pin in kubernetes/applications/kingsguard. Same GitHub App
# as lots-cluster (its installation must include carnufex/kingsguard).
githubConfigUrl: https://github.com/carnufex/kingsguard
githubConfigSecret: arc-github-app
runnerScaleSetName: kingsguard-cluster
minRunners: 0
maxRunners: 1
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller
template:
  spec:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001 # the image's "runner" user (non-numeric USER, so runAsNonRoot needs the uid)
      runAsGroup: 1001
      fsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.337.0
        command: ["/home/runner/run.sh"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 2Gi
