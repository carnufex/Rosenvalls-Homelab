# Docker Hub pull-through cache for the lots-cluster runners' Docker-in-Docker (dockerd --registry-mirror). CI pulls the same
# pinned images on every run (PostgreSQL, gitleaks, mkdocs, trivy, base images); Docker Hub limits anonymous pulls per IP, and a
# fresh runner pod has an empty image store. Cluster-internal only (no Service outside this namespace, plain HTTP).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dockerhub-cache
  namespace: arc-runners
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dockerhub-cache
  namespace: arc-runners
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO volume
  selector:
    matchLabels:
      app: dockerhub-cache
  template:
    metadata:
      labels:
        app: dockerhub-cache
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
          ports:
            - name: http
              containerPort: 5000
            - name: debug
              containerPort: 5001
          env:
            - name: REGISTRY_HTTP_ADDR
              value: ":5000"
            - name: REGISTRY_HTTP_DEBUG_ADDR
              value: ":5001"
            - name: REGISTRY_PROXY_REMOTEURL
              value: https://registry-1.docker.io
            # Cached content expires a week after its last use; the scheduler deletes it.
            - name: REGISTRY_PROXY_TTL
              value: 168h
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /debug/health
              port: debug
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /debug/health
              port: debug
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dockerhub-cache
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dockerhub-cache
  namespace: arc-runners
spec:
  selector:
    app: dockerhub-cache
  ports:
    - name: http
      port: 5000
      targetPort: http
