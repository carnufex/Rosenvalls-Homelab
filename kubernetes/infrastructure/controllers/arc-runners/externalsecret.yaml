# GitHub App lots-arc-carnufex (administration:write, metadata:read; installed on carnufex/Lots and carnufex/kingsguard):
# registers both runner scale sets. Keys as ARC expects them. The private key is stored base64-encoded in Bitwarden (bws cannot take a
# value that starts with "-").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: arc-github-app
    creationPolicy: Owner
  data:
    - secretKey: github_app_id
      remoteRef:
        key: d0873365-6cce-47ab-a6d8-b4e10090e166 # LOTS_ARC_APP_ID
    - secretKey: github_app_installation_id
      remoteRef:
        key: 463c294e-4af2-43f6-9c8b-b4e1009231ef # LOTS_ARC_INSTALLATION_ID
    - secretKey: github_app_private_key
      remoteRef:
        key: 37c47537-4501-4d97-8e38-b4e10090e1b9 # LOTS_ARC_PRIVATE_KEY_B64
        decodingStrategy: Base64
