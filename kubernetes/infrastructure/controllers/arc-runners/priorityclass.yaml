# CI jobs (lots-cluster runners) rank below every workload: when the cluster is short of room, a pending workload preempts a
# CI job, and a CI job never preempts anything.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ci-low
value: -100
preemptionPolicy: Never
globalDefault: false
description: CI runner pods (carnufex/Lots), below every workload.
