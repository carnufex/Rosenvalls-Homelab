apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-secretsmanager
spec:
  conditions:
    - namespaces:
        - argocd
        - authentik
        - cert-manager
        - cloudflare
        - cnpg-system
        - hub-central
        - longhorn-system
        - matplan
        - media
        - monitoring
        - headlamp
        - r2-critical-dr
        - slack-ops-bot
        - gatebound
        - wedding
        - registry
  provider:
    bitwardensecretsmanager:
      organizationID: "6ce343f0-efbd-453f-836a-b39f0088b290"
      projectID: "e3b0b2ac-19f2-464d-a859-b39f00892f97"
      apiURL: "https://api.bitwarden.eu"
      identityURL: "https://identity.bitwarden.eu"
      bitwardenServerSDKURL: "https://bitwarden-sdk-server.external-secrets.svc.cluster.local:9998"
      caProvider:
        type: Secret
        name: bitwarden-tls-certs
        key: ca.crt
        namespace: external-secrets
      auth:
        secretRef:
          credentials:
            name: bitwarden-access-token
            key: token
            namespace: external-secrets
