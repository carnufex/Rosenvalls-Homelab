global:
  nameOverride: ""
  fullnameOverride: ""
  namespaceOverride: ""
  additionalLabels: {}
  image:
    tag: 2026.8.5 # update-center: ghcr.io/goauthentik/server (image-only patches may run ahead of the chart)
  revisionHistoryLimit: 3
  env: []
  envFrom:
    - secretRef:
        name: authentik-core-secrets
    - secretRef:
        name: authentik-blueprint-secrets
  volumeMounts:
    - name: db-creds
      mountPath: /secrets/authentik
      readOnly: true
  volumes:
    - name: db-creds
      secret:
        secretName: authentik-postgresql-app

authentik:
  secret_key: "env://AUTHENTIK_SECRET_KEY"
  enabled: true
  log_level: info
  events:
    context_processors:
      geoip: /geoip/GeoLite2-City.mmdb
      asn: /geoip/GeoLite2-ASN.mmdb
  web:
    path: /
  email:
    host: ""
    port: 587
    username: ""
    password: ""
    use_tls: false
    use_ssl: false
    timeout: 30
    from: ""
  outposts:
    container_image_base: ghcr.io/goauthentik/%(type)s:%(version)s
  error_reporting:
    enabled: false
    environment: "k8s"
    send_pii: false
  postgresql:
    host: authentik-postgresql-rw
    name: authentik
    user: file:///secrets/authentik/username
    password: file:///secrets/authentik/password
    port: "5432"
    sslmode: require

blueprints:
  configMaps:
    - authentik-blueprints
  secrets: []

server:
  enabled: true
  # 1Gi stopped being enough as applications and policies were added (lots, cmdb):
  # the server sat at the limit and was OOM-killed or liveness-killed 7-12 times an
  # hour on 2026-10-13. 500m also throttled startup past the liveness window.
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  service:
    annotations: {}
    labels: {}
    type: ClusterIP
  # /-/health/live/ fails while Postgres is down, so a database restart also restarted the server
  # (2026-10-22: +17 s of SSO outage). 12 x 10 s rides out a CNPG restart or the PG18 pg_upgrade;
  # a hung server is still killed after 2 min. (The probe overrides under worker: below are the
  # worker's own; the server ran on chart defaults until now.)
  livenessProbe:
    failureThreshold: 12
    timeoutSeconds: 5

worker:
  enabled: true
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  resources:
    requests:
      cpu: 500m
      memory: 6Gi
    limits:
      # Kept the request at 500m so scheduling is unchanged, but the worker
      # runs bursty task batches and sat pinned against a 500m ceiling from
      # the 2026.8 upgrade onwards (CPUThrottlingHigh, continuously firing).
      cpu: 2000m
      memory: 7Gi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: homelab.rosenvall.se/memory-tier
                operator: In
                values:
                  - large
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: homelab.rosenvall.se/compute-only
                operator: In
                values:
                  - "true"
  livenessProbe:
    timeoutSeconds: 5
  readinessProbe:
    timeoutSeconds: 5
  startupProbe:
    timeoutSeconds: 5

postgresql:
  enabled: false

serviceAccount:
  create: true
  annotations: {}
  serviceAccountSecret:
    enabled: false
  fullnameOverride: authentik

geoip:
  enabled: false
  editionIds: "GeoLite2-City GeoLite2-ASN"
  updateInterval: 8
  accountId: ""
  licenseKey: ""
  existingSecret:
    secretName: ""
    accountId: "account_id"
    licenseKey: "license_key"

prometheus:
  rules:
    enabled: true

metrics:
  enabled: true
