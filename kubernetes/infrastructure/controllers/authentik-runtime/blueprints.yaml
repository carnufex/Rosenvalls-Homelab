      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf grafana_application
          group: !Find [authentik_core.group, [name, "Grafana Admins"]]
        attrs:
          order: 1
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf grafana_application
          group: !Find [authentik_core.group, [name, "Grafana Editors"]]
        attrs:
          order: 2
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf grafana_application
          group: !Find [authentik_core.group, [name, "Grafana Viewers"]]
        attrs:
          order: 3
