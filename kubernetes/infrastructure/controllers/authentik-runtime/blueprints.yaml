apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  apps-argocd.yaml: |
    version: 1
    metadata:
      name: Apps - ArgoCD
    entries:
      - id: argocd-admin-group
        model: authentik_core.group
        identifiers:
          name: ArgoCD Admins
        attrs:
          name: ArgoCD Admins
      - id: argocd-viewer-group
        model: authentik_core.group
        identifiers:
          name: ArgoCD Viewers
        attrs:
          name: ArgoCD Viewers
      - id: argocd_provider
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: k8s.rosenvall.se/argocd
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, "default-provider-invalidation-flow"]]
          client_type: confidential
          redirect_uris:
            - url: https://argo.rosenvall.se/api/dex/callback
              matching_mode: strict
          client_id: !Env ARGOCD_CLIENT_ID
          client_secret: !Env ARGOCD_CLIENT_SECRET
          access_code_validity: minutes=1
          access_token_validity: hours=1
          refresh_token_validity: days=30
          sub_mode: hashed_user_id
          property_mappings:
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
      - id: argocd_application
        model: authentik_core.application
        identifiers:
          slug: argocd
        attrs:
          name: ArgoCD
          group: Infrastructure
          provider: !KeyOf argocd_provider
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf argocd_application
          group: !Find [authentik_core.group, [name, "ArgoCD Admins"]]
        attrs:
          order: 1
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf argocd_application
          group: !Find [authentik_core.group, [name, "ArgoCD Viewers"]]
        attrs:
          order: 2
  apps-rosenvall-devops.yaml: |
    version: 1
    metadata:
      name: Apps - Rosenvall DevOps
    entries:
      - id: rosenvall-devops-demo-users-group
        model: authentik_core.group
        identifiers:
          name: Rosenvall DevOps Demo Users
        attrs:
          name: Rosenvall DevOps Demo Users
      - id: rosenvall-devops-demo-user
        model: authentik_core.user
        identifiers:
          username: demo
        attrs:
          username: demo
          name: Demo
          email: demo@rosenvall.local
          path: users
          type: internal
          is_active: true
          password: demo
          groups:
            - !KeyOf rosenvall-devops-demo-users-group
      - id: rosenvall_devops_provider
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: rosenvall.se/devops
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, "default-provider-invalidation-flow"]]
          client_type: public
          client_id: rosenvall-devops
          redirect_uris:
            - url: https://devops.rosenvall.se/auth/callback
              matching_mode: strict
          access_code_validity: minutes=1
          access_token_validity: hours=1
          refresh_token_validity: days=30
          sub_mode: hashed_user_id
          property_mappings:
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
      - id: rosenvall_devops_application
        model: authentik_core.application
        identifiers:
          slug: rosenvall-devops
        attrs:
          name: Rosenvall DevOps
          group: Applications
          provider: !KeyOf rosenvall_devops_provider
          policy_engine_mode: any
