apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  apps-argocd.yaml: |
    version: 1
    metadata:
      name: Apps - ArgoCD
    entries:
      - id: argocd-admin-group
        model: authentik_core.group
        identifiers:
          name: ArgoCD Admins
        attrs:
          name: ArgoCD Admins
      - id: argocd-viewer-group
        model: authentik_core.group
        identifiers:
          name: ArgoCD Viewers
        attrs:
          name: ArgoCD Viewers
      - id: argocd_provider
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: k8s.rosenvall.se/argocd
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, "default-provider-invalidation-flow"]]
          client_type: confidential
          redirect_uris:
            - url: https://argo.rosenvall.se/api/dex/callback
              matching_mode: strict
          client_id: !Env ARGOCD_CLIENT_ID
          client_secret: !Env ARGOCD_CLIENT_SECRET
          access_code_validity: minutes=1
          access_token_validity: hours=1
          refresh_token_validity: days=30
          sub_mode: hashed_user_id
          property_mappings:
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
      - id: argocd_application
        model: authentik_core.application
        identifiers:
          slug: argocd
        attrs:
          name: ArgoCD
          group: Infrastructure
          provider: !KeyOf argocd_provider
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf argocd_application
          group: !Find [authentik_core.group, [name, "ArgoCD Admins"]]
        attrs:
          order: 1
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf argocd_application
          group: !Find [authentik_core.group, [name, "ArgoCD Viewers"]]
        attrs:
          order: 2
  apps-rosenvall-devops.yaml: |
    version: 1
    metadata:
      name: Apps - Rosenvall DevOps
    entries:
      - id: rosenvall-devops-demo-users-group
        model: authentik_core.group
        identifiers:
          name: Rosenvall DevOps Demo Users
        attrs:
          name: Rosenvall DevOps Demo Users
      - id: rosenvall-devops-demo-user
        model: authentik_core.user
        identifiers:
          username: demo
        attrs:
          username: demo
          name: Demo
          email: demo@rosenvall.local
          path: users
          type: internal
          is_active: true
          password: demo
          groups:
            - !KeyOf rosenvall-devops-demo-users-group
      - id: rosenvall_devops_provider
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: rosenvall.se/devops
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, "default-provider-invalidation-flow"]]
          client_type: public
          client_id: rosenvall-devops
          redirect_uris:
            - url: https://devops.rosenvall.se/auth/callback
              matching_mode: strict
            - url: http://localhost:5173/auth/callback
              matching_mode: strict
          access_code_validity: minutes=1
          access_token_validity: hours=1
          refresh_token_validity: days=30
          sub_mode: hashed_user_id
          property_mappings:
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
      - id: rosenvall_devops_application
        model: authentik_core.application
        identifiers:
          slug: rosenvall-devops
        attrs:
          name: Rosenvall DevOps
          group: Applications
          provider: !KeyOf rosenvall_devops_provider
          policy_engine_mode: any
  apps-lots.yaml: |
    version: 1
    metadata:
      name: Apps - Lots
    entries:
      # Group names are the roles in Lots (prefix "lots-" is stripped): admin, planner, operator, auditor.
      - id: lots-admin-group
        model: authentik_core.group
        identifiers:
          name: lots-admin
        attrs:
          name: lots-admin
      - id: lots-planner-group
        model: authentik_core.group
        identifiers:
          name: lots-planner
        attrs:
          name: lots-planner
      - id: lots-operator-group
        model: authentik_core.group
        identifiers:
          name: lots-operator
        attrs:
          name: lots-operator
      - id: lots-auditor-group
        model: authentik_core.group
        identifiers:
          name: lots-auditor
        attrs:
          name: lots-auditor
      # Members declared on the group so the user's other groups are untouched.
      - model: authentik_core.group
        identifiers:
          name: lots-admin
        attrs:
          users:
            - !Find [authentik_core.user, [username, "christopher.rosenvall@gmail.com"]]
      - id: lots_provider
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: rosenvall.se/lots
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, "default-provider-invalidation-flow"]]
          client_type: public
          client_id: lots
          grant_types: [authorization_code, refresh_token]
          redirect_uris:
            - url: https://lots.rosenvall.se/
              matching_mode: strict
            - url: http://localhost:8088/
              matching_mode: strict
          access_code_validity: minutes=1
          access_token_validity: hours=1
          refresh_token_validity: hours=8
          sub_mode: hashed_user_id
          property_mappings:
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
      - id: lots_application
        model: authentik_core.application
        identifiers:
          slug: lots
        attrs:
          name: Lots
          group: Applications
          meta_description: Agentskal med identitet, policy och audit
          meta_launch_url: https://lots.rosenvall.se/
          provider: !KeyOf lots_provider
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf lots_application
          group: !KeyOf lots-admin-group
        attrs:
          order: 1
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf lots_application
          group: !KeyOf lots-planner-group
        attrs:
          order: 2
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf lots_application
          group: !KeyOf lots-operator-group
        attrs:
          order: 3
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf lots_application
          group: !KeyOf lots-auditor-group
        attrs:
          order: 4
  apps-cmdb.yaml: |
    version: 1
    metadata:
      name: Apps - CMDB
    entries:
      # Groups map to access scopes in the app (full, one region polygon, one project).
      - id: cmdb-full-group
        model: authentik_core.group
        identifiers:
          name: cmdb-full
        attrs:
          name: cmdb-full
      - id: cmdb-region-group
        model: authentik_core.group
        identifiers:
          name: cmdb-region-nord
        attrs:
          name: cmdb-region-nord
      - id: cmdb-project-group
        model: authentik_core.group
        identifiers:
          name: cmdb-projekt-a
        attrs:
          name: cmdb-projekt-a
      - id: cmdb-user-demo-full
        model: authentik_core.user
        identifiers:
          username: cmdb-demo-full
        attrs:
          username: cmdb-demo-full
          name: Demo Full
          email: cmdb-demo-full@rosenvall.local
          path: users/cmdb-demo
          type: internal
          is_active: true
          password: !Env CMDB_DEMO_PASSWORD
          groups:
            - !KeyOf cmdb-full-group
      - id: cmdb-user-demo-region
        model: authentik_core.user
        identifiers:
          username: cmdb-demo-region
        attrs:
          username: cmdb-demo-region
          name: Demo Region
          email: cmdb-demo-region@rosenvall.local
          path: users/cmdb-demo
          type: internal
          is_active: true
          password: !Env CMDB_DEMO_PASSWORD
          groups:
            - !KeyOf cmdb-region-group
      - id: cmdb-user-demo-projekt
        model: authentik_core.user
        identifiers:
          username: cmdb-demo-projekt
        attrs:
          username: cmdb-demo-projekt
          name: Demo Projekt
          email: cmdb-demo-projekt@rosenvall.local
          path: users/cmdb-demo
          type: internal
          is_active: true
          password: !Env CMDB_DEMO_PASSWORD
          groups:
            - !KeyOf cmdb-project-group
      # Members of cmdb-full, declared on the group (not the user) so the users' other groups are untouched.
      - model: authentik_core.group
        identifiers:
          name: cmdb-full
        attrs:
          users:
            - !Find [authentik_core.user, [username, "christopher.rosenvall@gmail.com"]]
            - !KeyOf cmdb-user-demo-full
            # The shared demo user (blueprint apps-rosenvall-devops.yaml).
            - !Find [authentik_core.user, [username, "demo"]]
      - id: cmdb_provider
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: rosenvall.se/cmdb
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, "default-provider-invalidation-flow"]]
          client_type: public
          client_id: cmdb-web
          grant_types: [authorization_code, refresh_token]
          redirect_uris:
            - url: https://cmdb.rosenvall.se/auth/callback
              matching_mode: strict
            - url: http://localhost:8480/auth/callback
              matching_mode: strict
            - url: http://localhost:4200/auth/callback
              matching_mode: strict
          access_code_validity: minutes=1
          access_token_validity: hours=1
          refresh_token_validity: hours=8
          sub_mode: hashed_user_id
          property_mappings:
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'offline_access'"]]
      - id: cmdb_application
        model: authentik_core.application
        identifiers:
          slug: cmdb
        attrs:
          name: CMDB
          group: Applications
          meta_description: POC med syntetisk data
          provider: !KeyOf cmdb_provider
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf cmdb_application
          group: !KeyOf cmdb-full-group
        attrs:
          order: 1
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf cmdb_application
          group: !KeyOf cmdb-region-group
        attrs:
          order: 2
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf cmdb_application
          group: !KeyOf cmdb-project-group
        attrs:
          order: 3
      # Interactive agents (Claude Code, Codex) over MCP (ADR-0011): public PKCE client with a fixed loopback
      # callback, since Authentik has no dynamic client registration. Same people, same groups as the web app.
      - id: cmdb_mcp_provider
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: rosenvall.se/cmdb-mcp
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, "default-provider-invalidation-flow"]]
          issuer_mode: per_provider
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          client_type: public
          client_id: cmdb-mcp
          grant_types: [authorization_code, refresh_token]
          redirect_uris:
            - url: http://localhost:33418/callback
              matching_mode: strict
            - url: http://127.0.0.1:33418/callback
              matching_mode: strict
          access_code_validity: minutes=1
          access_token_validity: hours=1
          refresh_token_validity: days=7
          property_mappings:
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'offline_access'"]]
      - id: cmdb_mcp_application
        model: authentik_core.application
        identifiers:
          slug: cmdb-mcp
        attrs:
          name: CMDB för agenter (MCP)
          group: Applications
          meta_description: MCP-klient för Claude Code och Codex, syntetisk data
          meta_launch_url: blank://blank
          provider: !KeyOf cmdb_mcp_provider
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf cmdb_mcp_application
          group: !KeyOf cmdb-full-group
        attrs:
          order: 1
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf cmdb_mcp_application
          group: !KeyOf cmdb-region-group
        attrs:
          order: 2
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf cmdb_mcp_application
          group: !KeyOf cmdb-project-group
        attrs:
          order: 3
      # Unattended agents: service accounts that get tokens with client_credentials (username + app password).
      - id: cmdb-agents-group
        model: authentik_core.group
        identifiers:
          name: cmdb-agents
        attrs:
          name: cmdb-agents
      - id: cmdb-agent-demo-user
        model: authentik_core.user
        identifiers:
          username: cmdb-agent-demo
        attrs:
          username: cmdb-agent-demo
          name: CMDB demoagent
          path: users/cmdb-demo
          type: service_account
          is_active: true
          groups:
            - !KeyOf cmdb-agents-group
      - model: authentik_core.token
        identifiers:
          identifier: cmdb-agent-demo
        attrs:
          user: !KeyOf cmdb-agent-demo-user
          intent: app_password
          key: !Env CMDB_AGENT_TOKEN
          expiring: false
          description: client_credentials against cmdb-agents
      - id: cmdb_agents_provider
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: rosenvall.se/cmdb-agents
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, "default-provider-invalidation-flow"]]
          issuer_mode: per_provider
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          client_type: public
          client_id: cmdb-agents
          grant_types: [client_credentials]
          redirect_uris: []
          access_token_validity: hours=1
          property_mappings:
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
            - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'offline_access'"]]
      - id: cmdb_agents_application
        model: authentik_core.application
        identifiers:
          slug: cmdb-agents
        attrs:
          name: CMDB för obevakade agenter
          group: Applications
          meta_description: Tjänstekonton via client_credentials, syntetisk data
          meta_launch_url: blank://blank
          provider: !KeyOf cmdb_agents_provider
          policy_engine_mode: any
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf cmdb_agents_application
          group: !KeyOf cmdb-agents-group
        attrs:
          order: 1
