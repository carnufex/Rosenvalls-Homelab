apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-postgresql
  namespace: authentik
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie

  # Recovery bootstrap
  bootstrap:
    recovery:
      source: authentik-postgresql

  externalClusters:
    - name: authentik-postgresql
      barmanObjectStore:
        destinationPath: "s3://rosenvall-homelab-backup/authentik/live/"
        endpointURL: "https://a7dca16c95c8d1148ee2c066adc80041.r2.cloudflarestorage.com"
        s3Credentials:
          accessKeyId:
            name: s3-credentials
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: s3-credentials
            key: ACCESS_SECRET_KEY

  storage:
    size: 5Gi # data ~0.3 GiB (2026-11-19); was 20Gi
    storageClass: longhorn

  walStorage:
    size: 4Gi # max_wal_size 1GB + wal_keep_size 512MB, ~0.5 GiB used; was 20Gi
    storageClass: longhorn

  backup:
    retentionPolicy: "7d"
    barmanObjectStore:
      destinationPath: "s3://rosenvall-homelab-backup/authentik/dr/"
      endpointURL: "https://a7dca16c95c8d1148ee2c066adc80041.r2.cloudflarestorage.com"
      data:
        compression: gzip
      s3Credentials:
        accessKeyId:
          name: s3-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: s3-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
