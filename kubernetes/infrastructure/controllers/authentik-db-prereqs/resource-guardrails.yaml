apiVersion: v1
kind: LimitRange
metadata:
  name: authentik-container-limits
  namespace: authentik
spec:
  limits:
    - type: Container
      max:
        cpu: "2"
        memory: 7Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: authentik-runtime-budget
  namespace: authentik
spec:
  hard:
    requests.cpu: "5"
    requests.memory: 10Gi
    limits.cpu: "8"
    limits.memory: 12Gi
