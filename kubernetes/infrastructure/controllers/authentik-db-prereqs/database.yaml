apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-postgresql
  namespace: authentik
spec:
  instances: 1
  inheritedMetadata:
    labels:
      # Longhorn reads recurring-job labels from the PVC: the "cnpg" group only
      # trims. These databases are backed up with logical dumps instead.
      recurring-job.longhorn.io/source: enabled
      recurring-job-group.longhorn.io/cnpg: enabled

  imageName: ghcr.io/cloudnative-pg/postgresql:17

  bootstrap:
    initdb:
      database: authentik
      owner: authentik

  storage:
    size: 20Gi
    storageClass: longhorn-critical

  walStorage:
    size: 20Gi
    storageClass: longhorn-critical

  resources:
    requests:
      memory: 512Mi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: "1"

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
