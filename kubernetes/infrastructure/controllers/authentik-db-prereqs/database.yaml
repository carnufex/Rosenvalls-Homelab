apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-postgresql
  namespace: authentik
spec:
  instances: 1
  inheritedMetadata:
    labels:
      # Longhorn reads recurring-job labels from the PVC: the "cnpg" group only
      # trims. These databases are backed up with logical dumps instead.
      recurring-job.longhorn.io/source: enabled
      recurring-job-group.longhorn.io/cnpg: enabled

  # Debian 13 "standard" image; the bare :17 tag is bullseye and frozen. Plan: docs/operations/cnpg-postgres-18-plan.md
  imageName: ghcr.io/cloudnative-pg/postgresql:17-standard-trixie

  # authentik's connection pool never closes its sessions, so the default smart shutdown waits the full
  # 180 s on every restart (SSO down). After 15 s CNPG switches to a fast, still clean, shutdown.
  smartShutdownTimeout: 15

  bootstrap:
    initdb:
      database: authentik
      owner: authentik

  storage:
    size: 20Gi
    storageClass: longhorn-critical

  walStorage:
    size: 20Gi
    storageClass: longhorn-critical

  resources:
    requests:
      memory: 512Mi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: "1"

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
