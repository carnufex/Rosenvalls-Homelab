apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-core-secrets
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: authentik-core-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AUTHENTIK_SECRET_KEY: "{{ .AUTHENTIK_SECRET_KEY }}"
        AUTHENTIK_REDIS__PASSWORD: "{{ .AUTHENTIK_REDIS_PASSWORD }}"
        AUTHENTIK_BOOTSTRAP_PASSWORD: "{{ .AUTHENTIK_BOOTSTRAP_PASSWORD }}"
        AUTHENTIK_BOOTSTRAP_TOKEN: "{{ .AUTHENTIK_BOOTSTRAP_TOKEN }}"
        AUTHENTIK_BOOTSTRAP_EMAIL: "{{ .AUTHENTIK_BOOTSTRAP_EMAIL }}"
        redis-password: "{{ .AUTHENTIK_REDIS_PASSWORD }}"
  data:
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: 9af9ea6b-f1ba-4e03-8a5a-b3a00079a73d
        property: password
    - secretKey: AUTHENTIK_REDIS_PASSWORD
      remoteRef:
        key: 9af9ea6b-f1ba-4e03-8a5a-b3a00079a73d
        property: password
    - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
      remoteRef:
        key: authentik-bootstrap-password
        property: e3b0b2ac-19f2-464d-a859-b39f00892f97
    - secretKey: AUTHENTIK_BOOTSTRAP_TOKEN
      remoteRef:
        key: authentik-bootstrap-token
        property: e3b0b2ac-19f2-464d-a859-b39f00892f97
    - secretKey: AUTHENTIK_BOOTSTRAP_EMAIL
      remoteRef:
        key: authentik-bootstrap-email
        property: e3b0b2ac-19f2-464d-a859-b39f00892f97
