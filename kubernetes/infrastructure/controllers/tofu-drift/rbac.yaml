apiVersion: v1
kind: ServiceAccount
metadata:
  name: tofu-drift
  namespace: tofu-drift
---
# The job only remembers what it last reported (so a persisting drift is not
# re-posted every day). Nothing else in the cluster is readable to it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tofu-drift
  namespace: tofu-drift
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["tofu-drift-status"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tofu-drift
  namespace: tofu-drift
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tofu-drift
subjects:
  - kind: ServiceAccount
    name: tofu-drift
    namespace: tofu-drift
