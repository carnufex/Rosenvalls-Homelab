apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tofu-drift
  namespace: tofu-drift
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: tofu-drift
    creationPolicy: Owner
  data:
    # R2 (S3 API) holding tofu-state/hemma-k8s.tfstate - same credentials as r2-critical-dr.
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: a7be37ca-2682-4050-b42b-b3eb0179367c
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: c38a2bfc-629f-40fe-8fe4-b3eb01794aad
    - secretKey: AWS_ENDPOINT_URL_S3
      remoteRef:
        key: f1ad7686-5ca5-4315-8df0-b3eb01796694
    # OpenTofu state encryption passphrase (Bitwarden key tofu-state-passphrase).
    - secretKey: TF_VAR_state_passphrase
      remoteRef:
        key: tofu-state-passphrase
    # Proxmox token root@pam!tofu-drift, role TofuDriftReader (VM.Audit, VM.Config.Disk,
    # Datastore.Audit, Sys.Audit). VM.Config.Disk is the least Proxmox accepts for
    # reading VM disk volumes during refresh; PVEAuditor alone gets 403. A plan never writes.
    - secretKey: TF_VAR_proxmox_api_token
      remoteRef:
        key: proxmox-tofu-drift-token
    # Same Slack incoming webhook as Alertmanager (#homelab-alerts).
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: abeef982-e4eb-4968-9d95-b472015a50c1
