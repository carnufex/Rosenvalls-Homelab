# Nightly logical dump of the authentik database to host1's backup export
# (192.168.1.230:/srv/nfs/backup/db-dumps/authentik, see scripts/configure-host1-backup-nfs.ps1).
# CNPG volumes sit in the Longhorn "cnpg" recurring-job group, which only trims: a
# crash-consistent snapshot of the data volume without a matching WAL volume is not a
# restorable backup, this dump is. Restore: pg_restore --clean --if-exists -d authentik <file>
apiVersion: v1
kind: PersistentVolume
metadata:
  name: db-dumps-authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    app.kubernetes.io/name: db-dump
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: authentik
    name: db-dumps
  mountOptions:
    - nfsvers=4.2
    - hard
  nfs:
    server: 192.168.1.230
    path: /srv/nfs/backup/db-dumps/authentik
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-dumps
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: ""
  volumeName: db-dumps-authentik
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: authentik-db-dump
  namespace: authentik
spec:
  schedule: "5 1 * * *"
  timeZone: Europe/Stockholm
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: db-dump
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:17-standard-trixie # follows the server major
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  out="/dumps/${PGDATABASE}-$(date -u +%Y-%m-%dT%H%M%SZ).dump"
                  pg_dump --format=custom --file="${out}.partial"
                  pg_restore --list "${out}.partial" >/dev/null
                  mv "${out}.partial" "${out}"
                  find /dumps -maxdepth 1 -name "${PGDATABASE}-*.dump" -mtime +"${RETAIN_DAYS}" -print -delete
                  find /dumps -maxdepth 1 -name '*.partial' -mmin +120 -delete
                  ls -lh /dumps | tail -n 4
              env:
                - name: RETAIN_DAYS
                  value: "14"
                - name: PGHOST
                  value: authentik-postgresql-rw
                - name: PGDATABASE
                  value: authentik
                - name: PGUSER
                  valueFrom:
                    secretKeyRef: { name: authentik-postgresql-app, key: username }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: authentik-postgresql-app, key: password }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: 500m, memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: dumps, mountPath: /dumps }
          volumes:
            - name: dumps
              persistentVolumeClaim:
                claimName: db-dumps
