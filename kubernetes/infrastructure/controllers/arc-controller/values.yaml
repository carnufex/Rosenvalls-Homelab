# Actions Runner Controller (gha-runner-scale-set-controller). The runner scale sets live in
# kubernetes/applications/arc-runners; this only runs the controller and the listeners.
replicaCount: 1
flags:
  logLevel: info
  logFormat: json
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi
