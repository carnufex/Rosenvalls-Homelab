apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ragflow-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/infiniflow/ragflow.git
    targetRevision: v0.24.0
    path: helm
    helm:
      releaseName: ragflow
      valuesObject:
        env:
          # Use Infinity as the doc engine (lighter than Elasticsearch)
          DOC_ENGINE: infinity
          REGISTER_ENABLED: "0"
          TZ: "Europe/Stockholm"
        ragflow:
          service:
            type: ClusterIP
        # Persistent storage configuration - uses default StorageClass (Longhorn)
        infinity:
          storage:
            capacity: 10Gi
        mysql:
          storage:
            capacity: 5Gi
        redis:
          storage:
            capacity: 2Gi
        minio:
          storage:
            capacity: 10Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: ragflow
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[].apiVersion
        - .spec.volumeClaimTemplates[].kind
