apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure
  namespace: argocd
spec:
  goTemplate: true
  generators:
  - git:
      repoURL: https://github.com/carnufex/Rosenvalls-Homelab.git
      revision: HEAD
      directories:
      - path: kubernetes/infrastructure/*/*
  template:
    metadata:
      name: '{{.path.basename}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{ if or (eq .path.basename "cilium") (eq .path.basename "longhorn") }}1{{ else if eq .path.basename "cert-manager" }}2{{ else if eq .path.basename "external-secrets" }}3{{ else }}4{{ end }}'
    spec:
      project: infrastructure
      source:
        repoURL: https://github.com/carnufex/Rosenvalls-Homelab.git
        targetRevision: HEAD
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: "10s"
            factor: 2
            maxDuration: "3m"
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
      ignoreDifferences:
        - group: external-secrets.io
          kind: ExternalSecret
          jqPathExpressions:
            - .spec.data[].remoteRef.conversionStrategy
            - .spec.data[].remoteRef.decodingStrategy
            - .spec.data[].remoteRef.metadataPolicy
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jsonPointers:
            - /webhooks/*/clientConfig/caBundle
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jsonPointers:
            - /webhooks/*/clientConfig/caBundle
        - group: gateway.networking.k8s.io
          kind: Gateway
          jsonPointers:
            - /status
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jsonPointers:
            - /status
            - /spec/parentRefs/*/group
            - /spec/parentRefs/*/kind
            - /spec/rules/*/backendRefs/*/group
            - /spec/rules/*/backendRefs/*/kind
            - /spec/rules/*/backendRefs/*/weight
        - group: postgresql.cnpg.io
          kind: Cluster
          jsonPointers:
            - /status
