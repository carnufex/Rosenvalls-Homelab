# Talos exposes kube-controller-manager/kube-scheduler only on localhost, and
# kube-proxy is replaced by Cilium (kube-proxy-replacement: true). The chart's
# default scrape targets can never succeed here, producing permanent
# KubeControllerManagerDown / KubeSchedulerDown / KubeProxyDown false alerts.
# Disable their ServiceMonitors and rules so Slack stays signal, not noise.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

grafana:
  envFromSecret: grafana-oauth
  testFramework:
    enabled: false

  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  grafana.ini:
    server:
      root_url: https://grafana.rosenvall.local
    auth:
      disable_login_form: true
      oauth_auto_login: true
    auth.basic:
      enabled: false
    auth.generic_oauth:
      enabled: true
      name: Authentik
      allow_sign_up: true
      client_id: $__env{GRAFANA_CLIENT_ID}
      client_secret: $__env{GRAFANA_CLIENT_SECRET}
      scopes: openid profile email
      auth_url: https://authentik.rosenvall.se/application/o/authorize/
      token_url: https://authentik.rosenvall.se/application/o/token/
      api_url: https://authentik.rosenvall.se/application/o/userinfo/
      use_pkce: true
      role_attribute_strict: true
      role_attribute_path: contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || contains(groups[*], 'Grafana Viewers') && 'Viewer' || 'None'

  persistence:
    enabled: false
  
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

kubeStateMetrics:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

alertmanager:
  alertmanagerSpec:
    # Mounts the ExternalSecret-backed Slack webhook at
    # /etc/alertmanager/secrets/alertmanager-slack/webhook-url
    secrets:
      - alertmanager-slack
      # /etc/alertmanager/secrets/alertmanager-lots/token: the bearer of the receiver lots (alertmanager-lots-externalsecret.yaml).
      - alertmanager-lots
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-observability
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: slack-homelab
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Lots (applications/lots/README.md, "Incidents on the real cluster"): alerts of namespace oncall-demo also go to Lots,
        # which opens an incident and investigates it. continue: true, so they go on through the routes below exactly as before;
        # Lots is never the only path. Short timings for the demo: Lots settles and deduplicates itself. To remove: this route,
        # the receiver lots, the catch-all route at the end, and alertmanager-lots in alertmanagerSpec.secrets.
        - receiver: lots
          matchers:
            - namespace = "oncall-demo"
          continue: true
          group_wait: 5s
          group_interval: 1m
          repeat_interval: 4h
        # Longhorn capacity alerts go to the ops bot, which re-posts them to the
        # channel with a "Clean orphaned volumes" action button.
        - receiver: slack-ops-bot
          matchers:
            - alertname = "LonghornNodeStorageLow"
        # Watchdog/InfoInhibitor are housekeeping signals, not real incidents.
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: "null"
          matchers:
            - alertname = "InfoInhibitor"
        # Catch-all, last: once a child route has matched (the lots route above does, with continue), Alertmanager no longer
        # falls back to the root receiver, so without this an oncall-demo alert would reach only Lots. Everything no route above
        # stopped reaches slack-homelab, as it did through the root receiver. Remove it together with the lots route.
        - receiver: slack-homelab
    receivers:
      - name: "null"
      # Lots' alert source homelab-alertmanager (the lots route above). Bearer: the Bitwarden entry LOTS_SIGNAL_HOMELAB.
      - name: lots
        webhook_configs:
          - url: http://lots.lots.svc.cluster.local:8080/signals/homelab-alertmanager
            send_resolved: true   # Lots needs the resolved notifications to settle and resolve incidents
            max_alerts: 0
            http_config:
              authorization:
                credentials_file: /etc/alertmanager/secrets/alertmanager-lots/token
      - name: slack-ops-bot
        webhook_configs:
          - url: http://slack-ops-bot.slack-ops-bot.svc.cluster.local:8080/alert
            send_resolved: false
      - name: slack-homelab
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            channel: "#homelab-alerts"
            send_resolved: true
            title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
            text: >-
              {{ range .Alerts }}*{{ .Labels.severity | toUpper }}* — {{ .Annotations.summary }}
              {{ .Annotations.description }}
              {{ end }}

prometheus:
  prometheusSpec:
    retention: 3d
    retentionSize: 20GB
    containers:
      - name: prometheus
        startupProbe:
          httpGet:
            path: /-/ready
            port: http-web
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 240
    storageSpec:
      volumeClaimTemplate:
        metadata:
          # PVC recurring-job labels override Longhorn's default group. The
          # Prometheus TSDB has high block churn and is explicitly disposable:
          # the "disposable" group only trims, it is never snapshotted (a single
          # daily snapshot pinned 48 GiB for a 5 GiB TSDB on a 100 GiB node disk).
          labels:
            recurring-job.longhorn.io/source: enabled
            recurring-job-group.longhorn.io/disposable: enabled
        spec:
          storageClassName: longhorn-observability-single
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
