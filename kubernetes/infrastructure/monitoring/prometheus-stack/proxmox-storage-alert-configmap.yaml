apiVersion: v1
kind: ConfigMap
metadata:
  name: proxmox-storage-alert
  namespace: monitoring
data:
  # Proxmox storage-fill check. Prometheus does NOT scrape Proxmox, so this closes
  # the blind spot that caused the 2026-07-13 local-lvm-full io-error outage (thin
  # pool hit 100% -> QEMU froze the VMs).
  #
  # It raises alerts in Alertmanager instead of posting to Slack itself, so
  # Alertmanager is its memory: one alert per pool at or above THRESHOLD
  # (ProxmoxStorageFilling, labels node and storage), announced once in
  # #homelab-alerts, repeated every repeat_interval while it lasts, and
  # announced as resolved when the pool is below the threshold again. The same
  # alert reaches Lots through the route lots (values.yaml), where a repeat is
  # an occurrence of the open incident, never a second one.
  #
  # The same run raises ProxmoxVMStopped (labels node, vmid, name) for a VM that
  # is set to start on boot (onboot=1) but is not running: nfs-01 stopped on
  # 2026-11-23 around 03:00 and Immich's library was gone for three days with no
  # alert. Templates are skipped. When the VM list cannot be read, the
  # ProxmoxVMStopped alerts already firing are left to run out by themselves.
  #
  # Every run sends the pools that are filling again with an end time
  # KEEP_SECONDS ahead (three runs: one missed run does not resolve and re-fire
  # the alert), and ends what it had firing that no longer holds.
  proxmox-storage-alert.sh: |
    #!/bin/sh
    set -eu

    THRESHOLD="${THRESHOLD:-85}"
    PVE_URL="${PVE_URL:-https://192.168.1.111:8006/api2/json}"
    AM_URL="${AM_URL:-http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093}"
    KEEP_SECONDS="${KEEP_SECONDS:-6000}"
    TOKEN="$(cat /etc/proxmox/token)"

    # What this check has firing in Alertmanager now. When that cannot be read,
    # nothing is ended early: the alerts end by themselves after KEEP_SECONDS.
    active="$(curl -s --max-time 15 -G --data-urlencode 'filter=check="proxmox-storage"' \
        --data 'active=true' --data 'silenced=true' --data 'inhibited=true' \
        "${AM_URL}/api/v2/alerts" || true)"
    printf '%s' "$active" | jq -e 'type == "array"' >/dev/null 2>&1 || active='[]'

    send() {
      # $1 = what fires now, a JSON array of {labels, annotations}
      # $2 = what was firing and may be ended when it is not in $1
      # startsAt is always sent: without it Alertmanager takes the end time as the
      # start. For an alert it already has, it keeps the earlier start.
      payload="$(jq -cn --argjson firing "$1" --argjson was "$2" --argjson keep "$KEEP_SECONDS" '
        (now | floor) as $now
        | ($firing | map(. + {startsAt: ($now | todate), endsAt: ($now + $keep | todate)}))
        + ($was
           | map(select(.labels as $l | ($firing | any(.labels == $l)) | not))
           | map({labels, annotations, startsAt: ($now | todate), endsAt: ($now | todate)}))')"
      if [ "$payload" = "[]" ]; then return 0; fi
      code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -X POST \
        -H 'Content-Type: application/json' --data "$payload" "${AM_URL}/api/v2/alerts" || true)"
      echo "alertmanager_status=${code} sent=$(printf '%s' "$payload" | jq length)"
      [ "$code" = "200" ]
    }

    # Query storage usage across all Proxmox nodes in one call.
    resp="$(curl -sk --max-time 20 -H "Authorization: PVEAPIToken=${TOKEN}" \
        "${PVE_URL}/cluster/resources?type=storage" || true)"
    if ! printf '%s' "$resp" | jq -e '.data | type == "array"' >/dev/null 2>&1; then
      echo "ERROR: Proxmox API unreachable or answered without data"
      failed="$(jq -cn --arg url "$PVE_URL" '[{
        labels: {alertname: "ProxmoxStorageCheckFailed", severity: "warning", check: "proxmox-storage"},
        annotations: {
          summary: "The Proxmox storage check could not read the Proxmox API.",
          description: "No answer with data from \($url). The control node or the Proxmox host may be down, or the token is refused. Until it answers, a filling pool is not noticed."}}]')"
      # The pools are unknown, so no ProxmoxStorageFilling alert is ended.
      send "$failed" '[]' || { echo "ERROR: could not post to Alertmanager"; exit 1; }
      exit 0
    fi

    # One alert per pool at or above the threshold. The labels are the pool's
    # identity; the numbers are annotations, so a pool that grows is the same alert.
    firing="$(printf '%s' "$resp" | jq -c --argjson t "$THRESHOLD" '[
      .data[]
      | select(.maxdisk > 0)
      | (.disk / .maxdisk * 100) as $pct
      | select($pct >= $t)
      | {labels: {alertname: "ProxmoxStorageFilling", severity: "warning", check: "proxmox-storage",
                  node: .node, storage: .storage},
         annotations: {
           summary: "Proxmox storage \(.node)/\(.storage) is \($pct | floor)% full (\((.disk / 1073741824) | floor)/\((.maxdisk / 1073741824) | floor) GB).",
           description: "At or above \($t)%. A full pool freezes VMs with io-error and can take down the control plane. Free space, delete unused disks, or move a disk to WD-red before it reaches 100%."}}]')"

    if [ "$firing" = "[]" ]; then
      echo "OK: all Proxmox storage pools below ${THRESHOLD}%"
    else
      echo "FILLING:"; printf '%s' "$firing" | jq -r '.[].annotations.summary'
    fi

    # VMs that should be running: onboot=1 in their config, not a template, not running.
    stopped='[]'
    vms="$(curl -sk --max-time 20 -H "Authorization: PVEAPIToken=${TOKEN}"         "${PVE_URL}/cluster/resources?type=vm" || true)"
    if printf '%s' "$vms" | jq -e '.data | type == "array"' >/dev/null 2>&1; then
      for row in $(printf '%s' "$vms" | jq -r '.data[]
          | select(.type == "qemu" and .status != "running" and (.template // 0) == 0)
          | "\(.node)/\(.vmid)"'); do
        node="${row%/*}"; vmid="${row#*/}"
        conf="$(curl -sk --max-time 15 -H "Authorization: PVEAPIToken=${TOKEN}"             "${PVE_URL}/nodes/${node}/qemu/${vmid}/config" || true)"
        if [ "$(printf '%s' "$conf" | jq -r '.data.onboot // 0' 2>/dev/null)" = "1" ]; then
          stopped="$(printf '%s' "$vms" | jq -c --argjson s "$stopped" --arg node "$node" --argjson vmid "$vmid" '
            $s + [.data[] | select(.node == $node and .vmid == $vmid)
            | {labels: {alertname: "ProxmoxVMStopped", severity: "critical", check: "proxmox-storage",
                        node: .node, vmid: (.vmid | tostring), name: .name},
               annotations: {
                 summary: "Proxmox VM \(.name) (\(.vmid)) on \(.node) is \(.status) but is set to start on boot.",
                 description: "Whatever it serves is down (nfs-01: Immich library and its backup; a k8s node: its pods). Start it (Proxmox > \(.node) > \(.vmid) > Start, or qm start \(.vmid) on \(.node)) and look in the host syslog for why it stopped."}}]')"
        fi
      done
      if [ "$stopped" != "[]" ]; then echo "STOPPED:"; printf '%s' "$stopped" | jq -r '.[].annotations.summary'; else echo "OK: every onboot VM is running"; fi
    else
      echo "WARN: could not list the Proxmox VMs; ProxmoxVMStopped alerts are left as they are"
      active="$(printf '%s' "$active" | jq -c 'map(select(.labels.alertname != "ProxmoxVMStopped"))')"
    fi
    firing="$(jq -cn --argjson a "$firing" --argjson b "$stopped" '$a + $b')"
    send "$firing" "$active" || { echo "ERROR: could not post to Alertmanager"; exit 1; }
