apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: alertmanager-slack
    creationPolicy: Owner
  data:
    # Bitwarden Secrets Manager secret (homelab project) holding the Slack
    # Incoming Webhook URL — key "alertmanager-slack-webhook".
    - secretKey: webhook-url
      remoteRef:
        key: abeef982-e4eb-4968-9d95-b472015a50c1
