apiVersion: v1
kind: ConfigMap
metadata:
  name: longhorn-weekly-trend
  namespace: monitoring
data:
  longhorn-weekly-trend.sh: |
    #!/bin/sh
    # Weekly per-node Longhorn capacity summary to Slack. Storage is the
    # recurring bottleneck here (worker-04 is a small disk), so a weekly trend
    # makes pressure visible before a volume degrades.
    set -u

    webhook="$(cat /etc/slack/webhook-url)"

    body="$(kubectl get nodes.longhorn.io -n longhorn-system -o json 2>/dev/null \
      | jq -r '
          .items
          | sort_by([.status.diskStatus[].storageAvailable] | add)
          | .[]
          | . as $n
          | ([$n.status.diskStatus[].storageAvailable] | add) as $avail
          | ([$n.status.diskStatus[].storageMaximum]   | add) as $max
          | ([$n.status.diskStatus[].storageScheduled] | add) as $sched
          | ($n.spec.allowScheduling != false) as $allow
          | "• \($n.metadata.name): \((($max-$avail)/1073741824)|floor)/\(($max/1073741824)|floor) GiB used, *\(($avail/1073741824)|floor) GiB free*, \((($sched*100)/$max)|floor)% scheduled\(if $allow then "" else " (scheduling off)" end)"')"

    # Flag if the tightest node is low on real free space.
    low="$(kubectl get nodes.longhorn.io -n longhorn-system -o json 2>/dev/null \
      | jq -r '[.items[] | select(.spec.allowScheduling != false) | ([.status.diskStatus[].storageAvailable] | add)]
               | if length == 0 then 999999 else min end
               | (./1073741824) | floor')"
    emoji=":bar_chart:"
    [ -n "${low}" ] && [ "${low}" -lt 15 ] && emoji=":warning:"

    msg="$(printf '%s *Longhorn weekly capacity trend*\n_%s_\n\n%s\n\n_Over-provisioning (scheduled %%) is normal for Longhorn thin-provisioning; watch the GiB free column — that is the hard limit._' \
      "${emoji}" "$(date -u '+%Y-%m-%d')" "${body}")"

    printf '%s\n\n' "${msg}"
    payload="$(jq -n --arg t "${msg}" '{text:$t}')"
    curl -s -o /dev/null -w 'slack_status=%{http_code}\n' \
      -X POST -H 'content-type: application/json' --data "${payload}" "${webhook}"
