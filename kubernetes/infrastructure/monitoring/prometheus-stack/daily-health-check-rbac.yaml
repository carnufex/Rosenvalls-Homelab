apiVersion: v1
kind: ServiceAccount
metadata:
  name: daily-health-check
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
---
# Cluster-wide READ only: the morning summary needs to see state across the
# whole cluster (nodes, pods, ArgoCD apps, ExternalSecrets, Longhorn volumes).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: daily-health-check
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "list"]
  - apiGroups: ["longhorn.io"]
    resources: ["volumes", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: daily-health-check
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
subjects:
  - kind: ServiceAccount
    name: daily-health-check
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: daily-health-check
