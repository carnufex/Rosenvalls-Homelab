apiVersion: batch/v1
kind: CronJob
metadata:
  name: longhorn-weekly-trend
  namespace: monitoring
spec:
  schedule: "0 8 * * 1"
  timeZone: Europe/Stockholm
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: daily-health-check
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: trend
              image: alpine/k8s:1.35.8@sha256:aaeed1de1399aa816535d376c7d5c9bea905892301649ffaee0905397c7d4956
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - /scripts/longhorn-weekly-trend.sh
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: slack
                  mountPath: /etc/slack
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
          volumes:
            - name: script
              configMap:
                name: longhorn-weekly-trend
                defaultMode: 0555
            - name: slack
              secret:
                secretName: alertmanager-slack
