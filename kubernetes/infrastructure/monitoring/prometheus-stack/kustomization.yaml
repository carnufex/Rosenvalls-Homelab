apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - grafana-oauth-externalsecret.yaml
  - alertmanager-slack-externalsecret.yaml
  - alertmanager-lots-externalsecret.yaml   # the bearer of the receiver lots (values.yaml)
  - grafana-http-route.yaml
  - prometheus-http-route.yaml
  - homelab-app-alerts.yaml
  - longhorn-alerts.yaml
  - homelab-app-status-dashboard.yaml
  - daily-health-check-rbac.yaml
  - daily-health-check-configmap.yaml
  - daily-health-check-cronjob.yaml
  - longhorn-weekly-trend-configmap.yaml
  - longhorn-weekly-trend-cronjob.yaml
  - proxmox-storage-alert-externalsecret.yaml
  - proxmox-storage-alert-configmap.yaml
  - proxmox-storage-alert-cronjob.yaml
  - talos-fstrim-daemonset.yaml   # weekly fstrim of every node, so the Proxmox thin pools get freed blocks back
  - cilium-envoy-podmonitor.yaml
  - cilium-envoy-alerts.yaml
  - oncall-demo-alerts.yaml   # OncallDemoPodCrashLooping, investigated by Lots (applications/lots/README.md)

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 93.5.0
    releaseName: kube-prometheus-stack
    namespace: monitoring
    valuesFile: values.yaml
    includeCRDs: true
    kubeVersion: v1.37.0

patches:
  - path: deployment-hardening-patch.yaml
