apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - grafana-oauth-externalsecret.yaml
  - alertmanager-slack-externalsecret.yaml
  - grafana-http-route.yaml
  - prometheus-http-route.yaml
  - homelab-app-alerts.yaml
  - longhorn-alerts.yaml
  - homelab-app-status-dashboard.yaml
  - daily-health-check-rbac.yaml
  - daily-health-check-configmap.yaml
  - daily-health-check-cronjob.yaml
  - longhorn-weekly-trend-configmap.yaml
  - longhorn-weekly-trend-cronjob.yaml

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 68.1.0
    releaseName: kube-prometheus-stack
    namespace: monitoring
    valuesFile: values.yaml
    includeCRDs: true
    kubeVersion: v1.31.1

patches:
  - path: deployment-hardening-patch.yaml
