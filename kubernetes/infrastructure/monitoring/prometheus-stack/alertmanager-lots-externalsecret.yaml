# The bearer Alertmanager's receiver lots sends to Lots' POST /signals/homelab-alertmanager (values.yaml; Lots' alert source
# homelab-alertmanager, applications/lots/gitops/incidents-homelab.yaml). Mounted at
# /etc/alertmanager/secrets/alertmanager-lots/token through alertmanagerSpec.secrets. Bitwarden Secrets Manager (homelab project):
# LOTS_SIGNAL_HOMELAB, the same entry as LOTS_SIGNAL_HOMELAB in lots-secrets (applications/lots/secrets.yaml).
# To remove: this file, its line in kustomization.yaml, its entry in alertmanagerSpec.secrets, and the receiver and route lots.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-lots
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: alertmanager-lots
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: 6aca04a7-eb64-409f-81f2-b503016c2388 # LOTS_SIGNAL_HOMELAB
