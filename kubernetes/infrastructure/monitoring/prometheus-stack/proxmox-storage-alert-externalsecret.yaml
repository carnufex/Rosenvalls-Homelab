apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proxmox-monitoring-token
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: proxmox-monitoring-token
    creationPolicy: Owner
  data:
    # Bitwarden Secrets Manager secret (homelab project) holding a read-only
    # Proxmox API token — full value "root@pam!monitoring=<uuid>" (PVEAuditor
    # role, propagated on /). Created for the storage-fill Slack alert after the
    # 2026-07-13 local-lvm-full io-error outage. Rotate here + in Proxmox.
    - secretKey: token
      remoteRef:
        key: 5fd127d5-a183-4a36-9049-b4860128b68d
