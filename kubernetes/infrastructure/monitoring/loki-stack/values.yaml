loki:
  enabled: true
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 10Gi
  config:
    auth_enabled: false
    common:
      path_prefix: /var/loki
      storage:
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2020-10-24
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h

promtail:
  enabled: true
  config:
    clients:
      - url: http://loki-stack:3100/loki/api/v1/push

grafana:
  enabled: false
  sidecar:
    datasources:
      enabled: true
      label: grafana_datasource
