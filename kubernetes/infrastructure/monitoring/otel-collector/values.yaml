fullnameOverride: otel-collector
mode: deployment
replicaCount: 1
image:
  repository: otel/opentelemetry-collector-contrib
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 384Mi
ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
alternateConfig:
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318
  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch: {}
    tail_sampling:
      decision_wait: 10s
      policies:
        - name: errors
          type: status_code
          status_code:
            status_codes: [ERROR]
        - name: policy-denied-or-approval
          type: string_attribute
          string_attribute:
            key: lots.policy.decision
            values: [Deny, RequireApproval]
        - name: slow
          type: latency
          latency:
            threshold_ms: 10000
        - name: everything-else
          type: probabilistic
          probabilistic:
            sampling_percentage: 25
  exporters:
    otlp/tempo:
      endpoint: tempo:4317
      tls:
        insecure: true
    nop: {}
  service:
    extensions: [health_check]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, tail_sampling, batch]
        exporters: [otlp/tempo]
      logs:
        receivers: [otlp]
        processors: [memory_limiter]
        exporters: [nop]
