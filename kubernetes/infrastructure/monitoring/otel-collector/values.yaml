fullnameOverride: otel-collector
mode: deployment
replicaCount: 1
image:
  repository: otel/opentelemetry-collector-contrib
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 384Mi
ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
alternateConfig:
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318
  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch: {}
    # Every trace is kept except the probes': the homelab's traffic is small, and tail sampling decided on an agent run before
    # its spans had arrived (a run takes longer than the decision window), so the slow runs were the ones dropped.
    filter/probes:
      error_mode: ignore
      traces:
        span:
          - 'IsMatch(attributes["url.path"], "^/(health|healthz|ready|readyz|livez|metrics)(/.*)?$")'
  exporters:
    otlp/tempo:
      endpoint: tempo:4317
      tls:
        insecure: true
    nop: {}
  service:
    extensions: [health_check]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, filter/probes, batch]
        exporters: [otlp/tempo]
      logs:
        receivers: [otlp]
        processors: [memory_limiter]
        exporters: [nop]
