apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The OpenTelemetry Collector apps send traces to (OTLP on otel-collector.monitoring:4317/4318). Every trace but the health
# probes' goes to Tempo (a week kept).
# Logs are read from stdout by Loki's promtail, so the OTLP logs pipeline only drops what apps send it.
helmCharts:
  - name: opentelemetry-collector
    repo: https://open-telemetry.github.io/opentelemetry-helm-charts
    version: 0.178.3
    releaseName: otel-collector
    namespace: monitoring
    valuesFile: values.yaml
