# Direct LAN exposure of Home Assistant's API on a fixed IP via Cilium LB-IPAM.
#
# Why this exists in addition to the ClusterIP Service + internal Gateway route:
# push-based IoT devices (e.g. battery Shelly Plus H&T) cannot be polled — they
# wake, push their reading, and sleep. They reach HA over plain `ws://` to
# port 8123 (Shelly "Outbound WebSocket" -> ws://<ip>:8123/api/shelly/ws). They
# cannot use the internal Gateway path because:
#   - the Gateway listens on 443 with a cluster-local CA cert these devices do
#     not trust (no way to install our CA on most IoT firmware), and
#   - HA's plain 8123 only exists as a ClusterIP / pod IP (10.244.0.0/16), which
#     is unreachable from the WiFi LAN.
# So such devices need a real LAN IP that speaks plain HTTP/WS straight to 8123.
#
# 192.168.1.224 is free in first-pool (192.168.1.220-229; .220/.222 = gateways,
# .223 = gatebound TFS). Eligibility requires the `homeassistant` namespace to be
# listed in BOTH the CiliumLoadBalancerIPPool serviceSelector AND the
# CiliumL2AnnouncementPolicy serviceSelector under
# kubernetes/infrastructure/network/cilium/ — without the announcement policy the
# IP is allocated but never ARP'd on the LAN, so it stays unreachable.
apiVersion: v1
kind: Service
metadata:
  name: homeassistant-lan
  namespace: homeassistant
  annotations:
    io.cilium/lb-ipam-ips: "192.168.1.224"
spec:
  type: LoadBalancer
  # Cluster (not Local): with Cilium L2 announcement the IP is announced from an
  # elected node that may not be the lan-special node running the HA pod;
  # externalTrafficPolicy: Local would then black-hole traffic on the announcer.
  # Cluster lets any node forward to the pod. Trade-off: client source IP is
  # SNAT'd to a node IP — fine here, the /api/shelly/ws endpoint does not depend
  # on the real client address.
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: homeassistant
  ports:
    - name: http
      port: 8123
      targetPort: http
      protocol: TCP
