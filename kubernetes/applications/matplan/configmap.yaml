apiVersion: v1
kind: ConfigMap
metadata:
  name: matplan-config
  namespace: matplan
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  ASPNETCORE_ENVIRONMENT: Staging
  ASPNETCORE_URLS: http://+:8080
  Cors__AllowedOrigins__0: https://matplan.rosenvall.se
  Ollama__BaseUrl: http://ollama.ollama.svc.cluster.local:11434
  AiChat__Ollama__BaseUrl: http://ollama.ollama.svc.cluster.local:11434
  Voice__Whisper__BaseUrl: http://matplan-whisper:8080
  Voice__Piper__BaseUrl: http://matplan-piper:5000
  Voice__Piper__DefaultVoiceId: sv_SE-nst-medium
  Voice__Piper__FallbackVoiceId: sv_SE-lisa-medium
  Database__ApplyMigrations: "true"
  Database__SeedDemoData: "false"
  DataProtection__KeysPath: /var/lib/matplan/dpkeys
  FeatureFlags__RecipeAssistantEnabled: "false"
  FeatureFlags__VoiceAssistantEnabled: "false"
  FeatureFlags__VoiceWakeWordEnabled: "false"
  GoogleAuth__ClientId: 752703847113-sk82lb3mb0p0snl8m2s7pmvemac74p9n.apps.googleusercontent.com
  GoogleAuth__RedirectUri: https://matplan.rosenvall.se/api/auth/google/callback
