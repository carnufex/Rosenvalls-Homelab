apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matplan-secrets
  namespace: matplan
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: matplan-secrets
    creationPolicy: Owner
  data:
    - secretKey: ConnectionStrings__MatPlan
      remoteRef:
        key: REPLACE_WITH_BITWARDEN_CONNECTION_STRING_ITEM_ID
    - secretKey: Jwt__SigningKey
      remoteRef:
        key: REPLACE_WITH_BITWARDEN_JWT_SIGNING_KEY_ITEM_ID
    - secretKey: GoogleAuth__ClientId
      remoteRef:
        key: REPLACE_WITH_BITWARDEN_GOOGLE_CLIENT_ID_ITEM_ID
    - secretKey: GoogleAuth__ClientSecret
      remoteRef:
        key: REPLACE_WITH_BITWARDEN_GOOGLE_CLIENT_SECRET_ITEM_ID
