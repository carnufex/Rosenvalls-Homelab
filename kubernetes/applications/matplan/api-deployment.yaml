apiVersion: apps/v1
kind: Deployment
metadata:
  name: matplan-api
  namespace: matplan
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: matplan-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matplan-api
    spec:
      serviceAccountName: matplan-runtime
      containers:
        - name: api
          image: ghcr.io/carnufex/matplan-api@sha256:c67e0fa91ca18cf6f2a74af4262bda56182f511dd449eaf4f0085c88317b9be5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: matplan-config
            - secretRef:
                name: matplan-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data-protection-keys
              mountPath: /var/lib/matplan/dpkeys
      volumes:
        - name: data-protection-keys
          persistentVolumeClaim:
            claimName: matplan-data-protection
