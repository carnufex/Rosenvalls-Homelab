apiVersion: apps/v1
kind: Deployment
metadata:
  name: matplan-piper
  namespace: matplan
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: matplan-piper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matplan-piper
    spec:
      serviceAccountName: matplan-runtime
      initContainers:
        - name: piper-voice-bootstrap
          image: ghcr.io/ggml-org/whisper.cpp@sha256:d42a7ca69f54f4760492e57d3ced6afaa653b8d75cfd6dcb4014cf0cc87a0754
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
            - >-
              set -euo pipefail;
              voice="sv_SE-nst-medium";
              voice_base="https://huggingface.co/rhasspy/piper-voices/resolve/87e544f8852c43702201f2820228009df782c956/sv/sv_SE/nst/medium";
              mkdir -p /data;
              if [ ! -f "/data/${voice}.onnx" ]; then
                echo "Downloading pinned Piper voice ${voice} to /data";
                curl -L --fail "${voice_base}/${voice}.onnx" -o "/data/${voice}.onnx";
                echo "df011f56825a59dd1efc080c38a65a1ef70407e60f63050e9246f43a3d7e471e  /data/${voice}.onnx" | sha256sum -c -;
              else
                echo "Piper voice already exists: /data/${voice}.onnx";
                echo "df011f56825a59dd1efc080c38a65a1ef70407e60f63050e9246f43a3d7e471e  /data/${voice}.onnx" | sha256sum -c -;
              fi;
              if [ ! -f "/data/${voice}.onnx.json" ]; then
                echo "Downloading pinned Piper voice config ${voice} to /data";
                curl -L --fail "${voice_base}/${voice}.onnx.json" -o "/data/${voice}.onnx.json";
              fi
          volumeMounts:
            - name: piper-data
              mountPath: /data
      containers:
        - name: piper
          image: rhasspy/wyoming-piper@sha256:659be31324ce981b03a906197e0dfdb519b84e5e4960f746d08ba217c013519f
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          args:
            - --voice
            - sv_SE-nst-medium
            - --uri
            - tcp://0.0.0.0:10200
            - --data-dir
            - /data
            - --download-dir
            - /data
          env:
            - name: PIPER_VOICE
              value: sv_SE-nst-medium
            - name: PIPER_FALLBACK_VOICE
              value: sv_SE-nst-medium
            - name: PIPER_PORT
              value: "5000"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: piper-data
              mountPath: /data
      volumes:
        - name: piper-data
          persistentVolumeClaim:
            claimName: matplan-piper-data
