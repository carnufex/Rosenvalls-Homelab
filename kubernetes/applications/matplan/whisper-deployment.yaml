apiVersion: apps/v1
kind: Deployment
metadata:
  name: matplan-whisper
  namespace: matplan
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: matplan-whisper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matplan-whisper
    spec:
      serviceAccountName: matplan-runtime
      nodeSelector:
        kubernetes.io/hostname: worker-01
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: whisper
          image: ghcr.io/ggml-org/whisper.cpp@sha256:d42a7ca69f54f4760492e57d3ced6afaa653b8d75cfd6dcb4014cf0cc87a0754
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
            - >-
              set -euo pipefail;
              model_path="/models/ggml-${WHISPER_MODEL:-kb-large}.bin";
              if [ ! -f "${model_path}" ]; then
                echo "Missing whisper model at ${model_path}.";
                exit 1;
              fi;
              echo "Using whisper model ${WHISPER_MODEL:-kb-large}";
              exec whisper-server --host 0.0.0.0 --port ${WHISPER_PORT:-8080} --convert -m "${model_path}"
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: WHISPER_MODEL
              value: kb-large
            - name: WHISPER_PORT
              value: "8080"
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 2
              memory: 4Gi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: whisper-models
              mountPath: /models
      initContainers:
        - name: whisper-model-bootstrap
          image: ghcr.io/ggml-org/whisper.cpp@sha256:d42a7ca69f54f4760492e57d3ced6afaa653b8d75cfd6dcb4014cf0cc87a0754
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
            - >-
              set -euo pipefail;
              model="${WHISPER_MODEL:-kb-large}";
              model_path="/models/ggml-${model}.bin";
              if [ -f "${model_path}" ]; then
                echo "Whisper model already exists: ${model_path}";
                echo "b66f2dda369a88f6c03fe37326d7cc37aa216f6f34e6fc1be686e497ba9c2f39  ${model_path}" | sha256sum -c -;
                exit 0;
              fi;
              mkdir -p /models;
              if [ "${model}" = "kb-large" ]; then
                echo "Downloading Whisper model kb-large...";
                curl -L --fail "https://huggingface.co/KBLab/kb-whisper-large/resolve/45842886f11c9731145752f27f61d2663dd73445/ggml-model.bin" -o "${model_path}";
                echo "b66f2dda369a88f6c03fe37326d7cc37aa216f6f34e6fc1be686e497ba9c2f39  ${model_path}" | sha256sum -c -;
              else
                echo "Only the pinned kb-large Whisper model is supported in GitOps.";
                exit 1;
              fi
          env:
            - name: WHISPER_MODEL
              value: kb-large
          volumeMounts:
            - name: whisper-models
              mountPath: /models
      volumes:
        - name: whisper-models
          persistentVolumeClaim:
            claimName: matplan-whisper-models
