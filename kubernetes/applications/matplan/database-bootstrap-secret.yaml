apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matplan-postgresql-bootstrap
  namespace: matplan
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager-matplan
  target:
    name: matplan-postgresql-bootstrap
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/basic-auth
      data:
        username: "matplan"
        password: '{{ .connectionString | regexFind "Password=[^;]+" | trimPrefix "Password=" }}'
  data:
    - secretKey: connectionString
      remoteRef:
        key: 07a35bfb-a56d-4754-b7bb-b4180140bd3c
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
