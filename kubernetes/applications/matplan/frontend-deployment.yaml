apiVersion: apps/v1
kind: Deployment
metadata:
  name: matplan-frontend
  namespace: matplan
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: matplan-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matplan-frontend
    spec:
      serviceAccountName: matplan-runtime
      containers:
        - name: frontend
          image: ghcr.io/carnufex/matplan-frontend@sha256:a7c91ff85dfaa9dc6ef9fdfbb5d89dec62e5e161e374f95cb87de1f031c75774
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
