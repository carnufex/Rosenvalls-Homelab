# Public entry point: ElevenLabs reaches /mcp (bearer secret) and /webhooks/*
# (HMAC), players reach the ticket pages, the website widget polls /status.
# Cloudflare Tunnel wildcard-routes *.rosenvall.se to gateway/external; this
# does the host match.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gatebound-support
  namespace: gatebound-support
spec:
  hostnames:
    - gatebound-support.rosenvall.se
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
      namespace: gateway
      sectionName: https
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: gatebound-support
          port: 8080
