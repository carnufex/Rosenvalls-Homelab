# gatebound-support: FastAPI + MCP server for the ElevenLabs "Gatebound Support"
# agent, ticket pages and the post-call webhook. Image is built locally and
# pushed to registry.rosenvall.se (see README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatebound-support
  namespace: gatebound-support
spec:
  replicas: 1                 # SQLite on a RWO volume -> single replica
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gatebound-support
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gatebound-support
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      imagePullSecrets:
        - name: gatebound-support-registry
      containers:
        - name: gatebound-support
          image: registry.rosenvall.se/carnufex/gatebound-support:sha-7ee1d80
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: PORT, value: "8080" }
            - { name: PUBLIC_BASE_URL, value: "https://gatebound-support.rosenvall.se" }
            - { name: WEB_API_BASE_URL, value: "http://gatebound-web.gatebound.svc.cluster.local:3000" }
            - { name: WEB_PUBLIC_URL, value: "https://gatebound.rosenvall.se" }
            - { name: DATA_DIR, value: /data }
            - { name: LOG_LEVEL, value: info }
          envFrom:
            - secretRef: { name: gatebound-support-secrets }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gatebound-support-data
