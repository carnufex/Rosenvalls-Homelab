# Runtime secrets for gatebound-support. Values live in Bitwarden Secrets Manager
# (homelab project, keys GATEBOUND_SUPPORT_*). The literal value "unset" means the
# integration is disabled; the app stays healthy and degrades that feature.
# ELEVENLABS_API_KEY is the same workspace key oncall-demo uses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatebound-support-secrets
  namespace: gatebound-support
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: gatebound-support-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SUPPORT_API_TOKEN
      remoteRef: { key: 3c3d38bb-8fc9-4e42-b560-b4c4007c8163, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
    - secretKey: SUPPORT_IDENTITY_SECRET
      remoteRef: { key: 2721bac1-6497-4bd6-ae1c-b4c4007c81a7, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
    - secretKey: MCP_SECRET
      remoteRef: { key: 9b198cce-fdb9-490e-a3d2-b4c4007c81d2, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
    - secretKey: ELEVENLABS_API_KEY
      remoteRef: { key: 9be20d00-b521-49f6-a480-b4bf00d37ed5, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
    - secretKey: ELEVENLABS_AGENT_ID
      remoteRef: { key: b7af8922-228c-4fa5-a8d1-b4c4007c8257, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
    - secretKey: ELEVENLABS_WEBHOOK_SECRET
      remoteRef: { key: 5f0103f9-05a3-47dc-847e-b4c4007c8216, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
    - secretKey: DISCORD_CLIENT_ID
      remoteRef: { key: 30b645ec-fdb6-4d0b-81b8-b4c4007c9333, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
    - secretKey: DISCORD_CLIENT_SECRET
      remoteRef: { key: 3df69848-3bae-4dec-a3e0-b4c4007c82c5, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
    - secretKey: DISCORD_BOT_TOKEN
      remoteRef: { key: 068096c8-2b5d-4943-806f-b4c4007c82f4, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
    - secretKey: DISCORD_GUILD_ID
      remoteRef: { key: 5c55cfe0-81da-45dd-9587-b4c4007c8334, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
    - secretKey: DISCORD_FORUM_CHANNEL_ID
      remoteRef: { key: 0ca79b27-8b93-4ceb-87e7-b4c4007c8364, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
    - secretKey: DISCORD_TAG_OPEN_ID
      remoteRef: { key: c6248843-4129-49fd-a76f-b4c4007c8390, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
    - secretKey: DISCORD_STAFF_WEBHOOK_URL
      remoteRef: { key: 9738f923-ee48-452d-8f0e-b4c4007c95c0, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
