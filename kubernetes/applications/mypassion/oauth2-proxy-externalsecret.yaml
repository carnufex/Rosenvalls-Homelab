# Authentik OAuth2 client for oauth2-proxy in front of mypassion.rosenvall.se. Bitwarden entries by NAME, created by
# carnufex/mypassion scripts/create-oauth-secrets.ps1; the same entries feed the Authentik blueprint
# (MYPASSION_CLIENT_ID / MYPASSION_CLIENT_SECRET in authentik-blueprint-secrets).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mypassion-oauth2-proxy
  namespace: mypassion
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: mypassion-oauth2-proxy
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        client-id: "{{ .CLIENT_ID }}"
        client-secret: "{{ .CLIENT_SECRET }}"
        cookie-secret: "{{ .COOKIE_SECRET }}"
  data:
    - secretKey: CLIENT_ID
      remoteRef: { key: mypassion-oauth2-client-id, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
    - secretKey: CLIENT_SECRET
      remoteRef: { key: mypassion-oauth2-client-secret, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
    - secretKey: COOKIE_SECRET
      remoteRef: { key: mypassion-oauth2-cookie-secret, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
