# Public entry point. Cloudflare Tunnel wildcard-routes *.rosenvall.se to gateway/external; this does the host match.
# Everything goes through oauth2-proxy (Authentik SSO); the site Service itself is not reachable from the gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mypassion
  namespace: mypassion
spec:
  hostnames:
    - mypassion.rosenvall.se
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
      namespace: gateway
      sectionName: https
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: mypassion-oauth2-proxy
          port: 4180
