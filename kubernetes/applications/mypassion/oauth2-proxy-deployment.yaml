# Authentik SSO in front of the deck (OIDC client `mypassion`, blueprint apps-mypassion.yaml in authentik-runtime).
# Any Authentik user may sign in (policy_engine_mode any, no binding). Same oauth2-proxy pattern as update-center and
# oncall-demo. The signed-in email is passed on as X-Forwarded-Email and lands in the site's access log.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mypassion-oauth2-proxy
  namespace: mypassion
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: mypassion-oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mypassion-oauth2-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
          imagePullPolicy: IfNotPresent
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://authentik.rosenvall.se/application/o/mypassion/
            - --insecure-oidc-allow-unverified-email=true
            - --email-domain=*
            - --http-address=0.0.0.0:4180
            - --redirect-url=https://mypassion.rosenvall.se/oauth2/callback
            - --upstream=http://mypassion.mypassion.svc.cluster.local:8080
            - --reverse-proxy=true
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-expire=168h # one sign-in lasts the week of the talk
            - --pass-user-headers=true
            - --skip-provider-button=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom: { secretKeyRef: { name: mypassion-oauth2-proxy, key: client-id } }
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: mypassion-oauth2-proxy, key: client-secret } }
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: { secretKeyRef: { name: mypassion-oauth2-proxy, key: cookie-secret } }
          ports:
            - name: http
              containerPort: 4180
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          readinessProbe: { httpGet: { path: /ping, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /ping, port: http }, initialDelaySeconds: 10, periodSeconds: 30 }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
