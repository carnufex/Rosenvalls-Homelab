# Default deny in both directions with DNS open, then one allow policy per workload (same shape as lots and cmdb).
# The site only answers oauth2-proxy, so nothing reaches the deck without an Authentik session.
# Debug drops: hubble observe -n mypassion --verdict DROPPED
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: mypassion
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mypassion
  namespace: mypassion
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mypassion
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: mypassion-oauth2-proxy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mypassion-oauth2-proxy
  namespace: mypassion
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mypassion-oauth2-proxy
  ingress:
    # Only the Cilium Gateway (HTTPRoute mypassion on gateway/external).
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "4180"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: mypassion
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # OIDC discovery, token exchange and signing keys, by public name.
    - toFQDNs:
        - matchName: authentik.rosenvall.se
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
