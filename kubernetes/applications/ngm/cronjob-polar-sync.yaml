# Nightly Polar sync fallback: calls /api/polar/sync-all with the shared cron
# key. The primary path is Polar's webhook (instant on watch upload); this
# catches anything a missed webhook left behind. Same curl-runner pattern as
# the digest cron — the pinned tag never needs bumping.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ngm-polar-sync
  namespace: ngm
spec:
  schedule: "30 6 * * *"
  timeZone: Europe/Stockholm
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ngm-image-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: polar-sync
              image: registry.rosenvall.se/carnufex/ngm:sha-cffe16b
              command:
                - node
                - -e
                - |
                  fetch("http://ngm.ngm.svc.cluster.local:3000/api/polar/sync-all", {
                    headers: { "x-ngm-cron-key": process.env.NGM_CRON_KEY ?? "" },
                  })
                    .then(async (r) => {
                      const body = await r.text();
                      console.log(r.status, body);
                      if (!r.ok) process.exit(1);
                    })
                    .catch((e) => { console.error(e); process.exit(1); });
              env:
                - name: NGM_CRON_KEY
                  valueFrom:
                    secretKeyRef: { name: ngm-cron, key: key }
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 128Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
