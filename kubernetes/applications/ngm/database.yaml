# NGM Postgres — CloudNativePG-kluster (samma mönster som matplan/authentik).
# Bootstrap utan explicit secret: CNPG genererar appanvändaren i secret
# `ngm-postgresql-app` (nyckeln `uri` konsumeras av deploymenten som DATABASE_URL).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ngm-postgresql
  namespace: ngm
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/gfs: enabled
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17

  bootstrap:
    initdb:
      database: ngm
      owner: ngm

  storage:
    size: 5Gi
    storageClass: longhorn-critical

  walStorage:
    size: 2Gi
    storageClass: longhorn-critical

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"
