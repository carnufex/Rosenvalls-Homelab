# NGM Postgres — CloudNativePG-kluster (samma mönster som matplan/authentik).
# Bootstrap utan explicit secret: CNPG genererar appanvändaren i secret
# `ngm-postgresql-app` (nyckeln `uri` konsumeras av deploymenten som DATABASE_URL).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ngm-postgresql
  namespace: ngm
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  instances: 2
  inheritedMetadata:
    labels:
      # Longhorn reads recurring-job labels from the PVC: the "cnpg" group only
      # trims. These databases are backed up with logical dumps instead.
      recurring-job.longhorn.io/source: enabled
      recurring-job-group.longhorn.io/cnpg: enabled

  # Debian 13 "standard" image; the bare :17 tag is bullseye and frozen. Plan: docs/operations/cnpg-postgres-18-plan.md
  imageName: ghcr.io/cloudnative-pg/postgresql:17-standard-trixie

  # The app's connection pool never closes its sessions, so the default smart shutdown waits the full
  # 180 s on every restart. After 15 s CNPG switches to a fast (still clean, checkpointed) shutdown.
  smartShutdownTimeout: 15

  bootstrap:
    initdb:
      database: ngm
      owner: ngm

  # Two CNPG instances already keep two copies of the data; one Longhorn replica
  # per instance is enough.
  storage:
    size: 5Gi
    storageClass: longhorn-single

  walStorage:
    size: 2Gi
    storageClass: longhorn-single

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"
