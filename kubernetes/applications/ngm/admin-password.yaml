# Trainer admin password for the NGM test environment (Bitwarden `ngm-admin-password`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ngm-admin
  namespace: ngm
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: ngm-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: 4c7a839a-8928-4110-80cc-b4b200c7630c
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
