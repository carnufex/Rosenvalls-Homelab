# NGM (träna.rosenvall.se) — Next.js 15 standalone, Postgres via CNPG (database.yaml).
# Single replica + Recreate is fine for the test environment; the app itself is
# stateless since the 2026-08-28 Postgres migration.
# Image is built locally and pushed to the self-hosted registry (see
# NextGenerationMe/web/README.md). Pinned by sha tag; bump to deploy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngm
  namespace: ngm
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ngm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ngm
    spec:
      imagePullSecrets:
        - name: ngm-image-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: registry.rosenvall.se/carnufex/ngm:sha-8cfda5e
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3000" }
            - { name: HOSTNAME, value: "0.0.0.0" }
            - { name: NEXT_TELEMETRY_DISABLED, value: "1" }
            # Postgres (CNPG-genererad appanvändare). SQLite-arvet ligger kvar på
            # PVC:n ngm-data som kall kopia efter migreringen 2026-08-28.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: ngm-postgresql-app, key: uri, optional: true }
            - { name: NGM_BASE_URL, value: "https://träna.rosenvall.se" }
            # Google-inloggning aktiveras när secret ngm-google finns (se README).
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: ngm-google, key: client-id, optional: true }
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: ngm-google, key: client-secret, optional: true }
            # Digest-cron (secret ngm-cron) och e-post (secret ngm-mail) — se README.
            - name: NGM_CRON_KEY
              valueFrom:
                secretKeyRef: { name: ngm-cron, key: key, optional: true }
            - name: SMTP_URL
              valueFrom:
                secretKeyRef: { name: ngm-mail, key: smtp-url, optional: true }
            - name: MAIL_FROM
              valueFrom:
                secretKeyRef: { name: ngm-mail, key: from, optional: true }
          resources:
            requests: { cpu: 50m, memory: 160Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/.next/cache }
          startupProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
