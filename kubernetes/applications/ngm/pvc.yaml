# SQLite database for the NGM test environment. Small on purpose — Longhorn
# capacity is tight; the app stores text-only training data.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ngm-data
  namespace: ngm
  labels:
    # Cold copy, never mounted since 2026-08-28: Longhorn's filesystem-trim job
    # aborts on a detached volume, so keep it out of the groups that trim.
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/cold: enabled
    # Longhorn copies PVC labels to the volume but never removes one, so the old
    # group must be switched off explicitly (only "enabled" counts).
    recurring-job-group.longhorn.io/default: disabled
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
