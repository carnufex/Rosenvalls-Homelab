# Pull credential for registry.rosenvall.se/carnufex/portfolio (self-hosted registry).
# Same Bitwarden `registry-password` entry as every other app namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portfolio-image-pull
  namespace: portfolio
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: portfolio-image-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "registry.rosenvall.se": {
                "username": "homelab",
                "password": "{{ .REGISTRY_PASSWORD }}",
                "auth": "{{ printf "homelab:%s" .REGISTRY_PASSWORD | b64enc }}"
              }
            }
          }
  data:
    - secretKey: REGISTRY_PASSWORD
      remoteRef:
        key: 227aad11-f6ec-4696-ae94-b47c00a93cd1
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
