# Publishes the portfolio. The Cloudflare tunnel wildcard-routes *.rosenvall.se (and the
# apex rosenvall.se) to the external gateway; this HTTPRoute does the host match.
# Staging host first (portfolio.rosenvall.se, covered by the wildcard DNS); the apex is
# added once the site is approved AND the Cloudflare DNS record for the apex exists.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portfolio
  namespace: portfolio
spec:
  hostnames:
    - portfolio.rosenvall.se
    # - rosenvall.se          # apex cut-over: uncomment when approved (needs apex DNS)
    # - www.rosenvall.se
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
      namespace: gateway
      sectionName: https
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: portfolio
          port: 3000
