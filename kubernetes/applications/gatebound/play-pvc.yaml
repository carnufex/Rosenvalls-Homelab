# Holds the in-browser /play client SHELL (otclient.html/js/wasm/data, gb-loader,
# the FS overrides and Tibia.dat/.otfi) — ~56 MB, served same-origin by the web
# app's /play catch-all route (PLAY_DIR=/play-assets). The big Tibia.spr is NOT
# duplicated here: the route streams it from the gatebound-sprites PVC
# (SPR_PATH=/sprites/Tibia.spr). Like the sprites volume, the client assets are
# gitignored/not-in-image and seeded once with `kubectl cp` (a transient pod
# mounts this rw while it is otherwise unused). web mounts it read-only.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gatebound-play
  namespace: gatebound
  labels:
    # PAUSED app (replicas 0): the volume is detached, and Longhorn's weekly
    # filesystem-trim aborts the whole run on a detached volume (2026-11-22), while
    # the nightly backup has to attach it first (failed 2026-11-26). Its data does
    # not change while detached and the last 7 backups are kept, so it sits in
    # "cold" (no jobs). On resume: default: enabled, cold: disabled.
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/cold: enabled
    # Longhorn copies PVC labels to the volume but never removes one: only
    # "enabled" counts, so switch the old group off explicitly.
    recurring-job-group.longhorn.io/default: disabled
  annotations:
    # Bind before the web workload that mounts it.
    argocd.argoproj.io/sync-wave: "-5"
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
