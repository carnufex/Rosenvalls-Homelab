# Lets the cluster pull the private ghcr.io/carnufex/gatebound-* images.
# Reuses the same Bitwarden GHCR PAT as matplan (carnufex owns both package sets),
# so no new credential is needed. Referenced by the tfs/web deployments via
# imagePullSecrets: [{name: gatebound-ghcr}].
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatebound-ghcr
  namespace: gatebound
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: gatebound-ghcr
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "username": "carnufex",
                "password": "{{ .GHCR_PAT }}",
                "auth": "{{ printf "carnufex:%s" .GHCR_PAT | b64enc }}"
              },
              "registry.rosenvall.se": {
                "username": "homelab",
                "password": "{{ .REGISTRY_PASSWORD }}",
                "auth": "{{ printf "homelab:%s" .REGISTRY_PASSWORD | b64enc }}"
              }
            }
          }
  data:
    - secretKey: GHCR_PAT
      remoteRef:
        key: 09b625aa-6a80-46bb-bf35-b41901624bb3
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: REGISTRY_PASSWORD
      remoteRef:
        key: 227aad11-f6ec-4696-ae94-b47c00a93cd1
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
