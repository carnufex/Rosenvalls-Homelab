# The Forgotten Server (8.60) game engine. Single instance — OT servers hold all
# world state in one process. config.lua comes from the gatebound-tfs-config
# ConfigMap (kustomization configMapGenerator); the DB password is read at boot
# via os.getenv("MYSQL_PASSWORD") in config.lua, sourced from the mariadb secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatebound-tfs
  namespace: gatebound
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gatebound-tfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gatebound-tfs
    spec:
      imagePullSecrets:
        - name: gatebound-ghcr
      containers:
        - name: tfs
          image: registry.rosenvall.se/carnufex/gatebound-tfs:sha-2c2db64
          imagePullPolicy: IfNotPresent
          env:
            # config.lua does mysqlPass = os.getenv("MYSQL_PASSWORD"); inject the
            # real forgottenserver-user password from the Bitwarden-backed secret.
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gatebound-mariadb
                  key: MARIADB_PASSWORD
          ports:
            - { name: login, containerPort: 7171, protocol: TCP }
            - { name: game, containerPort: 7172, protocol: TCP }
          volumeMounts:
            - name: config
              mountPath: /srv/config.lua
              subPath: config.lua
              readOnly: true
          startupProbe:
            tcpSocket: { port: login }
            periodSeconds: 5
            failureThreshold: 60      # up to 5 min for map/data load on first boot
          livenessProbe:
            tcpSocket: { port: login }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            tcpSocket: { port: login }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              # The OTServBR world is a different weight class than the old map:
              # measured 1.7 GB steady state and a 2.9 GB PEAK during map load
              # (191 MB otbm, 84 516 spawns, release build, 2026-08-27). The old
              # 512Mi/2Gi pair would have OOMKilled the pod mid-load and
              # crashlooped it. Request the steady state, allow for the peak.
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: config
          configMap:
            name: gatebound-tfs-config
