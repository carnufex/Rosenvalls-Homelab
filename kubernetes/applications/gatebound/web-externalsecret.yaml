# App secrets for the website. AUTH_SECRET signs the gb_session JWT
# (web/lib/auth.ts) — without it login/register throw. Stored in Bitwarden SM
# (same project as the DB secrets), never in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatebound-web-secrets
  namespace: gatebound
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: gatebound-web-secrets
    creationPolicy: Owner
  data:
    - secretKey: AUTH_SECRET
      remoteRef:
        key: b73e24e7-210e-42f0-ad97-b47301625a65
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
