# App secrets for the website. AUTH_SECRET signs the gb_session JWT
# (web/lib/auth.ts) — without it login/register throw. Stored in Bitwarden SM
# (same project as the DB secrets), never in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatebound-web-secrets
  namespace: gatebound
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: gatebound-web-secrets
    creationPolicy: Owner
  data:
    - secretKey: AUTH_SECRET
      remoteRef:
        key: b73e24e7-210e-42f0-ad97-b47301625a65
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: ffea04b8-4c41-4f5b-99e2-b48600aaf6f3
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: SUPPORT_API_TOKEN
      remoteRef:
        key: 3c3d38bb-8fc9-4e42-b560-b4c4007c8163
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: SUPPORT_IDENTITY_SECRET
      remoteRef:
        key: 2721bac1-6497-4bd6-ae1c-b4c4007c81a7
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: SUPPORT_AGENT_ID
      remoteRef:
        key: b7af8922-228c-4fa5-a8d1-b4c4007c8257
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
