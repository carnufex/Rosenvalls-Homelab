apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ACTIVE: MariaDB + the sprite PVC (image-independent). The TFS server and
# Next.js website stay scaffold-only until their images are published to GHCR
# (see README.md). Same approach as matplan — don't deploy runtime manifests
# with images that don't exist yet.
resources:
  - ns.yaml
  - mariadb-externalsecret.yaml
  - mariadb-pvc.yaml
  - mariadb-service.yaml
  - mariadb-deployment.yaml
  # Sprite graphics (Tibia.spr) for the website's sprite routes + future /play.
  # Independent of the images, so active now; seed it with sprites-seed-pod.yaml
  # (see README "Sprite assets"). The TFS server does not use sprites.
  - sprites-pvc.yaml
  # GHCR pull credential (reuses the matplan Bitwarden PAT) — needed before any
  # gatebound-* image can be pulled. Safe/inert until a deployment references it.
  - ghcr-image-pull-secret.yaml
  # Website app secrets (AUTH_SECRET) from Bitwarden — needed before web starts.
  - web-externalsecret.yaml
  # TFS game server — image published, config.lua via configMapGenerator below.
  - tfs-deployment.yaml
  - tfs-service.yaml            # LoadBalancer (Cilium LB-IPAM) for TCP 7171/7172
  # Website (site-only; /play WASM client not bundled yet).
  - web-deployment.yaml         # mounts gatebound-sprites RO, SPR_PATH=/sprites/Tibia.spr
  - web-service.yaml
  - web-httproute.yaml          # gatebound.rosenvall.se via gateway/external
  # --- staged: /play browser client (deferred) ---
  # - web-bridges-deployment.yaml   # websockify wss bridges for the WASM client

# Forgotten Server DB schema + GM seed, mounted into MariaDB's
# /docker-entrypoint-initdb.d. Snapshot of the game repo at onboarding time;
# refresh from Gatebound-2d and delete the PVC to re-init if the schema changes.
configMapGenerator:
  - name: gatebound-mariadb-init
    files:
      - db-init/01-schema.sql
      - db-init/02-seed-gm.sql
    options:
      disableNameSuffixHash: true
  # config.lua for TFS (key 'config.lua' <- file tfs-config.lua). Snapshot of the
  # game repo's server-config/config.lua with mysqlHost=mariadb, the password read
  # via os.getenv, and ip=play.rosenvall.se. Stable name (no hash) so the
  # deployment's volume ref is fixed.
  - name: gatebound-tfs-config
    files:
      - config.lua=tfs-config.lua
    options:
      disableNameSuffixHash: true
