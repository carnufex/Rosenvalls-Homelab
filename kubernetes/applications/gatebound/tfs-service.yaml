# Exposes the TFS game protocol on a fixed LAN IP via Cilium LB-IPAM. The native
# OT client speaks raw TCP (not HTTP), so this can't go through the Cloudflare
# HTTP tunnel — the router forwards public 7171/7172 to this IP, and the DNS-only
# A-record play.rosenvall.se -> the home public IP points clients here.
# 192.168.1.223 is free in first-pool (192.168.1.220-229; .220/.222 = gateways).
apiVersion: v1
kind: Service
metadata:
  name: gatebound-tfs
  namespace: gatebound
  annotations:
    io.cilium/lb-ipam-ips: "192.168.1.223"
spec:
  type: LoadBalancer
  # Cluster (not Local): with Cilium L2 announcement the IP is announced from an
  # elected node that may not run the TFS pod; externalTrafficPolicy: Local would
  # then black-hole traffic on that node. Cluster lets any node forward to the
  # pod. Trade-off: client source IP is SNAT'd to a node IP, so TFS per-IP limits
  # see the node — fine at friends scale.
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: gatebound-tfs
  ports:
    - { name: login, port: 7171, targetPort: login, protocol: TCP }
    - { name: game, port: 7172, targetPort: game, protocol: TCP }
