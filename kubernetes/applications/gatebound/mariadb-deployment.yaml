apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatebound-mariadb
  namespace: gatebound
spec:
  replicas: 0 # PAUSED 2026-11-19: no traffic; data kept on the PVCs. Set back to 1 to resume (see README).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gatebound-mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gatebound-mariadb
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          image: mariadb:11.8.9@sha256:d36f18d65a0459510b8b0f643b226a6d299e3206486e2b64ff20754a6d291707
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: gatebound-mariadb
          env:
            # Run mariadb-upgrade on start when the data dir is from an older
            # version (11.4 -> 11.8 on 2026-11-19); a no-op otherwise.
            - name: MARIADB_AUTO_UPGRADE
              value: "1"
          ports:
            - name: mysql
              containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            # Runs only on first start (empty data volume), alphabetical order:
            # 01-schema.sql (Forgotten Server schema) then 02-seed-gm.sql.
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          startupProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gatebound-mariadb-data
        - name: init
          configMap:
            name: gatebound-mariadb-init
