apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatebound-mariadb
  namespace: gatebound
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: gatebound-mariadb
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # DB name and user are config (not secret); passwords come from Bitwarden.
        MARIADB_DATABASE: forgottenserver
        MARIADB_USER: forgottenserver
        MARIADB_ROOT_PASSWORD: "{{ .root }}"
        MARIADB_PASSWORD: "{{ .userpw }}"
  data:
    - secretKey: root
      remoteRef:
        key: 6dda7d4d-1ab7-4daa-af38-b47300f6bc89
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: userpw
      remoteRef:
        key: 2b92ef0d-0979-4255-b4bf-b47300f6bcbe
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
