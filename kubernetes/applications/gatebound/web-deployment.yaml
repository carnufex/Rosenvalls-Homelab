# The Next.js website (accounts, library, shop, calculators). Site-only image —
# the heavy /play WASM client is not bundled yet (see Gatebound-2d ops/README).
# DB creds + AUTH_SECRET come from the Bitwarden-backed secrets; sprite routes
# read Tibia.spr from the gatebound-sprites PVC (read-only) at SPR_PATH.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatebound-web
  namespace: gatebound
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate            # RWO sprite volume -> single attach
  selector:
    matchLabels:
      app.kubernetes.io/name: gatebound-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gatebound-web
    spec:
      imagePullSecrets:
        - name: gatebound-ghcr
      containers:
        - name: web
          image: registry.rosenvall.se/carnufex/gatebound-web:sha-1fbbaab
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: DATABASE_HOST, value: mariadb }
            - { name: DATABASE_PORT, value: "3306" }
            - { name: DATABASE_USER, value: forgottenserver }
            - { name: DATABASE_NAME, value: forgottenserver }
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: { name: gatebound-mariadb, key: MARIADB_PASSWORD }
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef: { name: gatebound-web-secrets, key: AUTH_SECRET }
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef: { name: gatebound-web-secrets, key: RESEND_API_KEY }
            # Character bazaar + web market buy. Flipped ON 2026-07-13 after the
            # Warden telemetry + gbserial escrow verification landed (sha-8d721d2).
            - { name: WEB_ECONOMY_FEATURES, value: "on" }
            - { name: SPR_PATH, value: /sprites/Tibia.spr }
            # NOTE: SERVER_PATH (TFS data for the calculators / live monster wiki)
            # is not mounted yet — those pages degrade until TFS data is shared.
            # Thin-client updater (see Gatebound-2d ops/client-updater/README.md).
            # R2 public base for the graphics + the client zip's Release asset URL.
            - { name: CLIENT_ASSETS_URL, value: "https://pub-c7aad8ba448f46128b5aa70b19f9d34c.r2.dev" }
            - { name: CLIENT_DOWNLOAD_URL, value: "https://pub-c7aad8ba448f46128b5aa70b19f9d34c.r2.dev/gatebound-client-win.zip" }
            # Linux client (built from client-v1.2 / ee0fb60, WSL gcc-13 build —
            # see docs/macos-release-runbook.md in Gatebound-2d for the mac gap).
            # CLIENT_DOWNLOAD_URL_MAC stays unset on purpose: beta gate, needs a
            # real Mac tester (macos-client-beta-gate decision 2026-07-02).
            - { name: CLIENT_DOWNLOAD_URL_LINUX, value: "https://pub-c7aad8ba448f46128b5aa70b19f9d34c.r2.dev/releases/client-v1.2/gatebound-client-linux.tar.gz" }
            # In-browser /play client shell (otclient.* + gb-loader + overrides +
            # Tibia.dat/.otfi) on the gatebound-play PVC; the app's /play route
            # streams them same-origin. Tibia.spr is reused from SPR_PATH (sprites
            # PVC), not duplicated here.
            - { name: PLAY_DIR, value: /play-assets }
          volumeMounts:
            - { name: sprites, mountPath: /sprites, readOnly: true }
            - { name: play, mountPath: /play-assets, readOnly: true }
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: sprites
          persistentVolumeClaim:
            claimName: gatebound-sprites
            readOnly: true
        - name: play
          persistentVolumeClaim:
            claimName: gatebound-play
            readOnly: true
