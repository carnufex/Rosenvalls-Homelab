# Shared client graphics for the website's sprite-render API routes
# (web/lib/sprites.ts reads Tibia.spr at SPR_PATH) and, later, the /play WASM
# client. The TFS *server* does NOT use sprites — it reads items.otb. Only web
# (and a future /play asset) consume this.
#
# The .spr is ~436 MB and proprietary/local (OneDrive / OTC-Fonticak), so it is
# NEVER in Git and NOT in any image. It is seeded once with kubectl cp via
# sprites-seed-pod.yaml (see README "Sprite assets"). web mounts this read-only;
# losing the .spr only blanks sprite routes (web has an existsSync guard), it
# does not crash the app.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gatebound-sprites
  namespace: gatebound
  labels:
    # PAUSED app (replicas 0): the volume is detached, and Longhorn's weekly
    # filesystem-trim aborts the whole run on a detached volume (2026-11-22), while
    # the nightly backup has to attach it first (failed 2026-11-26). Its data does
    # not change while detached and the last 7 backups are kept, so it sits in
    # "cold" (no jobs). On resume: default: enabled, cold: disabled.
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/cold: enabled
    # Longhorn copies PVC labels to the volume but never removes one: only
    # "enabled" counts, so switch the old group off explicitly.
    recurring-job-group.longhorn.io/default: disabled
  annotations:
    # Bind before any workload that mounts it.
    argocd.argoproj.io/sync-wave: "-5"
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
