# Tests of the teacher contexts (skola-planering, skola-bedomning), applied by the shell itself (GitOps:Path, managed by gitops).
# Retrieval: the right syllabus comes first for each question (k 1), without a model. Routing: each question reaches the right
# context for a teacher. Answers: real runs as svc-tests with the teacher role; planning uses the hosted model, assessment the local one.
kind: TestSuite
name: skola-svenska-retrieval
target: retrieval
source: skola-svenska
k: 1
schedule: { cron: "0 6 * * *", timeZone: Europe/Stockholm }
tests:
  - prompt: Vilka betygskriterier gäller för betyget E i Svenska 1?
    expect: [{ kind: document, value: "Svenska – gymnasieskolan, kurser (GY11, elever som började före hösten 2025)" }]
  - prompt: Vad ska undervisningen i svenska nivå 2 behandla?
    expect: [{ kind: document, value: "Svenska – gymnasieskolan, ämnesbetyg med nivåer (GY25, elever som började från hösten 2025)" }]
  - prompt: Centralt innehåll i svenska för årskurs 7–9
    expect: [{ kind: document, value: "Svenska – grundskolan, kursplan (Lgr22, grundskoleämnen på introduktionsprogrammen)" }]
  - prompt: Betygskriterier för betyget E i slutet av årskurs 9 i svenska
    expect: [{ kind: document, value: "Svenska – grundskolan, kursplan (Lgr22, grundskoleämnen på introduktionsprogrammen)" }]
    frozen: true
  - prompt: Vad krävs för betyget A i svenska med ämnesbetyg (GY25)?
    expect: [{ kind: document, value: "Svenska – gymnasieskolan, ämnesbetyg med nivåer (GY25, elever som började från hösten 2025)" }]
  - prompt: Litteraturhistoria och epoker i kursen Svenska 3
    expect: [{ kind: document, value: "Svenska – gymnasieskolan, kurser (GY11, elever som började före hösten 2025)" }]
    frozen: true
