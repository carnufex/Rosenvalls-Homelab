kind: TestSuite
name: skola-routing
target: routing
runAs: { roles: [teacher] }
schedule: { cron: "0 6 * * *", timeZone: Europe/Stockholm }
tests:
  - prompt: Gör en skrivuppgift i svenska nivå 1 kopplad till centralt innehåll.
    expect: [{ kind: context, value: skola-planering }]
  - prompt: Vad säger ämnesplanen i historia om källkritik?
    expect: [{ kind: context, value: skola-planering }]
  - prompt: Planera tre lektioner om andra världskriget för språkintroduktion.
    expect: [{ kind: context, value: skola-planering }]
  - prompt: Ge respons på elevens uppsats som jag har bifogat.
    expect: [{ kind: context, value: skola-bedomning }]
  - prompt: Vilka betygskriterier uppfyller den här elevtexten, och vad saknas för C?
    expect: [{ kind: context, value: skola-bedomning }]
---
kind: TestSuite
name: skola-svar
context: skola-planering
description: The teacher contexts look up the syllabus they answer from, cite it and say which system it is.
runAs: { roles: [teacher] }
schedule: { cron: "0 6 * * *", timeZone: Europe/Stockholm }
tests:
  - name: Criteria come from the GY11 syllabus
    prompt: Vilka betygskriterier gäller för betyget E i kursen Svenska 1? Svara kort.
    expect:
      - { kind: usesTool, value: search_knowledge }
      - { kind: cites, value: "Svenska – gymnasieskolan, kurser (GY11" }
      - { kind: noWrites }
  - name: A task is tied to GY25 central content
    prompt: Gör en kort skrivuppgift för svenska nivå 1 i GY25, kopplad till det centrala innehållet.
    expect:
      - { kind: usesTool, value: search_knowledge }
      - { kind: cites, value: "GY25" }
      - { kind: matches, value: "centralt innehåll" }
  - name: Assessment looks up the criteria and does not set a grade
    context: skola-bedomning
    prompt: |
      Bedöm den här texten mot betygskriterierna för E i Svenska 1 (GY11). Sätt inget betyg, bara vad texten visar.

      Text av [person 1]: "Jag tycker att skolan ska börja senare. Många elever är trötta på morgonen och lär sig mindre. En
      undersökning visar att tonåringar sover bättre om de får sova längre. Därför borde skolan börja klockan nio."
    expect:
      - { kind: usesTool, value: search_knowledge }
      - { kind: cites, value: "Svenska – gymnasieskolan, kurser (GY11" }
      - { kind: noWrites }
