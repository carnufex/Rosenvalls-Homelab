apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ns.yaml
  - image-pull-secret.yaml
  - secrets.yaml
  - database.yaml
  - db-dump.yaml
  - audio.yaml
  - app.yaml
  - toolpack.yaml
  - toolpack-updates.yaml # Updates: update-center's machine API as tools for the homelab-updates context (README.md)
  - ops-rbac.yaml # Incidents on the real cluster: the tool pack's read-only reach into oncall-demo (README.md)
  - networkpolicy.yaml
  - httproute.yaml
  - monitoring.yaml

# School knowledge for Lots (knowledge/skolverket.py writes the files): one key per file, mounted by subPath in app.yaml.
configMapGenerator:
  # The Lots Grafana dashboard (a copy of carnufex/Lots deploy/grafana/lots-dashboard.json); Grafana's sidecar finds it in any
  # namespace by the grafana_dashboard label.
  - name: lots-grafana-dashboard
    namespace: lots
    files:
      - lots-dashboard.json=grafana/lots-dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: lots-knowledge-skola
    namespace: lots
    files:
      - skola-historia.grgrhis01.md=knowledge/skola/skola-historia/grgrhis01.md
      - skola-historia.his.md=knowledge/skola/skola-historia/his.md
      - skola-historia.hist.md=knowledge/skola/skola-historia/hist.md
      - skola-styrdokument.lgy2025.md=knowledge/skola/skola-styrdokument/lgy2025.md
      - skola-svenska.grgrsve01.md=knowledge/skola/skola-svenska/grgrsve01.md
      - skola-svenska.sve.md=knowledge/skola/skola-svenska/sve.md
      - skola-svenska.sven.md=knowledge/skola/skola-svenska/sven.md
      - skola-svenska-som-andrasprak.grgrsva01.md=knowledge/skola/skola-svenska-som-andrasprak/grgrsva01.md
      - skola-svenska-som-andrasprak.sva.md=knowledge/skola/skola-svenska-som-andrasprak/sva.md
      - skola-svenska-som-andrasprak.svea.md=knowledge/skola/skola-svenska-som-andrasprak/svea.md
  # Resources the shell applies itself (GitOps__Path=/gitops in app.yaml).
  - name: lots-gitops
    namespace: lots
    files:
      - skola-tests.yaml=gitops/skola-tests.yaml
      - guards.yaml=gitops/guards.yaml
      - incidents-demo.yaml=gitops/incidents-demo.yaml
      - incidents-homelab.yaml=gitops/incidents-homelab.yaml
      - incidents-updates.yaml=gitops/incidents-updates.yaml
  # Incidents on the real cluster, the fix path (README.md): the OpenAPI document of oncall-tools' GET /ops/changes and
  # POST /ops/rollback, mounted read-only into the tool pack (OpenApi__Spec, toolpack.yaml). openapi/oncall-ops.json is a byte-identical
  # copy of services/oncall-tools/openapi/ops.json in carnufex/oncall-voice-copilot: copy it again when that file changes. To remove:
  # this entry and the parts listed in the README.
  - name: lots-oncall-openapi
    namespace: lots
    files:
      - oncall-ops.json=openapi/oncall-ops.json
