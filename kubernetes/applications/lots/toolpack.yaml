# The Lots tool pack (carnufex/Lots src/Lots.Mcp.Toolpack): one MCP server with the internet packs (Lots #174), all keyless public
# sources (weather, Wikipedia, exchange rates, maps, holidays, news feeds, arXiv, SMHI, Polisen, Krisinformation). The shell reaches it
# at http://lots-toolpack:8080/mcp: install the "Internet tools" plugin (Administration > Plugins) with that toolpackUrl. Egress only to
# the public hosts these packs call (networkpolicy.yaml). Image refs are bumped by hand like the shell's.
apiVersion: v1
kind: Service
metadata:
  name: lots-toolpack
  namespace: lots
spec:
  selector:
    app.kubernetes.io/name: lots-toolpack
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lots-toolpack
  namespace: lots
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: lots-toolpack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lots-toolpack
    spec:
      # Its own ServiceAccount (ops-rbac.yaml), with a token: the Kubernetes tools read the cluster with it (no Secrets), nothing else.
      # The token is a projected read-only volume, so the read-only root filesystem below needs nothing more.
      serviceAccountName: lots-toolpack
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
        # The fix path (README.md): oncall-tools' OpenAPI document (configMapGenerator lots-oncall-openapi, kustomization.yaml).
        - name: oncall-openapi
          configMap:
            name: lots-oncall-openapi
      containers:
        - name: toolpack
          image: registry.rosenvall.se/carnufex/lots-mcp-toolpack:sha-1cf2546@sha256:d51456039efc7e203dc495df051571bd902496b79e357ed47347b9f561ba4863
          ports:
            - containerPort: 8080
              name: http
          env:
            - { name: Internet__Packs__0, value: "*" }
            # news_headlines reads only these feeds (an allow-list; their hosts are in the network policy).
            - { name: Internet__Feeds__0__Name, value: svt }
            - { name: Internet__Feeds__0__Url, value: "https://www.svt.se/nyheter/rss.xml" }
            - { name: Internet__Feeds__1__Name, value: bbc }
            - { name: Internet__Feeds__1__Url, value: "https://feeds.bbci.co.uk/news/world/rss.xml" }
            - { name: HOME, value: /tmp }
            # Only the shell may call the tool pack: it refuses a call without this token (Lots #342; the shell sends it, app.yaml).
            - { name: Mcp__AuthTokenRef, value: "env:LOTS_MCP_TOKEN" }
            - name: LOTS_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lots-secrets
                  key: LOTS_MCP_TOKEN
            # The incidents demo (carnufex/Lots docs/demo.md, "The incident path"): the demo pack's synthetic fibre network in Malmö and
            # its scripted model (served on /v1; the shell's model alias "scripted", app.yaml). POST /demo/fault, the drill "Cut a cable"
            # on Incidents > Sources, cuts cable MAL-019 and sends its alert to the shell's alert source demo-network
            # (gitops/incidents-demo.yaml); POST /demo/reset restores it and resolves the alert. Nothing here touches a real system.
            # To take the demo out: these lines, gitops/incidents-demo.yaml, the network context and the scripted alias in app.yaml,
            # the two rules in networkpolicy.yaml and LOTS_DEMO_SIGNAL_SECRET in secrets.yaml.
            - { name: Demo__Enabled, value: "true" }
            - { name: Demo__Model__Fixture, value: /app/demo/model.json }
            - { name: Demo__Signals__Url, value: "http://lots:8080/signals/demo-network" }
            - name: Demo__Signals__Secret
              valueFrom:
                secretKeyRef:
                  name: lots-secrets
                  key: LOTS_DEMO_SIGNAL_SECRET
            # Incidents on the real cluster (README.md): k8s_list, k8s_describe and k8s_logs (GET only, never Secrets or ConfigMaps)
            # against the API server with the pod's ServiceAccount token. Its reach is the RBAC in ops-rbac.yaml: every namespace,
            # read only. Used by the homelab-ops context (app.yaml). To remove: this line and the parts listed in ops-rbac.yaml.
            - { name: Kubernetes__InCluster, value: "true" }
            # Incidents on the real cluster, the fix path (README.md): the OpenAPI pack turns oncall-tools' two operations into the tools
            # recent_changes (GET /ops/changes, read) and rollback_service (POST /ops/rollback, write: only demo-api, only back to its
            # configured healthy tag, and only after a person approved it in Lots). It sends the drill's bearer (LOTS_ONCALL_OPS_AUTH, the
            # whole Authorization header, from lots-secrets). Used by the homelab-ops context (app.yaml). To remove: these lines, the
            # oncall-openapi volume and mount, and the parts listed in the README.
            - { name: OpenApi__Spec, value: /etc/lots/openapi/oncall-ops.json }
            - { name: OpenApi__BaseUrl, value: "http://oncall-tools.oncall-demo.svc.cluster.local:8080" }
            - { name: OpenApi__AllowPrivateNetworks, value: "true" }
            - { name: OpenApi__Operations__0, value: recent_changes }
            - { name: OpenApi__Operations__1, value: rollback_service }
            - { name: OpenApi__AuthHeaderRef, value: "env:LOTS_ONCALL_OPS_AUTH" }
            - name: LOTS_ONCALL_OPS_AUTH
              valueFrom:
                secretKeyRef:
                  name: lots-secrets
                  key: LOTS_ONCALL_OPS_AUTH
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: oncall-openapi
              mountPath: /etc/lots/openapi
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
