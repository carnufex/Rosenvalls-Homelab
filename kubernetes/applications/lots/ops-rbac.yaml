# Incidents on the real cluster (README.md): the identity the tool pack's Kubernetes tools (k8s_list, k8s_describe, k8s_logs;
# Kubernetes__InCluster in toolpack.yaml) use, and everything it may do. The tool pack has no namespace list of its own, so this RBAC
# is the whole reach of those tools: read only, in every namespace, of exactly the kinds the tools know (pods and their logs, events,
# services, PVCs, nodes, namespaces, deployments, statefulsets, daemonsets, jobs, cronjobs, ingresses). No Secrets, no ConfigMaps, no
# write verbs, no exec. Every namespace since 2026-11-20: Alertmanager sends Lots every alert, and an investigation that can only read
# oncall-demo finds nothing about the others. What the tools return (status, events and log lines; never a spec or its env values) goes to the
# model of the context homelab-ops (the alias default: hosted at Berget AI first, the GPU PC last) and is kept with the run; credentials in
# it are masked first (gitops/guards.yaml). To go back to one namespace: a Role and RoleBinding in it in place of the two
# cluster-wide objects below.
# To remove: this file (and its line in kustomization.yaml), Kubernetes__InCluster and serviceAccountName in toolpack.yaml (back to
# lots-runtime), and the kube-apiserver rule in networkpolicy.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lots-toolpack
  namespace: lots
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
# Pulls from the registry like lots-runtime.
imagePullSecrets:
  - name: lots-registry
# The tool pack reads this token (a projected, read-only volume) to call the API server; the shell keeps lots-runtime, without one.
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lots-toolpack-read
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, services, persistentvolumeclaims, nodes, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lots-toolpack-read
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
subjects:
  - kind: ServiceAccount
    name: lots-toolpack
    namespace: lots
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lots-toolpack-read
