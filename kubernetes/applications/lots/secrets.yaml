# Bitwarden entries: LOTS_DB_PASSWORD (feeds both the CNPG bootstrap secret and the connection string) and
# CMDB_AGENT_TOKEN (the cmdb-agents service account's app password, referenced by the cmdb profile's passwordEnv) and
# LOTS_VOICE_KEY (the voice service's API key on the GPU PC, Speech__ApiKeyEnv) and LOTS_DOCUMENTS_KEY (the document service's API
# key on the same PC, Documents__ApiKeyEnv and the rerank endpoint) and LOTS_MODEL_KEY (the model server's API key on the same PC,
# Model__ApiKeyEnv) and the homelab Slack incoming webhook (the same entry
# Alertmanager uses) for Lots' admin notices (Lots #201) and LOTS_BWS_ACCESS_TOKEN: the access token of the machine account lots-prod
# in Lots' own Bitwarden Secrets Manager organisation (EU), which reads only its project "Lots" (Lots #194, ADR 0032). Lots'
# bitwarden-secrets plugin reads it as env:BWS_ACCESS_TOKEN; keys Lots' plugins use (the berget plugin's BERGET_API_KEY) live in that
# project and are read by Lots itself as bitwarden:<name>, not through this secret. LOTS_MCP_TOKEN is the bearer token the tool pack
# requires (Mcp__AuthTokenRef) and the shell sends to it (Mcp__ToolServerAuth, app.yaml); the tool pack reads only that key of this secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lots-postgresql-bootstrap
  namespace: lots
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: lots-postgresql-bootstrap
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/basic-auth
      data:
        username: "lots"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: ed67809a-07fe-45d7-954a-b4de015d1f15 # LOTS_DB_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lots-secrets
  namespace: lots
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: lots-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        ConnectionStrings__Lots: "Host=lots-postgresql-rw;Database=lots;Username=lots;Password={{ .password }}"
        CMDB_AGENT_TOKEN: "{{ .cmdbAgentToken }}"
        LOTS_VOICE_KEY: "{{ .voiceKey }}"
        LOTS_DOCUMENTS_KEY: "{{ .documentsKey }}"
        LOTS_MODEL_KEY: "{{ .modelKey }}"
        Notifications__Webhooks__0__Url: "{{ .slackWebhook }}"
        BWS_ACCESS_TOKEN: "{{ .lotsBwsToken }}"
        LOTS_MCP_TOKEN: "{{ .mcpToken }}"
  data:
    - secretKey: password
      remoteRef:
        key: ed67809a-07fe-45d7-954a-b4de015d1f15 # LOTS_DB_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: cmdbAgentToken
      remoteRef:
        key: ec5e73b8-c573-42de-bcdf-b4d400ee7858 # CMDB_AGENT_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: voiceKey
      remoteRef:
        key: 055feab9-6e85-4ae2-a401-b4e00078d1a6 # LOTS_VOICE_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: documentsKey
      remoteRef:
        key: 5b953b5a-6a87-404e-a059-b4e000a52841 # LOTS_DOCUMENTS_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: modelKey
      remoteRef:
        key: 6cc5c3ed-040c-46a0-8f41-b4f400ca2650 # LOTS_MODEL_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: slackWebhook
      remoteRef:
        key: abeef982-e4eb-4968-9d95-b472015a50c1 # the homelab Slack incoming webhook (alertmanager-slack)
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: lotsBwsToken
      remoteRef:
        key: b3d1e384-608e-424e-b184-b4e1007fb932 # LOTS_BWS_ACCESS_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: mcpToken
      remoteRef:
        key: 8fc44671-08f2-4d33-a028-b4e800555900 # LOTS_MCP_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# The certificate that encrypts Lots' Data Protection key ring (Lots ADR 0035, #200), as a TLS Secret mounted read-only into the shell.
# Bitwarden: LOTS_DATA_PROTECTION_CERT and LOTS_DATA_PROTECTION_KEY (PEM, base64). Losing the key loses every secret stored in Lots;
# rotate by adding a new certificate first and keeping this one as a previous certificate.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lots-data-protection
  namespace: lots
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: lots-data-protection
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: 47bcde12-2198-423a-8b77-b4e00163933d # LOTS_DATA_PROTECTION_CERT
        decodingStrategy: Base64
    - secretKey: tls.key
      remoteRef:
        key: 0ea07f64-4b8b-4c57-9270-b4e00163937d # LOTS_DATA_PROTECTION_KEY
        decodingStrategy: Base64
