# Bitwarden entries: LOTS_DB_PASSWORD (feeds both the CNPG bootstrap secret and the connection string) and
# CMDB_AGENT_TOKEN (the cmdb-agents service account's app password, referenced by the cmdb profile's passwordEnv).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lots-postgresql-bootstrap
  namespace: lots
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: lots-postgresql-bootstrap
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/basic-auth
      data:
        username: "lots"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: ed67809a-07fe-45d7-954a-b4de015d1f15 # LOTS_DB_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lots-secrets
  namespace: lots
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: lots-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        ConnectionStrings__Lots: "Host=lots-postgresql-rw;Database=lots;Username=lots;Password={{ .password }}"
        CMDB_AGENT_TOKEN: "{{ .cmdbAgentToken }}"
  data:
    - secretKey: password
      remoteRef:
        key: ed67809a-07fe-45d7-954a-b4de015d1f15 # LOTS_DB_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: cmdbAgentToken
      remoteRef:
        key: ec5e73b8-c573-42de-bcdf-b4d400ee7858 # CMDB_AGENT_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
