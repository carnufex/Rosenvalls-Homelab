# Network policy for the lots namespace. Default deny in both directions with DNS open, then one allow policy per
# workload (Cilium policies are additive). CiliumNetworkPolicy because traffic from the Cilium Gateway carries the
# reserved "ingress" identity and public services are reached by name (toFQDNs). Same shape as the cmdb namespace.
# Debug drops: hubble observe -n lots --verdict DROPPED
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: lots
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lots
  namespace: lots
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: lots
  ingress:
    # Only the Cilium Gateway (HTTPRoute lots on gateway/external).
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Prometheus scrapes /metrics on the metrics port (servicemonitor.yaml).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # The incidents demo: the tool pack's demo pack posts its alert to POST /signals/demo-network (toolpack.yaml).
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: lots-toolpack
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Incidents on the real cluster (README.md): Alertmanager posts alerts to POST /signals/homelab-alertmanager (receiver lots in
    # infrastructure/monitoring/prometheus-stack/values.yaml). To remove: this rule and the oncall-tools egress rule below.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: alertmanager
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Updates (README.md): update-center posts updates that need a decision to POST /signals/update-center.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: update-center
            app.kubernetes.io/name: update-center
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # Traces over OTLP to the collector in monitoring (OTEL_EXPORTER_OTLP_ENDPOINT in app.yaml).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: opentelemetry-collector
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: lots-postgresql
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # OIDC metadata and signing keys, and the service account token for the cmdb profile (client_credentials),
    # and the CMDB's own MCP endpoint, all by public name. Berget AI: the hosted model of the berget plugin (Lots #172),
    # used only by contexts or runs that pick its alias; cleared for internal data at most. Bitwarden Secrets Manager (EU): the
    # bitwarden-secrets plugin's store (Lots #194), read with a Lots-only machine account. Slack: admin notices (Lots #201).
    - toFQDNs:
        - matchName: hooks.slack.com
        - matchName: authentik.rosenvall.se
        - matchName: cmdb.rosenvall.se
        - matchName: api.berget.ai
        - matchName: identity.bitwarden.eu
        - matchName: api.bitwarden.eu
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # The tool packs (toolpack.yaml, toolpack-updates.yaml): MCP over HTTP inside the namespace.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: lots-toolpack
        - matchLabels:
            app.kubernetes.io/name: lots-toolpack-updates
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Incidents on the real cluster (README.md): the drill "Break demo-api" calls POST /drill/break on oncall-tools in oncall-demo
    # (alert source homelab-alertmanager, gitops/incidents-homelab.yaml).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: oncall-demo
            app.kubernetes.io/name: oncall-tools
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The GPU PC on the LAN, by address: the model server (llama-server), the voice and the document service. 11434 (Ollama) until
    # the model server has run for a while, to go back by changing Model__BaseUrl alone.
    - toCIDR:
        - 192.168.1.215/32
      toPorts:
        - ports:
            - port: "11434"
              protocol: TCP
            - port: "8720"
              protocol: TCP
            - port: "8700"
              protocol: TCP
            - port: "8710"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lots-postgresql
  namespace: lots
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: lots-postgresql
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: lots
        - matchLabels:
            app.kubernetes.io/name: db-dump
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # The CNPG operator: instance status endpoint (8000) and management connections (5432).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "5432"
              protocol: TCP
  egress:
    # The instance manager watches the Cluster resource and reports status through the API server.
    - toEntities:
        - kube-apiserver
---
# The tool pack: only the shell may call it, and it may only reach the public APIs of its internet packs (Lots #174) and the news
# feeds configured in toolpack.yaml. Keep this list in step with Internet:Feeds.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lots-toolpack
  namespace: lots
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: lots-toolpack
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: lots
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # The incidents demo: the demo pack's alert to the shell (Demo__Signals__Url, toolpack.yaml).
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: lots
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Incidents on the real cluster, the fix path (README.md): the OpenAPI pack calls oncall-tools' GET /ops/changes and
    # POST /ops/rollback in oncall-demo (OpenApi__BaseUrl, toolpack.yaml). To remove: this rule and the parts listed in the README.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: oncall-demo
            app.kubernetes.io/name: oncall-tools
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Incidents on the real cluster (README.md): the Kubernetes tools call the API server (Kubernetes__InCluster, toolpack.yaml).
    # What they may read there is ops-rbac.yaml: oncall-demo, read only. To remove: this rule and the parts listed in ops-rbac.yaml.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toFQDNs:
        - matchPattern: "*.wikipedia.org"
        - matchName: api.open-meteo.com
        - matchName: geocoding-api.open-meteo.com
        - matchName: api.frankfurter.dev
        - matchName: nominatim.openstreetmap.org
        - matchName: date.nager.at
        - matchName: export.arxiv.org
        - matchName: api.krisinformation.se
        - matchName: polisen.se
        - matchName: www.polisen.se
        - matchName: opendata-download-warnings.smhi.se
        - matchName: www.svt.se
        - matchName: feeds.bbci.co.uk
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# The updates tool pack (toolpack-updates.yaml): only the shell may call it, and it reaches only update-center's API.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lots-toolpack-updates
  namespace: lots
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: lots-toolpack-updates
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: lots
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: update-center
            app.kubernetes.io/name: update-center
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: db-dump
  namespace: lots
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: db-dump
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: lots-postgresql
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
