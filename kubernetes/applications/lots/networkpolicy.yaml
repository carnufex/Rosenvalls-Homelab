# Network policy for the lots namespace. Default deny in both directions with DNS open, then one allow policy per
# workload (Cilium policies are additive). CiliumNetworkPolicy because traffic from the Cilium Gateway carries the
# reserved "ingress" identity and public services are reached by name (toFQDNs). Same shape as the cmdb namespace.
# Debug drops: hubble observe -n lots --verdict DROPPED
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: lots
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lots
  namespace: lots
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: lots
  ingress:
    # Only the Cilium Gateway (HTTPRoute lots on gateway/external).
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: lots-postgresql
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # OIDC metadata and signing keys, and the service account token for the cmdb profile (client_credentials),
    # and the CMDB's own MCP endpoint, all by public name. Berget AI: the hosted model of the berget plugin (Lots #172),
    # used only by contexts or runs that pick its alias; cleared for internal data at most. Bitwarden Secrets Manager (EU): the
    # bitwarden-secrets plugin's store (Lots #194), read with a Lots-only machine account. Slack: admin notices (Lots #201).
    - toFQDNs:
        - matchName: hooks.slack.com
        - matchName: authentik.rosenvall.se
        - matchName: cmdb.rosenvall.se
        - matchName: api.berget.ai
        - matchName: identity.bitwarden.eu
        - matchName: api.bitwarden.eu
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # The tool pack (toolpack.yaml): MCP over HTTP inside the namespace.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: lots-toolpack
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The GPU PC on the LAN: Ollama (Service ollama/ollama, no selector), the voice and the document service (by address).
    - toCIDR:
        - 192.168.1.215/32
      toPorts:
        - ports:
            - port: "11434"
              protocol: TCP
            - port: "8700"
              protocol: TCP
            - port: "8710"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lots-postgresql
  namespace: lots
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: lots-postgresql
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: lots
        - matchLabels:
            app.kubernetes.io/name: db-dump
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # The CNPG operator: instance status endpoint (8000) and management connections (5432).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "5432"
              protocol: TCP
  egress:
    # The instance manager watches the Cluster resource and reports status through the API server.
    - toEntities:
        - kube-apiserver
---
# The tool pack: only the shell may call it, and it may only reach the public APIs of its internet packs (Lots #174) and the news
# feeds configured in toolpack.yaml. Keep this list in step with Internet:Feeds.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lots-toolpack
  namespace: lots
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: lots-toolpack
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: lots
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toFQDNs:
        - matchPattern: "*.wikipedia.org"
        - matchName: api.open-meteo.com
        - matchName: geocoding-api.open-meteo.com
        - matchName: api.frankfurter.dev
        - matchName: nominatim.openstreetmap.org
        - matchName: date.nager.at
        - matchName: export.arxiv.org
        - matchName: api.krisinformation.se
        - matchName: polisen.se
        - matchName: www.polisen.se
        - matchName: opendata-download-warnings.smhi.se
        - matchName: www.svt.se
        - matchName: feeds.bbci.co.uk
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: db-dump
  namespace: lots
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: db-dump
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: lots-postgresql
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
