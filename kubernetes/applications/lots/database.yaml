# PostgreSQL for Lots (runs, trace, approvals, audit log) on CloudNativePG. Single instance: the
# volumes are replicated by Longhorn and the audit log is in the nightly dump (db-dump.yaml).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: lots-postgresql
  namespace: lots
spec:
  instances: 1
  inheritedMetadata:
    labels:
      # Longhorn reads recurring-job labels from the PVC: the "cnpg" group only
      # trims. These databases are backed up with logical dumps instead.
      recurring-job.longhorn.io/source: enabled
      recurring-job-group.longhorn.io/cnpg: enabled

  # Debian 13 "standard" image (pgvector included); the bare :17 tag is bullseye and frozen. Plan: docs/operations/cnpg-postgres-18-plan.md
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie

  # The app's connection pool never closes its sessions: the default smart shutdown waited the full
  # 180 s on every restart (phase 1: ~3 min down). After 15 s CNPG switches to a fast, still clean, shutdown.
  smartShutdownTimeout: 15

  bootstrap:
    initdb:
      database: lots
      owner: lots
      secret:
        name: lots-postgresql-bootstrap

  storage:
    size: 2Gi
    storageClass: longhorn

  walStorage:
    size: 1Gi
    storageClass: longhorn

  resources:
    requests:
      memory: 192Mi
      cpu: 50m
    limits:
      memory: 512Mi
      cpu: 500m

  postgresql:
    parameters:
      max_connections: "50"
      shared_buffers: "64MB"
---
# The lots database itself, declared so the operator installs pgvector: it is not a trusted extension, so the lots owner cannot
# create it, and without it knowledge search scans every vector instead of using HNSW indexes. The database already exists (initdb
# above); retain means deleting this resource never drops it.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: lots
  namespace: lots
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  cluster:
    name: lots-postgresql
  name: lots
  owner: lots
  databaseReclaimPolicy: retain
  extensions:
    - name: vector
      ensure: present
