# Prometheus for Lots: /metrics on the metrics port (Metrics__Port in app.yaml; the network policy admits Prometheus only), and the
# alert rules of the Lots chart's alerts.yaml (charts/lots/templates/alerts.yaml in carnufex/Lots) with its default thresholds.
# The Grafana dashboard is grafana/lots-dashboard.json, a copy of the Lots repo's deploy/grafana/lots-dashboard.json.
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lots
  namespace: lots
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: lots
  # OpenMetrics, so histogram buckets keep their exemplars: a slow bucket links to a trace in Tempo.
  scrapeProtocols: [OpenMetricsText1.0.0, PrometheusText0.0.4]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: lots
  namespace: lots
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: lots
      rules:
        - alert: LotsDown
          expr: absent(up{namespace="lots", service="lots"} == 1)
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: No Lots shell is answering scrapes.
        - alert: LotsDependencyDown
          expr: max by (name, kind) (lots_dependency_up) == 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Lots dependency {{ $labels.name }} ({{ $labels.kind }}) is down."
        - alert: LotsDatabaseDown
          expr: max(lots_dependency_up{kind="postgres"}) == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: Lots cannot reach its database.
        - alert: LotsRunsFailing
          expr: sum(rate(lots_runs_finished_total{status="Failed"}[15m])) / clamp_min(sum(rate(lots_runs_finished_total[15m])), 1e-9) > 0.2
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: More than 20 % of Lots runs fail.
        - alert: LotsStuckRuns
          expr: max(lots_runs_stuck) > 0
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: Runs are marked running but no worker holds their lease.
        - alert: LotsModelFailingOver
          expr: sum by (endpoint, model) (increase(lots_model_failovers_total[30m])) > 3
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Model {{ $labels.model }} on {{ $labels.endpoint }} keeps failing over: calls wait on it before another model answers."
        - alert: LotsModelSlow
          expr: histogram_quantile(0.95, sum by (le) (rate(lots_model_duration_seconds_bucket[10m]))) > 30
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: Lots model calls are slow (p95 over 30 s).
        # Incidents (README.md, "Incidents on the real cluster"), from the chart's alerts.yaml. LotsSignalsSilent is left out: it needs
        # a heartbeat (Alertmanager's Watchdog routed to the source), which the receiver lots does not get, so it would fire whenever
        # oncall-demo has been quiet for ten minutes.
        - alert: LotsSignalsRefused
          expr: sum by (source) (increase(lots_incidents_signals_total{outcome=~"refused|limited"}[10m])) > 0
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Signals to the alert source {{ $labels.source }} have been refused or limited for ten minutes (wrong secret, too large, unreadable, or over gate.requestsPerMinute): alerts are not reaching Lots, or late. The shell log says why."
        - alert: LotsInvestigationsFailing
          expr: sum(increase(lots_incidents_investigations_total{result="failed"}[15m])) > 0 unless sum(increase(lots_incidents_investigations_total{result=~"finding|inconclusive|cancelled"}[15m])) > 0
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "Incident investigations have been failing for 15 minutes: their runs end as failed (the model of the investigation context is down or refusing). The incident's run says why."
        - alert: LotsIncidentsNotInvestigated
          expr: max(lots_incidents_awaiting_run) > 0
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Ready incidents have waited for an investigation run for ten minutes: the investigation worker is stuck or cannot start them (the shell log says why)."
        # The nightly dump (db-dump.yaml). KubeJobFailed also fires on a failed run; this one says how old the newest good dump is.
        - alert: LotsDatabaseDumpStale
          expr: time() - max(kube_cronjob_status_last_successful_time{namespace="lots", cronjob="lots-db-dump"}) > 26 * 3600
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "The Lots database has had no successful dump for over 26 hours (db-dump.yaml runs nightly at 01:25). See the last Job's log: kubectl -n lots logs job/<lots-db-dump-...>. Until it succeeds there is no fresh restorable backup."
        # Incidents on the real cluster, the fix path (README.md): a proposed rollback nobody has answered for an hour (the chart's
        # alerts.yaml, default approvalAgeSeconds 3600; homelab-ops lets it lapse after four hours). To remove: this rule.
        - alert: LotsApprovalBacklog
          expr: max(lots_approvals_oldest_pending_age_seconds) > 3600
          for: 5m
          labels: { severity: info }
          annotations:
            summary: An approval has been waiting longer than expected.
