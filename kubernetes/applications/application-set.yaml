apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: applications
  namespace: argocd
spec:
  goTemplate: true
  generators:
  - git:
      repoURL: https://github.com/carnufex/Rosenvalls-Homelab.git
      revision: HEAD
      directories:
      - path: kubernetes/applications/*
  template:
    metadata:
      name: '{{.path.basename}}'
      annotations:
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: applications
      source:
        repoURL: https://github.com/carnufex/Rosenvalls-Homelab.git
        targetRevision: HEAD
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
      ignoreDifferences:
        - group: apps
          kind: StatefulSet
          jqPathExpressions:
            - .spec.volumeClaimTemplates[].apiVersion
            - .spec.volumeClaimTemplates[].kind
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jsonPointers:
            - /status
          jqPathExpressions:
            - .spec.parentRefs[].group
            - .spec.parentRefs[].kind
            - .spec.rules[].backendRefs[].group
            - .spec.rules[].backendRefs[].kind
            - .spec.rules[].backendRefs[].weight
        - group: postgresql.cnpg.io
          kind: Cluster
          jsonPointers:
            - /status
          jqPathExpressions:
            - .spec.monitoring
            - .spec.bootstrap.initdb.encoding
            - .spec.bootstrap.initdb.localeCType
            - .spec.bootstrap.initdb.localeCollate
            - .spec.postgresGID
            - .spec.postgresUID
