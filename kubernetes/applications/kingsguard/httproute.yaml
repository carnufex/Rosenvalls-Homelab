# kingsguard.rosenvall.se through the external gateway (the Cloudflare tunnel wildcard-routes
# *.rosenvall.se there). WebSocket upgrades on /ws pass through the Gateway API unchanged.
# The game has no accounts: anyone with the URL and a room code can play.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kingsguard
  namespace: kingsguard
spec:
  hostnames:
    - kingsguard.rosenvall.se
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
      namespace: gateway
      sectionName: https
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: kingsguard
          port: 8080
