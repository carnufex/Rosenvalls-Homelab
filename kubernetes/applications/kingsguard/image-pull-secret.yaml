# Pull credentials for ghcr.io/carnufex/kingsguard (published by the repo's CI on every push to main, carnufex/kingsguard#247)
# and registry.rosenvall.se/carnufex/kingsguard (older, hand-built images; kept for rollback).
# Bitwarden `GHCR_PAT` (read:packages) and `registry-password`, as in the lots namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kingsguard-image-pull
  namespace: kingsguard
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: kingsguard-image-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "username": "carnufex",
                "password": "{{ .GHCR_PAT }}",
                "auth": "{{ printf "carnufex:%s" .GHCR_PAT | b64enc }}"
              },
              "registry.rosenvall.se": {
                "username": "homelab",
                "password": "{{ .REGISTRY_PASSWORD }}",
                "auth": "{{ printf "homelab:%s" .REGISTRY_PASSWORD | b64enc }}"
              }
            }
          }
  data:
    - secretKey: GHCR_PAT
      remoteRef:
        key: 09b625aa-6a80-46bb-bf35-b41901624bb3
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: REGISTRY_PASSWORD
      remoteRef:
        key: 227aad11-f6ec-4696-ae94-b47c00a93cd1
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
