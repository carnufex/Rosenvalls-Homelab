apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ragflow
  namespace: ragflow
spec:
  parentRefs:
    - name: internal
      namespace: gateway
  hostnames:
    - ragflow.rosenvall.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ragflow
          port: 80
