apiVersion: batch/v1
kind: CronJob
metadata:
  name: plex-self-heal
  namespace: media
  labels:
    app.kubernetes.io/name: plex-self-heal
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: plex-self-heal
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: plex-self-heal
        spec:
          serviceAccountName: plex-self-heal
          restartPolicy: Never
          containers:
            - name: checker
              image: alpine/k8s:1.35.8@sha256:aaeed1de1399aa816535d376c7d5c9bea905892301649ffaee0905397c7d4956
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
                - |
                  namespace="${POD_NAMESPACE:-media}"

                  if ! kubectl -n "$namespace" wait --for=condition=Ready pod -l app.kubernetes.io/name=plex --timeout=30s; then
                    echo "Plex pod is not Ready; Kubernetes probes and deployment alerts own this state."
                    exit 0
                  fi

                  pod="$(kubectl -n "$namespace" get pod -l app.kubernetes.io/name=plex -o jsonpath='{.items[0].metadata.name}')"

                  if ! kubectl -n "$namespace" exec "$pod" -- sh -c 'curl -fsS --max-time 10 http://127.0.0.1:32400/identity | grep -q MediaContainer'; then
                    echo "Plex identity endpoint failed inside the pod; deleting pod for clean remount/restart."
                    kubectl -n "$namespace" delete pod "$pod" --wait=false
                    exit 0
                  fi

                  if ! kubectl -n "$namespace" exec "$pod" -- sh -c 'dir="/config/Library/Application Support/Plex Media Server/Codecs"; [ ! -d "$dir" ] || ! find "$dir" -type f -name EasyAudioEncoder ! -perm -111 | grep -q .'; then
                    echo "Plex EasyAudioEncoder cache contains non-executable binaries; deleting pod so initContainer repairs cache."
                    kubectl -n "$namespace" delete pod "$pod" --wait=false
                    exit 0
                  fi

                  echo "Plex semantic health checks passed."
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
