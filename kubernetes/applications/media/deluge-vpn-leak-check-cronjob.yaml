apiVersion: batch/v1
kind: CronJob
metadata:
  name: deluge-vpn-leak-check
  namespace: media
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: deluge-vpn-leak-check
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              image: alpine/k8s:1.37.0@sha256:b421c2e9419edb98db39b6ab641669f4db7bb2acf354f22450c6b7e7176d1ff4
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/check.sh"]
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: slack
                  mountPath: /etc/slack
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 192Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: script
              configMap:
                name: deluge-vpn-leak-check
                defaultMode: 0555
            - name: slack
              secret:
                secretName: deluge-vpn-leak-check-slack
