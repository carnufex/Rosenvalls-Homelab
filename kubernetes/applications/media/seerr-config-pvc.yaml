apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: overseerr-config
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    homelab.rosenvall.se/rename-note: "PVC name is kept to preserve migrated Overseerr data for Seerr."
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/default: enabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn-critical
