apiVersion: apps/v1
kind: Deployment
metadata:
  name: deluge-vpn
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: deluge-vpn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deluge-vpn
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: homelab.rosenvall.se/proxmox-host
                    operator: In
                    values:
                      - host1
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: prepare-wireguard-config-dir
          image: lscr.io/linuxserver/wireguard:1.0.20260223-r0-ls128@sha256:b677c3f46d524921c8a7c91873479eb7bab190d098fddbbd887ce333ec078c90
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /config/wg_confs /config/templates /config/coredns
              rm -f /config/wg0.conf
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: wireguard
          image: lscr.io/linuxserver/wireguard:1.0.20260223-r0-ls128@sha256:b677c3f46d524921c8a7c91873479eb7bab190d098fddbbd887ce333ec078c90
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - NET_ADMIN
                - SYS_MODULE
          envFrom:
            - configMapRef:
                name: media-runtime
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:
            exec:
              command:
                - /bin/sh
                - /health/check-wg.sh
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - /health/check-wg.sh
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: config
              mountPath: /config
            - name: wireguard-config
              mountPath: /config/wg_confs/wg0.conf
              subPath: wg0.conf
              readOnly: true
            - name: health
              mountPath: /health
        - name: deluge
          image: lscr.io/linuxserver/deluge:2.2.0-ls385@sha256:1dbf9663387f85bb5805fcb1418a246f877e01374bb2a6cd9e632c72fb2e1ebc
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: media-runtime
          ports:
            - containerPort: 8112
              name: web
            - containerPort: 58846
              name: daemon
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: web
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: web
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: web
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
          volumeMounts:
            - name: config
              mountPath: /config
            - name: library
              mountPath: /lagring
            - name: health
              mountPath: /health
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: deluge-config
        - name: library
          persistentVolumeClaim:
            claimName: media-library
        - name: health
          configMap:
            name: deluge-health
            defaultMode: 0755
        - name: wireguard-config
          secret:
            secretName: deluge-wireguard-config
            defaultMode: 0600
