apiVersion: apps/v1
kind: Deployment
metadata:
  name: deluge-vpn
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: deluge-vpn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deluge-vpn
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: homelab.rosenvall.se/proxmox-host
                    operator: In
                    values:
                      - host1
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: prepare-wireguard-config-dir
          image: lscr.io/linuxserver/wireguard:1.0.20260223@sha256:ac43e1226878d2611315172d6ea357a95cb326ee73124b91108118efc8666889
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /config/wg_confs /config/templates /config/coredns
              rm -f /config/wg0.conf
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: wireguard
          image: lscr.io/linuxserver/wireguard:1.0.20260223@sha256:ac43e1226878d2611315172d6ea357a95cb326ee73124b91108118efc8666889
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - NET_ADMIN
                - SYS_MODULE
          envFrom:
            - configMapRef:
                name: media-runtime
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:
            exec:
              command:
                - /bin/sh
                - /health/check-wg.sh
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - /health/check-wg.sh
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: config
              mountPath: /config
            - name: wireguard-config
              mountPath: /config/wg_confs/wg0.conf
              subPath: wg0.conf
              readOnly: true
            - name: health
              mountPath: /health
        - name: deluge
          image: lscr.io/linuxserver/deluge:2.2.0@sha256:33a939576f7ecfc1227db1a0cb2afce030ce983e620ec9d93c956e3700e21fe9
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: media-runtime
          ports:
            - containerPort: 8112
              name: web
            - containerPort: 58846
              name: daemon
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: web
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: web
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: web
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
          volumeMounts:
            - name: config
              mountPath: /config
            - name: library
              mountPath: /lagring
            - name: health
              mountPath: /health
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: deluge-config
        - name: library
          persistentVolumeClaim:
            claimName: media-library
        - name: health
          configMap:
            name: deluge-health
            defaultMode: 0755
        - name: wireguard-config
          secret:
            secretName: deluge-wireguard-config
            defaultMode: 0600
