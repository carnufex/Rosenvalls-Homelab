apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deluge-vpn-egress-lockdown
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: deluge-vpn
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # linuxserver/wireguard applies the DNS servers from wg0.conf to the shared pod namespace.
    - toCIDRSet:
        - cidr: 98.128.186.86/32
        - cidr: 155.4.89.136/32
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # WireGuard handshake/data to any provider endpoint, but ONLY the WireGuard UDP port.
    # This deliberately does not pin endpoint CIDRs: the provider rotates endpoints (and its own
    # DNS, set via dns= in wg0.conf, hands back ranges cluster DNS never sees, so toFQDNs can't keep
    # up). Pinning IPs added no leak protection — the killswitch rests on three independent layers:
    #   1. Routing: AllowedIPs=0.0.0.0/0 makes wg0 the default route; only LAN/cluster CIDRs bypass
    #      it (PostUp), so if the tunnel is down public traffic has no route and is dropped.
    #   2. Crypto: WireGuard only forms a tunnel with the keyed peer; reaching a wrong host does
    #      nothing, so allowing 48575 to world cannot move any data.
    #   3. This policy: every egress port except DNS and 48575/UDP is denied, so torrent peer
    #      traffic (arbitrary ports) can never leave the pod regardless.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "48575"
              protocol: UDP
