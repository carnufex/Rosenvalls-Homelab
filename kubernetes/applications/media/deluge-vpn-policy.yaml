apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deluge-vpn-egress-lockdown
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: deluge-vpn
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Replace this hostname and port with the real WireGuard endpoint from /config/wg0.conf.
    - toFQDNs:
        - matchName: wireguard.5july.net
      toPorts:
        - ports:
            - port: "48575"
              protocol: UDP
