apiVersion: v1
kind: ConfigMap
metadata:
  name: deluge-health
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  check-wg.sh: |
    #!/bin/sh
    set -eu
    test -f /config/wg_confs/wg0.conf
    ip link show wg0 >/dev/null 2>&1
    ip -4 rule show | grep -Eq 'lookup 51820'
    ip -4 route show table 51820 | grep -Eq '^default .* dev wg0([[:space:]]|$)'
