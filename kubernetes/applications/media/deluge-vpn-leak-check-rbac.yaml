apiVersion: v1
kind: ServiceAccount
metadata:
  name: deluge-vpn-leak-check
  namespace: media
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deluge-vpn-leak-check
  namespace: media
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deluge-vpn-leak-check
  namespace: media
subjects:
  - kind: ServiceAccount
    name: deluge-vpn-leak-check
    namespace: media
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deluge-vpn-leak-check
