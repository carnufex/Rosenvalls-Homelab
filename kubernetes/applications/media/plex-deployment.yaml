apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: plex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plex
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: homelab.rosenvall.se/lan-special
                    operator: In
                    values:
                      - "true"
      initContainers:
        - name: plex-codec-cache-repair
          image: plexinc/pms-docker:1.43.0.10492-121068a07@sha256:1131c4cd21fa22f8196f749f1dbb69af306776c3c83c7f5b061e51dc49bcff7f
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              codecs_dir="/config/Library/Application Support/Plex Media Server/Codecs"
              [ -d "$codecs_dir" ] || exit 0

              find "$codecs_dir" -type f -name EasyAudioEncoder | while IFS= read -r binary; do
                [ -x "$binary" ] && continue
                chmod 755 "$binary" || rm -rf "$(dirname "$(dirname "$binary")")"
              done
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: plex
          image: plexinc/pms-docker:1.43.0.10492-121068a07@sha256:1131c4cd21fa22f8196f749f1dbb69af306776c3c83c7f5b061e51dc49bcff7f
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: media-runtime
                  key: TZ
            - name: HOSTNAME
              value: k8s-plex
            - name: ADVERTISE_IP
              value: https://plex.rosenvall.local:443,http://192.168.1.211:32400
            - name: PLEX_UID
              valueFrom:
                configMapKeyRef:
                  name: media-runtime
                  key: PUID
            - name: PLEX_GID
              valueFrom:
                configMapKeyRef:
                  name: media-runtime
                  key: PGID
          ports:
            - containerPort: 32400
              name: web
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2048Mi
          startupProbe:
            httpGet:
              path: /identity
              port: web
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /identity
              port: web
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /identity
              port: web
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /config
            - name: library
              mountPath: /tv
              subPath: tv
            - name: library
              mountPath: /movies
              subPath: movies
            - name: library
              mountPath: /familjefilmer
              subPath: familjefilmer
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: plex-config
        - name: library
          persistentVolumeClaim:
            claimName: media-library
