apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: plex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plex
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: homelab.rosenvall.se/lan-special
                    operator: In
                    values:
                      - "true"
      containers:
        - name: plex
          image: plexinc/pms-docker:1.43.0.10492-121068a07@sha256:1131c4cd21fa22f8196f749f1dbb69af306776c3c83c7f5b061e51dc49bcff7f
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: media-runtime
                  key: TZ
            - name: HOSTNAME
              value: k8s-plex
            - name: ADVERTISE_IP
              value: https://plex.rosenvall.local:443,http://192.168.1.211:32400
            - name: PLEX_UID
              valueFrom:
                configMapKeyRef:
                  name: media-runtime
                  key: PUID
            - name: PLEX_GID
              valueFrom:
                configMapKeyRef:
                  name: media-runtime
                  key: PGID
          ports:
            - containerPort: 32400
              name: web
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2048Mi
          startupProbe:
            tcpSocket:
              port: web
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: web
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: web
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 2
          volumeMounts:
            - name: config
              mountPath: /config
            - name: library
              mountPath: /tv
              subPath: tv
            - name: library
              mountPath: /movies
              subPath: movies
            - name: library
              mountPath: /familjefilmer
              subPath: familjefilmer
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: plex-config
        - name: library
          persistentVolumeClaim:
            claimName: media-library
