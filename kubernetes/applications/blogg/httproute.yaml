# Public entry point. The Cloudflare tunnel wildcard-routes *.rosenvall.se to gateway/external; this does the host match.
# Added last, after the app ran Healthy from its pinned image (gitops-app-onboarding: exposure).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blogg
  namespace: blogg
spec:
  hostnames:
    - blogg.rosenvall.se
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
      namespace: gateway
      sectionName: https
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: blogg
          port: 8080
