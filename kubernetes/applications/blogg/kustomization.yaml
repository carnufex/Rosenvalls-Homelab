apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# blogg: the static blog at blogg.rosenvall.se. Source, image build and deploy script:
# https://github.com/carnufex/rosenvall-blogg. No secrets besides the registry pull credential, no storage.
resources:
  - ns.yaml
  - image-pull-secret.yaml
  - networkpolicy.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml # blogg.rosenvall.se on gateway/external (public, via the Cloudflare tunnel)
