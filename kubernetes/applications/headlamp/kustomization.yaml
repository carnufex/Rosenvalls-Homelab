apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: headlamp

resources:
  - ns.yaml
  - oidc-externalsecret.yaml
  - readonly-rbac.yaml

helmCharts:
  - name: headlamp
    repo: https://kubernetes-sigs.github.io/headlamp/
    version: 0.42.0
    releaseName: headlamp
    namespace: headlamp
    valuesFile: values.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: headlamp
    patch: |-
      - op: remove
        path: /spec/template/spec/hostUsers

