apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc
  namespace: headlamp
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: headlamp-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        OIDC_CLIENT_ID: "{{ .HEADLAMP_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .HEADLAMP_CLIENT_SECRET }}"
        OIDC_ISSUER_URL: https://authentik.rosenvall.se/application/o/headlamp/
        OIDC_SCOPES: openid,profile,email
        OIDC_CALLBACK_URL: https://headlamp.rosenvall.local/oidc-callback
        OIDC_VALIDATOR_CLIENT_ID: "{{ .HEADLAMP_CLIENT_ID }}"
        OIDC_VALIDATOR_ISSUER_URL: https://authentik.rosenvall.se/application/o/headlamp/
        OIDC_USE_ACCESS_TOKEN: "false"
        OIDC_USE_PKCE: "true"
  data:
    - secretKey: HEADLAMP_CLIENT_ID
      remoteRef:
        key: ce3ea8bf-9224-469b-9602-b45100f752ff
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: HEADLAMP_CLIENT_SECRET
      remoteRef:
        key: 3ab7688e-ffc2-4c41-8179-b45100f75332
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
