# CNCF Distribution — the self-hosted replacement for ghcr.io (GitHub Actions
# is billing-blocked; publishing is local docker build+push now).
# TLS terminates in the pod (LE cert via cert-manager); auth is htpasswd.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  # RWO volume — never run two pods against the same blob store.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:3.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 5000
            - name: debug
              containerPort: 5001
          env:
            - name: REGISTRY_HTTP_ADDR
              value: ":5000"
            - name: REGISTRY_HTTP_TLS_CERTIFICATE
              value: /certs/tls.crt
            - name: REGISTRY_HTTP_TLS_KEY
              value: /certs/tls.key
            # Debug endpoint (health + prometheus) on a separate plaintext port
            # that is NOT exposed via the Service — probes hit it directly
            # because /v2/ answers 401 once htpasswd auth is on.
            - name: REGISTRY_HTTP_DEBUG_ADDR
              value: ":5001"
            - name: REGISTRY_HTTP_DEBUG_PROMETHEUS_ENABLED
              value: "true"
            - name: REGISTRY_AUTH
              value: htpasswd
            - name: REGISTRY_AUTH_HTPASSWD_REALM
              value: registry.rosenvall.se
            - name: REGISTRY_AUTH_HTPASSWD_PATH
              value: /auth/htpasswd
            # Allows DELETE of manifests via API + makes GC meaningful.
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
            - name: REGISTRY_HTTP_SECRET
              valueFrom:
                secretKeyRef:
                  name: registry-auth
                  key: httpSecret
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
            - name: tls
              mountPath: /certs
              readOnly: true
            - name: auth
              mountPath: /auth
              readOnly: true
          readinessProbe:
            httpGet:
              path: /debug/health
              port: debug
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /debug/health
              port: debug
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
        - name: tls
          secret:
            secretName: registry-tls
        - name: auth
          secret:
            secretName: registry-auth
            items:
              - key: htpasswd
                path: htpasswd
