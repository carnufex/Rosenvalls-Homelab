# Registry auth material from Bitwarden Secrets Manager:
#   - htpasswd:   the bcrypt htpasswd line for user "homelab"
#                 (generate: docker run --rm httpd:2.4 htpasswd -Bbn homelab '<pw>')
#   - httpSecret: random string Distribution uses to sign upload-session state;
#                 reuses the registry password entry (any stable secret works).
# sync-wave before the Deployment so the secret exists when the pod mounts it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-auth
  namespace: registry
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: registry-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        htpasswd: "{{ .REGISTRY_HTPASSWD }}"
        httpSecret: "{{ .REGISTRY_PASSWORD }}"
  data:
    - secretKey: REGISTRY_HTPASSWD
      remoteRef:
        key: a44d285d-4205-4de9-a8ca-b47c00a93c97
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: REGISTRY_PASSWORD
      remoteRef:
        key: 227aad11-f6ec-4696-ae94-b47c00a93cd1
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
