apiVersion: apps/v1
kind: Deployment
metadata:
  name: bikepal-import-worker
  namespace: bikepal
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: bikepal-import-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bikepal-import-worker
    spec:
      serviceAccountName: bikepal-runtime
      nodeSelector:
        kubernetes.io/hostname: worker-02
      containers:
        - name: worker
          image: registry.rosenvall.se/carnufex/bikepal-worker@sha256:d64bbe0e7b59260b5799dff16217c6e71bc16b1fc879ee8b85566df288c2053e
          imagePullPolicy: IfNotPresent
          env:
            - name: JobRunner__WorkerName
              value: bikepal-import-worker
          envFrom:
            - configMapRef:
                name: bikepal-config
            - secretRef:
                name: bikepal-secrets
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 6Gi
          volumeMounts:
            - name: data-protection-keys
              mountPath: /var/bikepal/data-protection
            - name: road-network-files
              mountPath: /data/road-network
              readOnly: true
      volumes:
        - name: data-protection-keys
          persistentVolumeClaim:
            claimName: bikepal-data-protection
        - name: road-network-files
          persistentVolumeClaim:
            claimName: bikepal-road-network
