apiVersion: apps/v1
kind: Deployment
metadata:
  name: bikepal-frontend
  namespace: bikepal
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: bikepal-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bikepal-frontend
    spec:
      serviceAccountName: bikepal-runtime
      containers:
        - name: frontend
          image: registry.rosenvall.se/carnufex/bikepal-frontend@sha256:eb04d856b1a2d52a2e0392037597ab84231d95083203c202aeb3bbb577fd8300
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
