apiVersion: apps/v1
kind: Deployment
metadata:
  name: bikepal-frontend
  namespace: bikepal
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bikepal-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bikepal-frontend
    spec:
      serviceAccountName: bikepal-runtime
      containers:
        - name: frontend
          image: ghcr.io/carnufex/bikepal-frontend@sha256:a4de927370890576d60bf7c9694cfaf800123711573f71bf92bbec29d8e585e9
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
