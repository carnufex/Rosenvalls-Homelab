apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bikepal-postgresql-bootstrap
  namespace: bikepal
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager-bikepal
  target:
    name: bikepal-postgresql-bootstrap
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/basic-auth
      data:
        username: "bikepal"
        password: '{{ .connectionString | regexFind "Password=[^;]+" | trimPrefix "Password=" }}'
  data:
    - secretKey: connectionString
      remoteRef:
        key: 4ff39308-1a41-4521-977e-b43a0121c940
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
