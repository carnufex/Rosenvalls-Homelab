apiVersion: v1
kind: ConfigMap
metadata:
  name: bikepal-config
  namespace: bikepal
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  ASPNETCORE_ENVIRONMENT: Staging
  ASPNETCORE_URLS: http://+:8080
  DOTNET_ENVIRONMENT: Staging
  DataProtection__KeysDirectory: /var/bikepal/data-protection
  Frontend__AppBaseUrl: https://bikepal.rosenvall.se
  Frontend__AllowedOrigins__0: https://bikepal.rosenvall.se
  Strava__RedirectUri: https://bikepal.rosenvall.se/api/auth/strava/callback
  Strava__Scopes__0: read
  Strava__Scopes__1: activity:read_all
  Geocoding__BaseUrl: https://nominatim.openstreetmap.org
  Geocoding__UserAgent: BikePal/0.1 (+https://bikepal.rosenvall.se)
  Geocoding__AcceptLanguage: sv-SE,en-US,en
  Valhalla__BaseUrl: http://valhalla:8002
  PersonalMode__Enabled: "false"
  PersonalMode__UserId: 11111111-1111-1111-1111-111111111111
  PersonalMode__DisplayName: BikePal Homelab Rider
  JobRunner__PollIntervalSeconds: "3"
  JobRunner__MaxBatchSize: "5"
