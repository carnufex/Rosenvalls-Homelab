apiVersion: apps/v1
kind: Deployment
metadata:
  name: bikepal-api
  namespace: bikepal
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bikepal-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bikepal-api
    spec:
      serviceAccountName: bikepal-runtime
      containers:
        - name: api
          image: registry.rosenvall.se/carnufex/bikepal-api@sha256:99b9ffd24ca314acbf6c910bec4231f3a795c7084ff00dc069e9720f38253329
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: JobRunner__WorkerName
              value: bikepal-api
          envFrom:
            - configMapRef:
                name: bikepal-config
            - secretRef:
                name: bikepal-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data-protection-keys
              mountPath: /var/bikepal/data-protection
            - name: road-network-files
              mountPath: /data/road-network
      volumes:
        - name: data-protection-keys
          persistentVolumeClaim:
            claimName: bikepal-data-protection
        - name: road-network-files
          persistentVolumeClaim:
            claimName: bikepal-road-network
