apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bikepal
  namespace: bikepal
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  parentRefs:
    - name: external
      namespace: gateway
      sectionName: https
  hostnames:
    - bikepal.rosenvall.se
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: bikepal-api
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bikepal-frontend
          port: 8080
