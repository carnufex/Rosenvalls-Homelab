apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bikepal-postgresql
  namespace: bikepal
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/gfs: enabled
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgis:17-3.5-system-trixie

  bootstrap:
    initdb:
      database: bikepal
      owner: bikepal
      secret:
        name: bikepal-postgresql-bootstrap
      postInitTemplateSQL:
        - CREATE EXTENSION IF NOT EXISTS postgis;
        - CREATE EXTENSION IF NOT EXISTS postgis_topology;
        - CREATE EXTENSION IF NOT EXISTS fuzzystrmatch;

  storage:
    size: 30Gi
    storageClass: longhorn-critical

  walStorage:
    size: 5Gi
    storageClass: longhorn-critical

  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 1000m

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
