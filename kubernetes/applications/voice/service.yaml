# The Lots voice service (speech to text, text to speech, meetings) runs on the GPU PC next to Ollama, not in the cluster
# (the cluster has no GPU). Same shape as ollama/: a Service without selector whose endpoint is the PC on the LAN.
apiVersion: v1
kind: Service
metadata:
  name: voice
  namespace: voice
spec:
  ports:
    - port: 8700
      targetPort: 8700
      protocol: TCP
      name: http
