# Authentik SSO in front of update-center. Every button in the UI mutates Git,
# nodes or Proxmox hosts, so nothing is reachable without a session; only the
# readiness endpoint bypasses the proxy. Same oauth2-proxy pattern as
# media/seerr and oncall-demo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: update-center-oauth2-proxy
  namespace: update-center
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: update-center-oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: update-center-oauth2-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
          imagePullPolicy: IfNotPresent
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://authentik.rosenvall.se/application/o/update-center/
            - --insecure-oidc-allow-unverified-email=true
            - --email-domain=*
            - --http-address=0.0.0.0:4180
            - --redirect-url=https://updates.rosenvall.local/oauth2/callback
            - --upstream=http://update-center.update-center.svc.cluster.local:8080
            - --reverse-proxy=true
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-expire=12h
            - --set-xauthrequest=true
            - --pass-user-headers=true # X-Forwarded-Email -> job actor
            - --skip-provider-button=true
            - --flush-interval=200ms # SSE job log streaming
            - --skip-auth-route=^/api/health$
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom: { secretKeyRef: { name: update-center-oauth2-proxy, key: client-id } }
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: update-center-oauth2-proxy, key: client-secret } }
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: { secretKeyRef: { name: update-center-oauth2-proxy, key: cookie-secret } }
          ports:
            - name: http
              containerPort: 4180
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          readinessProbe: { httpGet: { path: /ping, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /ping, port: http }, initialDelaySeconds: 10, periodSeconds: 30 }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
