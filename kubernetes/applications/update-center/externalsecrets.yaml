# Runtime credentials for update-center. All values live in Bitwarden Secrets
# Manager (homelab project); nothing here is a secret.
#
#  GITHUB_TOKEN   — reuses ONCALL_GITHUB_TOKEN: fine-grained PAT, Contents r/w on
#                   this repo only (the same token the on-call copilot commits with).
#  PROXMOX_TOKEN  — root@pam!update-center, role UpdateCenter (Sys.Audit/Modify/
#                   PowerMgmt, VM.Audit/PowerMgmt): apt status + refresh, host reboot, VM start.
#  talosconfig    — dedicated client cert (os:admin, 1y) for talosctl upgrade / upgrade-k8s.
#  ssh key        — root@<proxmox host> for apt full-upgrade (authorized_keys restricted
#                   to from=192.168.1.0/24). Installed by scripts/install-proxmox-ssh-key.ps1
#                   in the update-center repo; referenced by NAME so the id can change.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: update-center-env
  namespace: update-center
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: update-center-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        GITHUB_TOKEN: "{{ .GITHUB_TOKEN }}"
        PROXMOX_TOKEN: "{{ .PROXMOX_TOKEN }}"
  data:
    - secretKey: GITHUB_TOKEN
      remoteRef: { key: 0ae50cfd-3453-4df0-a700-b4bf00d3808b, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
    - secretKey: PROXMOX_TOKEN
      remoteRef: { key: 7a0c8c57-dc1e-44ac-bd38-b4c5011c500e, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: update-center-talos
  namespace: update-center
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: update-center-talos
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        talosconfig: "{{ .TALOSCONFIG }}"
  data:
    - secretKey: TALOSCONFIG
      remoteRef: { key: 55cf7074-0626-4ee9-989e-b4c5012463ca, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: update-center-ssh
  namespace: update-center
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: update-center-ssh
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        id_ed25519: "{{ .SSH_KEY }}"
  data:
    - secretKey: SSH_KEY
      remoteRef: { key: update-center-ssh-key, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
---
# Pull credential for registry.rosenvall.se/carnufex/update-center — same dual-auth
# template and Bitwarden entries as the other apps; no new credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: update-center-registry
  namespace: update-center
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: update-center-registry
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "username": "carnufex",
                "password": "{{ .GHCR_PAT }}",
                "auth": "{{ printf "carnufex:%s" .GHCR_PAT | b64enc }}"
              },
              "registry.rosenvall.se": {
                "username": "homelab",
                "password": "{{ .REGISTRY_PASSWORD }}",
                "auth": "{{ printf "homelab:%s" .REGISTRY_PASSWORD | b64enc }}"
              }
            }
          }
  data:
    - secretKey: GHCR_PAT
      remoteRef: { key: 09b625aa-6a80-46bb-bf35-b41901624bb3, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
    - secretKey: REGISTRY_PASSWORD
      remoteRef: { key: 227aad11-f6ec-4696-ae94-b47c00a93cd1, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
---
# Authentik OAuth2 client for oauth2-proxy in front of updates.rosenvall.local.
# Same Bitwarden entries feed the Authentik blueprint (UPDATE_CENTER_CLIENT_*).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: update-center-oauth2-proxy
  namespace: update-center
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: update-center-oauth2-proxy
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        client-id: "{{ .CLIENT_ID }}"
        client-secret: "{{ .CLIENT_SECRET }}"
        cookie-secret: "{{ .COOKIE_SECRET }}"
  data:
    - secretKey: CLIENT_ID
      remoteRef: { key: 9671fe66-0d36-4244-9fb3-b4c50124627b, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
    - secretKey: CLIENT_SECRET
      remoteRef: { key: 71bfc3a2-763e-4e47-857b-b4c5012462b7, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
    - secretKey: COOKIE_SECRET
      remoteRef: { key: e8ea2259-202f-41c5-8b20-b4c5012462f1, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None }
