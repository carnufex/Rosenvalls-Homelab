apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NGM:s marknadssajt (statisk nginx). Image: registry.rosenvall.se/carnufex/ngm-marketing,
# byggd lokalt från carnufex/NextGenerationMe:marketing/, pinnad med sha-tag i
# deployment.yaml. Inga hemligheter utöver registry-pull-credentialen.
resources:
  - ns.yaml
  - image-pull-secret.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml          # ngm.rosenvall.se → nextgenerationme.com efter Cloudflare-stegen
