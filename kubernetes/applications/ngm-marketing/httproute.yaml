# NGM:s marknadssajt. Live på ngm.rosenvall.se (täcks av wildcard-tunneln/DNS:en).
# nextgenerationme.com kräver Cloudflare-åtgärder utanför repot innan hostnamnen
# kan aktiveras här (se README.md): zonen i kontot, DNS → tunneln, public hostname-
# route för zonen, samt en gateway-listener + cert för .com.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ngm-marketing
  namespace: ngm-marketing
spec:
  hostnames:
    - ngm.rosenvall.se
    # - nextgenerationme.com       # aktiveras efter Cloudflare-stegen i README.md
    # - www.nextgenerationme.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
      namespace: gateway
      sectionName: https
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: ngm-marketing
          port: 8080
