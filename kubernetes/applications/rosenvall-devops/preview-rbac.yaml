apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rosenvall-devops-preview-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rosenvall-devops-preview-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
subjects:
  - kind: ServiceAccount
    name: rosenvall-devops-runtime
    namespace: rosenvall-devops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rosenvall-devops-preview-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rosenvall-devops-runtime-credentials
  namespace: rosenvall-devops
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rosenvall-devops-runtime-credentials
  namespace: rosenvall-devops
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
subjects:
  - kind: ServiceAccount
    name: rosenvall-devops-runtime
    namespace: rosenvall-devops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rosenvall-devops-runtime-credentials
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rosenvall-devops-pipeline-token-cleanup
  namespace: rosenvall-devops-pipelines
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rosenvall-devops-pipeline-token-cleanup
  namespace: rosenvall-devops-pipelines
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
subjects:
  - kind: ServiceAccount
    name: rosenvall-devops-runtime
    namespace: rosenvall-devops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rosenvall-devops-pipeline-token-cleanup
