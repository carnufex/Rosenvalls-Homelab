apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rosenvall-devops-forgejo-internal
  namespace: rosenvall-devops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rosenvall-devops-forgejo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3000
