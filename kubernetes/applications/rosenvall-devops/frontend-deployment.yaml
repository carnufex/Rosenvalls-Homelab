apiVersion: apps/v1
kind: Deployment
metadata:
  name: rosenvall-devops-frontend
  namespace: rosenvall-devops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rosenvall-devops-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rosenvall-devops-frontend
    spec:
      serviceAccountName: rosenvall-devops-runtime
      containers:
        - name: frontend
          image: ghcr.io/carnufex/rosenvall-devops-frontend:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
