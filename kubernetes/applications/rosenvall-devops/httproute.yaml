apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rosenvall-devops
  namespace: rosenvall-devops
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  parentRefs:
    - name: external
      namespace: gateway
      sectionName: https
  hostnames:
    - devops.rosenvall.se
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rosenvall-devops-frontend
          port: 8080
