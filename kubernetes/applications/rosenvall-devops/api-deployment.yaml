apiVersion: apps/v1
kind: Deployment
metadata:
  name: rosenvall-devops-api
  namespace: rosenvall-devops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rosenvall-devops-api
  template:
    metadata:
      annotations:
        rosenvall.devops/config-revision: deploy-328278b-2026-05-31
      labels:
        app.kubernetes.io/name: rosenvall-devops-api
    spec:
      serviceAccountName: rosenvall-devops-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/carnufex/rosenvall-devops-api@sha256:bd58eba2b60c2717a7b40d40409c34d414f50c0b6bb57768b83ce4b9f01a38e0
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: rosenvall-devops-config
          env:
            - name: GitHub__AppId
              valueFrom:
                secretKeyRef:
                  name: rosenvall-devops-github-app
                  key: app-id
                  optional: true
            - name: GitHub__AppPrivateKey
              valueFrom:
                secretKeyRef:
                  name: rosenvall-devops-github-app
                  key: private-key
                  optional: true
            - name: GitHub__AppSlug
              valueFrom:
                secretKeyRef:
                  name: rosenvall-devops-github-app
                  key: app-slug
                  optional: true
            - name: GitHub__AppClientId
              valueFrom:
                secretKeyRef:
                  name: rosenvall-devops-github-app
                  key: client-id
                  optional: true
            - name: GitHub__AppClientSecret
              valueFrom:
                secretKeyRef:
                  name: rosenvall-devops-github-app
                  key: client-secret
                  optional: true
            - name: GitHub__WebhookSecret
              valueFrom:
                secretKeyRef:
                  name: rosenvall-devops-github-app
                  key: webhook-secret
                  optional: true
            - name: LocalGit__Password
              valueFrom:
                secretKeyRef:
                  name: rosenvall-devops-forgejo-admin
                  key: password
            - name: HOME
              value: /tmp
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rosenvall-devops-claude
                  key: token
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 3Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: state
              mountPath: /app/data
            - name: codex-home
              mountPath: /app/codex-home
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: rosenvall-devops-state
        - name: codex-home
          persistentVolumeClaim:
            claimName: rosenvall-devops-codex-home
        - name: tmp
          emptyDir: {}
