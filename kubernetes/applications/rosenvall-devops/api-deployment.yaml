apiVersion: apps/v1
kind: Deployment
metadata:
  name: rosenvall-devops-api
  namespace: rosenvall-devops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rosenvall-devops-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rosenvall-devops-api
    spec:
      serviceAccountName: rosenvall-devops-runtime
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/carnufex/rosenvall-devops-api@sha256:ab932f28c470301a400926501b188394b386babb56d12b4939046baa3366db33
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: rosenvall-devops-config
          env:
            - name: GitHub__AppId
              valueFrom:
                secretKeyRef:
                  name: rosenvall-devops-github-app
                  key: app-id
                  optional: true
            - name: GitHub__AppPrivateKey
              valueFrom:
                secretKeyRef:
                  name: rosenvall-devops-github-app
                  key: private-key
                  optional: true
            - name: GitHub__AppSlug
              valueFrom:
                secretKeyRef:
                  name: rosenvall-devops-github-app
                  key: app-slug
                  optional: true
            - name: GitHub__AppClientId
              valueFrom:
                secretKeyRef:
                  name: rosenvall-devops-github-app
                  key: client-id
                  optional: true
            - name: GitHub__AppClientSecret
              valueFrom:
                secretKeyRef:
                  name: rosenvall-devops-github-app
                  key: client-secret
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: state
              mountPath: /app/data
            - name: codex-home
              mountPath: /app/codex-home
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: rosenvall-devops-state
        - name: codex-home
          persistentVolumeClaim:
            claimName: rosenvall-devops-codex-home
