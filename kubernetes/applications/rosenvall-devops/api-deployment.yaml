apiVersion: apps/v1
kind: Deployment
metadata:
  name: rosenvall-devops-api
  namespace: rosenvall-devops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rosenvall-devops-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rosenvall-devops-api
    spec:
      serviceAccountName: rosenvall-devops-runtime
      containers:
        - name: api
          image: ghcr.io/carnufex/rosenvall-devops-api:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: rosenvall-devops-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: state
              mountPath: /app/data
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: rosenvall-devops-state
