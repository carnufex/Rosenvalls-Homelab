apiVersion: v1
kind: ServiceAccount
metadata:
  name: rosenvall-devops-impl-task-cleaner
  namespace: rosenvall-devops
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
---
# Namespaced (least-privilege): the cleaner only touches Jobs in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rosenvall-devops-impl-task-cleaner
  namespace: rosenvall-devops
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rosenvall-devops-impl-task-cleaner
  namespace: rosenvall-devops
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
subjects:
  - kind: ServiceAccount
    name: rosenvall-devops-impl-task-cleaner
    namespace: rosenvall-devops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rosenvall-devops-impl-task-cleaner
