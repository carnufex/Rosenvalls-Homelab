apiVersion: batch/v1
kind: Job
metadata:
  name: rosenvall-devops-forgejo-bootstrap
  namespace: rosenvall-devops
  annotations:
    # A hook, not a tracked resource: a Job's spec.template is immutable, and as a plain
    # resource every image bump made the server-side diff fail on it. ArgoCD then reported
    # the app Synced without applying anything (argoproj/argo-cd#28722; the per-resource
    # ServerSideDiff=false opt-out did not help). Hooks are not diffed: this one is recreated
    # after every sync, once Forgejo is up (it needs the Forgejo pod, see podAffinity).
    # The job is idempotent: create the service user or reset its password.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  manualSelector: true
  selector:
    matchLabels:
      app.kubernetes.io/name: rosenvall-devops-forgejo-bootstrap
      rosenvall.devops/bootstrap: forgejo
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rosenvall-devops-forgejo-bootstrap
        app.kubernetes.io/part-of: rosenvall-devops
        rosenvall.devops/bootstrap: forgejo
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: rosenvall-devops-forgejo
              topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: codeberg.org/forgejo/forgejo:15.0.10-rootless@sha256:6ffebd9ab9ee9f6677e3523fa60debd9de630ff2a226fa681d6cc0c7ba541d77
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              for attempt in $(seq 1 30); do
                echo "bootstrap attempt ${attempt}: ensuring ${FORGEJO_ADMIN_USERNAME}"
                if forgejo admin user create \
                  --admin \
                  --username "$FORGEJO_ADMIN_USERNAME" \
                  --password "$FORGEJO_ADMIN_PASSWORD" \
                  --email rdo@rosenvall.local \
                  --must-change-password=false; then
                  forgejo admin user must-change-password --unset "$FORGEJO_ADMIN_USERNAME"
                  echo "Forgejo RDO service user created."
                  exit 0
                fi

                if forgejo admin user change-password \
                  --username "$FORGEJO_ADMIN_USERNAME" \
                  --password "$FORGEJO_ADMIN_PASSWORD"; then
                  forgejo admin user must-change-password --unset "$FORGEJO_ADMIN_USERNAME"
                  echo "Forgejo RDO service user already existed; password updated."
                  exit 0
                fi

                sleep 2
              done

              echo "Failed to create or update Forgejo RDO service user." >&2
              exit 1
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: FORGEJO__DEFAULT__APP_NAME
              value: Rosenvall DevOps Local Git
            - name: FORGEJO__server__DOMAIN
              value: rosenvall-devops-forgejo.rosenvall-devops.svc.cluster.local
            - name: FORGEJO__server__ROOT_URL
              value: http://rosenvall-devops-forgejo.rosenvall-devops.svc.cluster.local:3000/
            - name: FORGEJO__server__HTTP_PORT
              value: "3000"
            - name: FORGEJO__server__DISABLE_SSH
              value: "true"
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "true"
            - name: FORGEJO__service__REQUIRE_SIGNIN_VIEW
              value: "true"
            - name: FORGEJO__repository__DEFAULT_PRIVATE
              value: private
            - name: FORGEJO__actions__ENABLED
              value: "false"
            - name: FORGEJO__packages__ENABLED
              value: "false"
            - name: FORGEJO_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rosenvall-devops-forgejo-admin
                  key: username
            - name: FORGEJO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rosenvall-devops-forgejo-admin
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: forgejo-data
              mountPath: /var/lib/gitea
      volumes:
        - name: forgejo-data
          persistentVolumeClaim:
            claimName: rosenvall-devops-forgejo-data
