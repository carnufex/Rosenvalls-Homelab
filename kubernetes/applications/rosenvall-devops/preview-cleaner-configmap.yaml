apiVersion: v1
kind: ConfigMap
metadata:
  name: rosenvall-devops-preview-cleaner
  namespace: rosenvall-devops
data:
  cleanup-preview-namespaces.sh: |
    #!/bin/sh
    set -eu

    ttl_hours="${TTL_HOURS:-24}"
    dry_run="${DRY_RUN:-false}"
    now_epoch="$(date -u +%s)"
    ttl_seconds="$((ttl_hours * 3600))"
    selector="app.kubernetes.io/part-of=rosenvall-devops-preview"

    is_guid() {
      echo "$1" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    }

    kubectl get namespaces -l "${selector}" -o go-template='{{range .items}}{{.metadata.name}}{{"\t"}}{{.metadata.creationTimestamp}}{{"\t"}}{{index .metadata.annotations "rosenvall.devops/keep"}}{{"\t"}}{{index .metadata.labels "rosenvall.devops/managed-by"}}{{"\t"}}{{index .metadata.labels "rosenvall.devops/board-id"}}{{"\t"}}{{index .metadata.labels "rosenvall.devops/work-item-id"}}{{"\n"}}{{end}}' |
    while IFS="$(printf '\t')" read -r name created keep managed_by board_id work_item_id; do
      if [ -z "${name}" ] || [ "${name}" = "devops-previews" ]; then
        continue
      fi

      case "${name}" in
        devops-preview-*) ;;
        *)
          echo "skip ${name}: name does not start with devops-preview-"
          continue
          ;;
      esac

      if [ "${managed_by}" != "rosenvall-devops" ]; then
        echo "skip ${name}: missing rosenvall.devops/managed-by=rosenvall-devops"
        continue
      fi

      if ! is_guid "${board_id}"; then
        echo "skip ${name}: missing valid rosenvall.devops/board-id"
        continue
      fi

      if ! is_guid "${work_item_id}"; then
        echo "skip ${name}: missing valid rosenvall.devops/work-item-id"
        continue
      fi

      if [ "${keep}" = "true" ]; then
        echo "keep ${name}: rosenvall.devops/keep=true"
        continue
      fi

      created_for_date="$(echo "${created}" | sed 's/T/ /; s/Z$//')"
      created_epoch="$(date -u -d "${created_for_date}" +%s)"
      age_seconds="$((now_epoch - created_epoch))"

      if [ "${age_seconds}" -lt "${ttl_seconds}" ]; then
        echo "skip ${name}: younger than ${ttl_hours}h"
        continue
      fi

      if [ "${dry_run}" = "true" ]; then
        echo "dry-run delete namespace/${name}"
      else
        echo "delete namespace/${name}"
        kubectl delete namespace "${name}" --wait=false
      fi
    done

