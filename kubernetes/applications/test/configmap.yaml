apiVersion: v1
kind: ConfigMap
metadata:
  name: test-nginx-content
  namespace: test
data:
  index.html: |
    <!doctype html>
    <html lang="sv">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>test.rosenvall.se</title>
      <style>
        :root {
          color-scheme: light dark;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          background: #0f172a;
          color: #f8fafc;
        }

        body {
          align-items: center;
          display: flex;
          justify-content: center;
          margin: 0;
          min-height: 100vh;
        }

        main {
          max-width: 42rem;
          padding: 3rem 1.5rem;
          text-align: center;
        }

        h1 {
          font-size: clamp(2.5rem, 8vw, 5rem);
          margin: 0 0 1rem;
        }

        p {
          color: #cbd5e1;
          font-size: 1.25rem;
          line-height: 1.6;
          margin: 0;
        }
      </style>
    </head>
    <body>
      <main>
        <h1>Hello World</h1>
        <p>NGINX is serving this page from the test namespace at test.rosenvall.se.</p>
      </main>
    </body>
    </html>
