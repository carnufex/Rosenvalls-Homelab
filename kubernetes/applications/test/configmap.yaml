apiVersion: v1
kind: ConfigMap
metadata:
  name: test-nginx-content
  namespace: test
data:
  index.html: |
    <!doctype html>
    <html lang="sv">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>test.rosenvall.se</title>
        <style>
          :root {
            color-scheme: light dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          }

          body {
            align-items: center;
            display: flex;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
          }

          main {
            max-width: 42rem;
            padding: 2rem;
            text-align: center;
          }

          h1 {
            font-size: clamp(2rem, 8vw, 5rem);
            margin: 0 0 1rem;
          }

          p {
            font-size: 1.25rem;
            margin: 0;
          }
        </style>
      </head>
      <body>
        <main>
          <h1>Hello world</h1>
          <p>test.rosenvall.se</p>
        </main>
      </body>
    </html>
