apiVersion: v1
kind: ConfigMap
metadata:
  name: test-nginx-content
  namespace: test
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Rosenvall Test</title>
      <style>
        :root {
          color-scheme: light dark;
          font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          background: #f7f7f4;
          color: #1d2520;
        }

        body {
          min-height: 100vh;
          margin: 0;
          display: grid;
          place-items: center;
        }

        main {
          width: min(92vw, 680px);
          border: 1px solid #d8ddd7;
          border-radius: 8px;
          padding: clamp(24px, 6vw, 56px);
          background: #ffffff;
          box-shadow: 0 18px 50px rgb(29 37 32 / 10%);
        }

        p {
          margin: 0 0 12px;
          color: #4c5a51;
          font-size: 1rem;
          line-height: 1.6;
        }

        h1 {
          margin: 0 0 16px;
          font-size: clamp(2rem, 8vw, 4.5rem);
          line-height: 1;
          font-weight: 800;
        }

        .host {
          display: inline-flex;
          margin-top: 20px;
          padding: 8px 12px;
          border-radius: 6px;
          background: #e8f3ec;
          color: #173f2a;
          font: 600 0.95rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }
      </style>
    </head>
    <body>
      <main>
        <p>NGINX Hello World</p>
        <h1>Rosenvall Test</h1>
        <p>This page is served from the Kubernetes namespace <strong>test</strong>.</p>
        <span class="host">test.rosenvall.se</span>
      </main>
    </body>
    </html>
