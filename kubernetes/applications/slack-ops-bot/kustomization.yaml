apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ns.yaml
  - rbac.yaml
  - externalsecret.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  # Stable name (kustomize does not rewrite the Deployment volume ref to a hashed
  # name in this setup, which would break the mount). Code changes need a manual
  # `kubectl rollout restart deploy/slack-ops-bot -n slack-ops-bot` to take effect.
  - name: slack-ops-bot-code
    files:
      - bot.py
    options:
      disableNameSuffixHash: true
