apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ns.yaml
  - rbac.yaml
  - externalsecret.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  # Hash suffix (default) so the Deployment's volume ref changes when bot.py
  # changes → ArgoCD rolls the pod automatically and it picks up new code.
  - name: slack-ops-bot-code
    files:
      - bot.py
