apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slack-ops-bot
  namespace: slack-ops-bot
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: slack-ops-bot
    creationPolicy: Owner
  data:
    # Slack Socket Mode app-level token (xapp-...).
    - secretKey: SLACK_APP_TOKEN
      remoteRef:
        key: edb7e41a-327a-4435-b187-b472017eb271
    # Same Slack Incoming Webhook the rest of the homelab uses.
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: abeef982-e4eb-4968-9d95-b472015a50c1
