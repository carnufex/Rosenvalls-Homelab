apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library-wd-red
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/component: library
spec:
  capacity:
    storage: 2Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.2
    - hard
    - nointr
  nfs:
    server: 192.168.1.231
    path: /srv/nfs/immich
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library-wd-red
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: immich-library-wd-red
  resources:
    requests:
      storage: 2Ti
