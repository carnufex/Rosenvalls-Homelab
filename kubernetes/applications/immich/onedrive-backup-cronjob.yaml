apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-onedrive-backup
  namespace: immich
spec:
  schedule: "20 4 * * *"
  timeZone: Europe/Stockholm
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: rclone/rclone:1.75.0@sha256:b06aed988cf5967de7c25be5925240983981c757f4ed1ac9d2fa659d51d60548
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/backup.sh"]
              env:
                - name: RCLONE_CONFIG
                  value: /work/rclone/rclone.conf
                - name: RCLONE_CACHE_DIR
                  value: /work/cache
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 1000m
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: rclone-config
                  mountPath: /config/rclone
                  readOnly: true
                - name: library
                  mountPath: /data
                  readOnly: true
                - name: work
                  mountPath: /work
          volumes:
            - name: scripts
              configMap:
                name: immich-onedrive-backup-scripts
                defaultMode: 0555
            - name: rclone-config
              secret:
                secretName: immich-onedrive-backup
            - name: library
              persistentVolumeClaim:
                claimName: immich-library-wd-red
                readOnly: true
            - name: work
              emptyDir: {}
