# STAGED — public ingress for guests' phones via the external gateway (Cloudflare
# tunnel). Add only after the web image is published and health checks pass.
# Flat hostnames so the *.rosenvall.se wildcard cert covers them (media.brollop.*
# would be two levels deep and uncovered).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: wedding
spec:
  parentRefs:
    - name: external
      namespace: gateway
  hostnames:
    # bröllop.rosenvall.se in punycode (HTTPRoute/DNS/cert use ASCII; browsers
    # display the ö). Single label, so the *.rosenvall.se wildcard cert covers it.
    - xn--brllop-xxa.rosenvall.se
  rules:
    - backendRefs:
        - name: web
          port: 80
---
# MinIO S3 endpoint phones PUT/GET blobs to directly (presigned). Must match
# S3_PUBLIC_ENDPOINT in web-secret (https://brollop-media.rosenvall.se).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: media
  namespace: wedding
spec:
  parentRefs:
    - name: external
      namespace: gateway
  hostnames:
    - brollop-media.rosenvall.se
  rules:
    - backendRefs:
        - name: minio
          port: 9000
