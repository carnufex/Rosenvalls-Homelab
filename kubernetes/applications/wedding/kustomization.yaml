apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ACTIVE: the stateful backends (Postgres + MinIO) deploy now on public images.
# The Next.js web tier + public routes stay scaffold-only until the Wedding-POV
# repo publishes registry.rosenvall.se/carnufex/wedding-pov (same approach as matplan/gatebound).
resources:
  - ns.yaml
  - externalsecret.yaml
  - postgres.yaml
  - minio.yaml            # NFS-backed PV (192.168.1.230) + Deployment + bucket job
  - postgres-backup.yaml
  # --- enabled: registry.rosenvall.se/carnufex/wedding-pov is published ---
  - ghcr-image-pull-secret.yaml   # ExternalSecret for the private GHCR pull (shared homelab PAT)
  - web.yaml                      # Next.js app
  - httproute.yaml                # brollop.rosenvall.se + brollop-media.rosenvall.se
