# Next.js app — STAGED until registry.rosenvall.se/carnufex/wedding-pov is published from the
# Wedding-POV repo (image is CHANGE-ME there). Private image → needs the
# ghcr-image-pull-secret (see kustomization staged list). initContainer runs
# prisma migrate deploy before serving.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: wedding
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: web
    spec:
      imagePullSecrets:
        - name: ghcr-image-pull
      initContainers:
        - name: migrate
          image: registry.rosenvall.se/carnufex/wedding-pov:latest
          command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
          envFrom:
            - secretRef:
                name: web-secret
      containers:
        - name: web
          image: registry.rosenvall.se/carnufex/wedding-pov:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: web-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: wedding
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-pdb
  namespace: wedding
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web
