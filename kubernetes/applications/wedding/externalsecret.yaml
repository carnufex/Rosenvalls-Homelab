# All Wedding-POV secrets, generated and stored in Bitwarden (homelab project) —
# never the CHANGE-ME placeholders from the app's secrets.example.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-secret
  namespace: wedding
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: postgres-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_USER: wedding
        POSTGRES_DB: wedding
        POSTGRES_PASSWORD: "{{ .pgpw }}"
  data:
    - secretKey: pgpw
      remoteRef:
        key: c8ffd233-42de-4329-8376-b478015525db
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-secret
  namespace: wedding
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: minio-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MINIO_ROOT_USER: "{{ .miniouser }}"
        MINIO_ROOT_PASSWORD: "{{ .miniopw }}"
  data:
    - secretKey: miniouser
      remoteRef:
        key: e386150a-9cb1-45cd-b32e-b4780155256d
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: miniopw
      remoteRef:
        key: 0da8cf6f-5b1c-4ce3-846b-b47801552537
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-secret
  namespace: wedding
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: web-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql://wedding:{{ .pgpw }}@postgres:5432/wedding?schema=public"
        S3_ENDPOINT: "http://minio:9000"
        S3_REGION: "us-east-1"
        S3_ACCESS_KEY: "{{ .miniouser }}"
        S3_SECRET_KEY: "{{ .miniopw }}"
        S3_BUCKET: "wedding-media"
        # Public TLS endpoint phones use for presigned uploads. Flat hostname so it
        # is covered by the *.rosenvall.se wildcard cert (media.brollop.* would be
        # two levels deep and not covered).
        S3_PUBLIC_ENDPOINT: "https://brollop-media.rosenvall.se"
        ADMIN_PASSWORD: "{{ .adminpw }}"
        SESSION_SECRET: "{{ .session }}"
        NEXT_PUBLIC_APP_ORIGIN: "https://brollop.rosenvall.se"
  data:
    - secretKey: pgpw
      remoteRef: {key: c8ffd233-42de-4329-8376-b478015525db, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None}
    - secretKey: miniouser
      remoteRef: {key: e386150a-9cb1-45cd-b32e-b4780155256d, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None}
    - secretKey: miniopw
      remoteRef: {key: 0da8cf6f-5b1c-4ce3-846b-b47801552537, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None}
    - secretKey: adminpw
      remoteRef: {key: bdfb1c7a-47bd-4163-bf41-b47801552501, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None}
    - secretKey: session
      remoteRef: {key: b3541947-954b-4d41-bdcf-b478015525a9, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None}
