# Public entry point. The SPA shell is public; every /api call needs an
# Authentik token (client cmdb-web, blueprint apps-cmdb.yaml) and only the
# cmdb-* groups can sign in.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cmdb
  namespace: cmdb
spec:
  hostnames:
    - cmdb.rosenvall.se
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
      namespace: gateway
      sectionName: https
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: cmdb-web
          port: 8080
