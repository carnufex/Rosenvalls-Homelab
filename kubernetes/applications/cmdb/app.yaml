# Image refs are bumped by `scripts/deploy.sh --deploy` in carnufex/cmdb.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cmdb-runtime
  namespace: cmdb
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
imagePullSecrets:
  - name: cmdb-registry
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cmdb-config
  namespace: cmdb
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  ASPNETCORE_ENVIRONMENT: Production
  # The migrate step logs every SQL statement at Information otherwise.
  Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
  Auth__Authority: https://authentik.rosenvall.se/application/o/cmdb/
---
apiVersion: v1
kind: Service
metadata:
  name: cmdb-api
  namespace: cmdb
spec:
  selector:
    app.kubernetes.io/name: cmdb-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: cmdb-web
  namespace: cmdb
spec:
  selector:
    app.kubernetes.io/name: cmdb-web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmdb-api
  namespace: cmdb
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cmdb-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cmdb-api
    spec:
      serviceAccountName: cmdb-runtime
      securityContext:
        runAsNonRoot: true
      volumes:
        - name: graph-cache
          emptyDir:
            sizeLimit: 1Gi
      initContainers:
        # Migrations and the type catalog sync run as a separate step (ADR-0009).
        - name: migrate
          image: registry.rosenvall.se/carnufex/cmdb-api:sha-0f5707e@sha256:47fccffb0f7f8fcef100f397e24edfeaa5e3cd953c78719c1d5e68b10ccaef4b
          args: ["--migrate"]
          envFrom:
            - configMapRef:
                name: cmdb-config
            - secretRef:
                name: cmdb-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      containers:
        - name: api
          image: registry.rosenvall.se/carnufex/cmdb-api:sha-0f5707e@sha256:47fccffb0f7f8fcef100f397e24edfeaa5e3cd953c78719c1d5e68b10ccaef4b
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: cmdb-config
            - secretRef:
                name: cmdb-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # The in-memory graph (cmdb#8) starts from this snapshot after a container restart.
            - name: Graph__SnapshotPath
              value: /var/cache/cmdb/graph.bin
          volumeMounts:
            - name: graph-cache
              mountPath: /var/cache/cmdb
          resources:
            requests:
              cpu: 100m
              # The graph holds ~320 MiB at rest; loading from the database peaks around 700 MiB.
              memory: 512Mi
            limits:
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmdb-web
  namespace: cmdb
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cmdb-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cmdb-web
    spec:
      serviceAccountName: cmdb-runtime
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: registry.rosenvall.se/carnufex/cmdb-web:sha-0f5707e@sha256:abf048a11c517a148c873dcd97f725c6f0fba0e424d32e1a7f2e359f10d57c6e
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: API_UPSTREAM
              value: http://cmdb-api:8080
            - name: OIDC_AUTHORITY
              value: https://authentik.rosenvall.se/application/o/cmdb/
            - name: OIDC_CLIENT_ID
              value: cmdb-web
            - name: MAP_BASEMAP
              value: esri
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /config.json
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /config.json
              port: http
            periodSeconds: 10
