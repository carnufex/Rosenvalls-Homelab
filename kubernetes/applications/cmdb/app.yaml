# Image refs are bumped by `scripts/deploy.sh --deploy` in carnufex/cmdb.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cmdb-runtime
  namespace: cmdb
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
imagePullSecrets:
  - name: cmdb-registry
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cmdb-config
  namespace: cmdb
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  ASPNETCORE_ENVIRONMENT: Production
  # The migrate step logs every SQL statement at Information otherwise.
  Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
  Auth__Authority: https://authentik.rosenvall.se/application/o/cmdb/
---
apiVersion: v1
kind: Service
metadata:
  name: cmdb-api
  namespace: cmdb
spec:
  selector:
    app.kubernetes.io/name: cmdb-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: cmdb-web
  namespace: cmdb
spec:
  selector:
    app.kubernetes.io/name: cmdb-web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmdb-api
  namespace: cmdb
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cmdb-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cmdb-api
    spec:
      serviceAccountName: cmdb-runtime
      securityContext:
        runAsNonRoot: true
      initContainers:
        # Migrations and the type catalog sync run as a separate step (ADR-0009).
        - name: migrate
          image: registry.rosenvall.se/carnufex/cmdb-api:sha-d59d489@sha256:1d1e0d066d15ca3c488a666c585fa082dedd26ca040503c395272956841ad867
          args: ["--migrate"]
          envFrom:
            - configMapRef:
                name: cmdb-config
            - secretRef:
                name: cmdb-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      containers:
        - name: api
          image: registry.rosenvall.se/carnufex/cmdb-api:sha-d59d489@sha256:1d1e0d066d15ca3c488a666c585fa082dedd26ca040503c395272956841ad867
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: cmdb-config
            - secretRef:
                name: cmdb-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmdb-web
  namespace: cmdb
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cmdb-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cmdb-web
    spec:
      serviceAccountName: cmdb-runtime
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: registry.rosenvall.se/carnufex/cmdb-web:sha-d59d489@sha256:dea0db3bec9b3cba10a6767c4b7137c54b71ca01dac734f717441bde690ec6cd
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: API_UPSTREAM
              value: http://cmdb-api:8080
            - name: OIDC_AUTHORITY
              value: https://authentik.rosenvall.se/application/o/cmdb/
            - name: OIDC_CLIENT_ID
              value: cmdb-web
            - name: MAP_BASEMAP
              value: esri
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /config.json
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /config.json
              port: http
            periodSeconds: 10
