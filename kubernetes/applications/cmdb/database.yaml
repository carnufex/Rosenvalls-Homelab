# PostGIS on CloudNativePG. Single instance: the data is synthetic and
# regenerated by the cmdb datagen, so no replica and no Longhorn backup group.
# postgis is not a trusted extension, so it is created here as superuser;
# the EF migrations then find it (CREATE EXTENSION IF NOT EXISTS).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cmdb-postgresql
  namespace: cmdb
spec:
  instances: 1
  inheritedMetadata:
    labels:
      # Longhorn reads recurring-job labels from the PVC: the "cnpg" group only
      # trims. These databases are backed up with logical dumps instead.
      recurring-job.longhorn.io/source: enabled
      recurring-job-group.longhorn.io/cnpg: enabled

  # Debian 13 "standard" image; the bare 17-3.5 tag is bullseye and frozen. Plan: docs/operations/cnpg-postgres-18-plan.md
  imageName: ghcr.io/cloudnative-pg/postgis:17-3.6-standard-trixie

  # The app's connection pool never closes its sessions: the default smart shutdown waited the full
  # 180 s on every restart (phase 1: ~3 min down). After 15 s CNPG switches to a fast, still clean, shutdown.
  smartShutdownTimeout: 15

  bootstrap:
    initdb:
      database: cmdb
      owner: cmdb
      secret:
        name: cmdb-postgresql-bootstrap
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS postgis
        - CREATE EXTENSION IF NOT EXISTS pg_trgm

  # Roles that read the database directly, outside the API (carnufex/cmdb ADR-0012).
  # Row-level security limits each to the access scopes naming it in
  # access_scope.db_roles; the API grants SELECT on start.
  managed:
    roles:
      - name: cmdb_rapport_nord
        ensure: present
        login: true
        connectionLimit: 5
        passwordSecret:
          name: cmdb-rapport-nord

  storage:
    size: 10Gi
    storageClass: longhorn

  walStorage:
    size: 4Gi
    storageClass: longhorn

  resources:
    requests:
      memory: 512Mi
      cpu: 100m
    limits:
      memory: 2Gi
      cpu: "2"

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "512MB"
      effective_cache_size: "1GB"
      work_mem: "16MB"
      maintenance_work_mem: "256MB"
