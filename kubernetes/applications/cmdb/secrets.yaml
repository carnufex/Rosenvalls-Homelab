# One Bitwarden entry (CMDB_DB_PASSWORD) feeds both the CNPG bootstrap secret
# and the API connection string.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cmdb-postgresql-bootstrap
  namespace: cmdb
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: cmdb-postgresql-bootstrap
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/basic-auth
      data:
        username: "cmdb"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: 451cda4b-783d-4306-8d6f-b4d201551173 # CMDB_DB_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cmdb-secrets
  namespace: cmdb
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: cmdb-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        ConnectionStrings__Cmdb: "Host=cmdb-postgresql-rw;Database=cmdb;Username=cmdb;Password={{ .password }}"
        # The operations agent's voice channel (carnufex/cmdb ADR-0015): bearer secret for /voice/mcp.
        Voice__Secret: "{{ .voiceSecret }}"
  data:
    - secretKey: password
      remoteRef:
        key: 451cda4b-783d-4306-8d6f-b4d201551173 # CMDB_DB_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: voiceSecret
      remoteRef:
        key: 3a840110-a0cb-4068-a2a3-b4d50109e475 # CMDB_VOICE_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Demo role for direct database access (region Nord only, via RLS).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cmdb-rapport-nord
  namespace: cmdb
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: cmdb-rapport-nord
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "cmdb_rapport_nord"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: e49a73a2-26e0-4b06-bb9c-b4d4015e5a50 # CMDB_RAPPORT_NORD_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
