# One Bitwarden entry (CMDB_DB_PASSWORD) feeds both the CNPG bootstrap secret
# and the API connection string.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cmdb-postgresql-bootstrap
  namespace: cmdb
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: cmdb-postgresql-bootstrap
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/basic-auth
      data:
        username: "cmdb"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: 451cda4b-783d-4306-8d6f-b4d201551173 # CMDB_DB_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cmdb-secrets
  namespace: cmdb
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: cmdb-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        ConnectionStrings__Cmdb: "Host=cmdb-postgresql-rw;Database=cmdb;Username=cmdb;Password={{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: 451cda4b-783d-4306-8d6f-b4d201551173 # CMDB_DB_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
