# One Bitwarden entry (CMDB_DB_PASSWORD) feeds both the CNPG bootstrap secret
# and the API connection string.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cmdb-postgresql-bootstrap
  namespace: cmdb
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: cmdb-postgresql-bootstrap
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/basic-auth
      data:
        username: "cmdb"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: 451cda4b-783d-4306-8d6f-b4d201551173 # CMDB_DB_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cmdb-secrets
  namespace: cmdb
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: cmdb-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        ConnectionStrings__Cmdb: "Host=cmdb-postgresql-rw;Database=cmdb;Username=cmdb;Password={{ .password }}"
        # The voice channel (carnufex/cmdb ADR-0015, #181): one bearer secret per voice endpoint. The shared Voice__Secret
        # only stands in for an endpoint without its own.
        Voice__Secret: "{{ .voiceSecret }}"
        Voice__Secrets__Noc: "{{ .voiceSecretNoc }}"
        Voice__Secrets__ServiceDesk: "{{ .voiceSecretServiceDesk }}"
        Voice__Secrets__It: "{{ .voiceSecretIt }}"
  data:
    - secretKey: password
      remoteRef:
        key: 451cda4b-783d-4306-8d6f-b4d201551173 # CMDB_DB_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: voiceSecret
      remoteRef:
        key: 3a840110-a0cb-4068-a2a3-b4d50109e475 # CMDB_VOICE_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: voiceSecretNoc
      remoteRef:
        key: cd046fef-d209-4d03-b82b-b4df0165bc36 # CMDB_VOICE_SECRET_NOC
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: voiceSecretServiceDesk
      remoteRef:
        key: bd1ed727-c185-40a5-804f-b4df0165bc8d # CMDB_VOICE_SECRET_SERVICEDESK
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: voiceSecretIt
      remoteRef:
        key: 51c029e4-6b57-43b5-9720-b4df0165bce5 # CMDB_VOICE_SECRET_IT
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Demo role for direct database access (region Nord only, via RLS).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cmdb-rapport-nord
  namespace: cmdb
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: cmdb-rapport-nord
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "cmdb_rapport_nord"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: e49a73a2-26e0-4b06-bb9c-b4d4015e5a50 # CMDB_RAPPORT_NORD_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
