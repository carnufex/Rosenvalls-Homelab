apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub-central
  namespace: hub-central
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: hub-central
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hub-central
    spec:
      serviceAccountName: hub-central-runtime
      containers:
        - name: hub-central
          image: registry.rosenvall.se/carnufex/hub-central:sha-d340984
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
