apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hub-central-alias
  namespace: hub-central
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: http
    - name: internal
      namespace: gateway
      sectionName: https
  hostnames:
    - hub-central.rosenvall.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: rosenvall.local
            scheme: https
            statusCode: 301
