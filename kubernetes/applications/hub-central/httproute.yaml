apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hub-central
  namespace: hub-central
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: https
  hostnames:
    - hub-central.rosenvall.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hub-central
          port: 80
